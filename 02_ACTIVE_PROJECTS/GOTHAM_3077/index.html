    <!-- Polyfill and Global Config -->
    <script>
        window.CESIUM_BASE_URL = '/js/';
        (function() {
            function clamp(min, value, max) {
                return Math.max(min, Math.min(max, value));
            }

            function px(value) {
                return Math.round(value) + 'px';
            }

            function setStyles(id, styles) {
                var el = document.getElementById(id);
                if (!el) return;
                Object.keys(styles).forEach(function(key) {
                    el.style[key] = styles[key];
                });
            }

            function getGothamViewportSize() {
                var vv = window.visualViewport;
                // Try visualViewport first, fall back to window dimensions
                // Use offsetWidth/clientWidth as backup for cross-browser accuracy
                var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 1920);
                var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 1080);

                // NOTE: a previous "4K TV fix" forced the physical SCREEN/avail size
                // whenever the monitor was larger than the window. That stretched the
                // globe + HUD to the full monitor width on ANY non-maximized or resized
                // window (the common case), so the globe overflowed and never centered and
                // the left panel was pushed off-screen. We now trust the actual visible
                // viewport (visualViewport, then innerWidth) so the shell adapts to ANY
                // browser shape and size and the globe always centers within the window.

                return { w: Math.max(320, w), h: Math.max(240, h), dpr: window.devicePixelRatio || 1 };
            }

            function forceBox(el, w, h) {
                if (!el) return;
                el.style.position = 'fixed';
                el.style.left = '0px';
                el.style.top = '0px';
                el.style.right = 'auto';
                el.style.bottom = 'auto';
                el.style.width = px(w);
                el.style.height = px(h);
                el.style.minWidth = px(w);
                el.style.minHeight = px(h);
                el.style.maxWidth = px(w);
                el.style.maxHeight = px(h);
                el.style.margin = '0';
                el.style.transformOrigin = '0 0';
            }

            function applyGothamResponsiveShell() {
                if (!document.body || !document.documentElement) return;
                var vp = getGothamViewportSize();
                var w = vp.w;
                var h = vp.h;
                var dpr = vp.dpr;
                var compact = w < 1180 || h < 760 || dpr > 1.35;
                var mobile = w < 720;
                var scale = clamp(0.68, Math.min(w / 1920, h / 1080) * (compact ? 1.22 : 1.08), 1);
                var sideW = mobile ? clamp(240, w * 0.82, 320) : clamp(180, w * (compact ? 0.18 : 0.20), 380);
                var sideReserve = mobile ? 0 : sideW;
                var gap = mobile ? 0 : clamp(6, w * 0.01, 18);
                var topH = mobile ? clamp(52, h * 0.07, 60) : clamp(66, h * (compact ? 0.11 : 0.13), 140);
                var bottomH = mobile ? clamp(112, h * 0.18, 150) : clamp(120, h * (compact ? 0.22 : 0.28), 320);
                var middleLeft = sideReserve + gap;
                var middleRight = sideReserve + gap;
                var middleW = Math.max(0, w - middleLeft - middleRight);

                document.documentElement.style.setProperty('--ghud-ui-scale', scale.toFixed(3));
                document.documentElement.style.setProperty('--app-w', w + 'px');
                document.documentElement.style.setProperty('--app-h', h + 'px');
                document.documentElement.style.setProperty('--ghud-side-active', sideReserve + 'px');
                document.documentElement.style.setProperty('--ghud-top-h', topH + 'px');
                document.documentElement.style.setProperty('--ghud-bottom-h', bottomH + 'px');
                document.body.classList.toggle('gotham-compact-ui', compact);
                document.body.classList.toggle('gotham-mobile-ui', mobile);
                document.documentElement.style.width = px(w);
                document.documentElement.style.height = px(h);
                document.documentElement.style.overflow = 'hidden';
                document.body.style.position = 'fixed';
                document.body.style.inset = '0';
                document.body.style.width = px(w);
                document.body.style.height = px(h);
                document.body.style.minWidth = px(w);
                document.body.style.minHeight = px(h);
                document.body.style.margin = '0';
                document.body.style.overflow = 'hidden';

                // Cinematic intro: add first-load class once
                if (!document.body.classList.contains('gotham-first-load-done')) {
                  document.body.classList.add('gotham-first-load');
                  document.body.classList.add('gotham-first-load-done');
                  setTimeout(function() {
                    document.body.classList.remove('gotham-first-load');
                  }, 2200);
                }

                forceBox(document.getElementById('viewport-wrapper'), w, h);
                forceBox(document.getElementById('cesiumContainer'), w, h);
                forceBox(document.getElementById('viewport-overlay'), w, h);
                forceBox(document.getElementById('viewport-crosshairs'), w, h);

                setStyles('gotham-hud-left', {
                    width: px(sideW),
                    height: px(h),
                    left: '0px',
                    top: '0px'
                });
                setStyles('gotham-hud-right', {
                    width: px(sideW),
                    height: px(h),
                    right: '0px',
                    top: '0px'
                });
                setStyles('gotham-hud-top', {
                    left: px(middleLeft),
                    right: px(middleRight),
                    top: '0px',
                    width: px(middleW),
                    height: px(topH)
                });
                setStyles('gotham-hud-bottom', {
                    left: px(middleLeft),
                    right: px(middleRight),
                    bottom: '0px',
                    width: px(middleW),
                    height: px(bottomH)
                });

                clearTimeout(window._gothamResizeTimer);
                window._gothamResizeTimer = setTimeout(function() {
                    try {
                        var vp = getGothamViewportSize();
                        var w = vp.w;
                        var h = vp.h;
                        var dpr = vp.dpr;
                        var viewerEl = document.querySelector('#cesiumContainer .cesium-viewer');
                        var widgetBox = document.querySelector('#cesiumContainer .cesium-viewer-cesiumWidgetContainer');
                        var widgetEl = document.querySelector('#cesiumContainer .cesium-widget');
                        var canvasEl = document.querySelector('#cesiumContainer canvas, .cesium-widget canvas');
                        [viewerEl, widgetBox, widgetEl].forEach(function(el) { forceBox(el, w, h); });
                        if (canvasEl) {
                            forceBox(canvasEl, w, h);
                            // 4K TV FIX: Set canvas buffer size to physical pixels
                            // This prevents the clipping that happens when
                            // CSS size doesn't match canvas buffer size
                            var physW = Math.max(1, Math.round(w * dpr));
                            var physH = Math.max(1, Math.round(h * dpr));
                            canvasEl.width = physW;
                            canvasEl.height = physH;
                            // Also set style size to match (critical for high-DPI)
                            canvasEl.style.width = px(w);
                            canvasEl.style.height = px(h);
                        }
                        // Force Cesium to resize its render target
                        window.gothamViewer?.resize?.();
                        window.gothamViewer?.scene?.requestRender?.();
                    } catch (e) {
                        console.warn('[GOTHAM] resize skipped:', e.message);
                    }
                }, 60);
            }
            window.applyGothamResponsiveShell = applyGothamResponsiveShell;
            window.addEventListener('resize', applyGothamResponsiveShell);
            window.addEventListener('orientationchange', applyGothamResponsiveShell);
            window.addEventListener('pageshow', applyGothamResponsiveShell);
            window.addEventListener('focus', applyGothamResponsiveShell);
            // Also listen to visualViewport events for mobile/pinch-zoom
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', applyGothamResponsiveShell);
                window.visualViewport.addEventListener('scroll', applyGothamResponsiveShell);
            }
            // 4K TV FIX: Also trigger on devicePixelRatio change (DPI scaling changes)
            (function() {
                var lastDPR = window.devicePixelRatio || 1;
                setInterval(function() {
                    var curDPR = window.devicePixelRatio || 1;
                    if (curDPR !== lastDPR) {
                        lastDPR = curDPR;
                        console.log('[GOTHAM] DPR change detected: ' + curDPR);
                        applyGothamResponsiveShell();
                    }
                }, 500);
            })();
            document.addEventListener('DOMContentLoaded', applyGothamResponsiveShell);
            window.addEventListener('load', applyGothamResponsiveShell);
            // Immediately apply once on script parse (before images load)
            setTimeout(applyGothamResponsiveShell, 0);
            var lastShellSize = '';
            var lastVP = { w: 0, h: 0, dpr: 0 };
            setInterval(function() {
                var vp = getGothamViewportSize();
                var key = [
                    vp.w,
                    vp.h,
                    vp.dpr,
                    window.screen?.width,
                    window.screen?.height,
                    window.screen?.availWidth,
                    window.screen?.availHeight
                ].join('x');
                if (key !== lastShellSize) {
                    lastShellSize = key;
                    lastVP = { w: vp.w, h: vp.h, dpr: vp.dpr };
                    applyGothamResponsiveShell();
                }
            }, 250);

            // Extra: detect monitor changes (moving windows between screens doesn't always fire resize)
            // Force full re-apply when screen dimensions change even without a resize event
            var lastScreenDim = window.screen?.width + 'x' + window.screen?.height;
            var lastScreenAvail = (window.screen?.availWidth || 0) + 'x' + (window.screen?.availHeight || 0);
            var lastWindowW = window.outerWidth;
            var lastWindowH = window.outerHeight;
            var lastInnerW = window.innerWidth;
            var lastInnerH = window.innerHeight;
            var lastDPR = window.devicePixelRatio || 1;
            setInterval(function() {
                var cur = window.screen?.width + 'x' + window.screen?.height;
                var curAvail = (window.screen?.availWidth || 0) + 'x' + (window.screen?.availHeight || 0);
                var curW = window.outerWidth;
                var curH = window.outerHeight;
                var curInnerW = window.innerWidth;
                var curInnerH = window.innerHeight;
                var curDPR = window.devicePixelRatio || 1;
                var screenChanged = cur !== lastScreenDim || curAvail !== lastScreenAvail;
                var windowResized = curW !== lastWindowW || curH !== lastWindowH;
                var viewportScaled = curInnerW !== lastInnerW || curInnerH !== lastInnerH;
                var dprChanged = curDPR !== lastDPR;
                if (screenChanged || windowResized || viewportScaled || dprChanged) {
                    lastScreenDim = cur;
                    lastScreenAvail = curAvail;
                    lastWindowW = curW;
                    lastWindowH = curH;
                    lastInnerW = curInnerW;
                    lastInnerH = curInnerH;
                    lastDPR = curDPR;
                    console.log('[GOTHAM] Viewport change detected: screen=' + cur + ' avail=' + curAvail + ' dpr=' + curDPR);
                    // Full reset — use innerWidth/innerHeight which reflect the new viewport
                    var vp = getGothamViewportSize();
                    applyGothamResponsiveShell();
                    document.body.style.position = 'fixed';
                    document.body.style.left = '0px';
                    document.body.style.top = '0px';
                    document.body.style.width = px(vp.w);
                    document.body.style.height = px(vp.h);
                    document.body.style.minWidth = px(vp.w);
                    document.body.style.minHeight = px(vp.h);
                    document.body.style.margin = '0px';
                    document.body.style.overflow = 'hidden';
                    document.documentElement.style.width = px(vp.w);
                    document.documentElement.style.height = px(vp.h);
                    document.documentElement.style.overflow = 'hidden';
                    try { window.gothamViewer?.resize?.(); } catch(e) {}
                    try { window.gothamViewer?.scene?.requestRender?.(); } catch(e) {}
                }
            }, 300);

            // Also: re-detect viewport on window focus (catches some monitor switches)
            window.addEventListener('focus', function() {
                var vp = getGothamViewportSize();
                document.documentElement.style.width = px(vp.w);
                document.documentElement.style.height = px(vp.h);
                try { window.gothamViewer?.resize?.(); } catch(e) {}
            });
        })();
        
        // FORCE UNREGISTER OLD SERVICE WORKERS
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                registrations.forEach(function(registration) {
                    registration.unregister();
                });
            });
        }
        // Polyfill crypto.randomUUID
        if (!crypto.randomUUID) {
            crypto.randomUUID = function() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    var r = Math.random() * 16 | 0;
                    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
                });
            };
        }
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            min-width: 100vw;
            min-height: 100dvh;
            overflow: hidden;
            background: #05080c;
            font-family: 'Share Tech Mono', 'Courier New', monospace;
        }
        
        #viewport-wrapper,
        #cesiumContainer,
        #cesiumContainer .cesium-viewer,
        #cesiumContainer .cesium-viewer-cesiumWidgetContainer,
        #cesiumContainer .cesium-widget {
            position: fixed !important;
            inset: 0 !important;
            width: 100% !important;
            height: 100% !important;
            min-width: 100% !important;
            min-height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            overflow: hidden !important;
        }

        #cesiumContainer {
            display: block !important;
            visibility: visible !important;
            background: #000;
            z-index: 1;
        }

        /* 4K TV FIX: Canvas must match CSS dimensions exactly */
        #cesiumContainer canvas,
        .cesium-widget canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            display: block !important;
            /* Force pixel-perfect sizing */
            box-sizing: border-box;
        }

        /* Also force widget container to fill the container */
        #cesiumContainer .cesium-viewer-cesiumWidgetContainer {
            width: 100% !important;
            height: 100% !important;
        }
    
    .cesium-viewer-bottom, .cesium-viewer-toolbar, .cesium-widget-credits { 
        display: none !important; 
    }

    /* Boot Sequence Overlay */
    #gotham-boot-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #05080c; z-index: 100000;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        color: #00f0ff; transition: opacity 1s ease-out;
    }
    #boot-content {
        width: 90vw; max-width: 1400px; height: 85vh;
        display: flex; flex-direction: column; justify-content: center;
        padding: 60px; border: 1px solid rgba(0,240,255,0.2); background: rgba(0,240,255,0.02); position: relative;
    }
    #boot-logo { font-size: 120px; font-weight: bold; letter-spacing: 20px; margin-bottom: 10px; text-shadow: 0 0 40px rgba(0,240,255,0.8); text-align: center; }
    #boot-sub { font-size: 18px; letter-spacing: 8px; color: #88aaff; margin-bottom: 50px; text-align: center; }
    #boot-terminal {
        flex: 1; min-height: 220px; overflow-y: auto; font-size: 14px; color: #4488aa;
        line-height: 1.8; border-top: 1px solid rgba(0,240,255,0.1); padding-top: 20px;
        scrollbar-width: none;
    }
    #boot-terminal::-webkit-scrollbar { display: none; }
    #boot-progress-wrap { width: 100%; height: 6px; background: rgba(0,240,255,0.1); margin-top: 30px; position: relative; border-radius: 3px; }
    #boot-progress-bar { width: 0%; height: 100%; background: #00f0ff; box-shadow: 0 0 20px #00f0ff; transition: width 0.2s; border-radius: 3px; }
    .boot-status { position: absolute; right: 0; top: -22px; font-size: 11px; color: #00f0ff; }

    @keyframes scanline { 0% { transform: translateY(-100%) } 100% { transform: translateY(100%) } }
    .boot-scanline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, transparent, rgba(0,240,255,0.05), transparent); pointer-events: none; animation: scanline 4s linear infinite; }
</style>

    <script>
    (function() {
      var pairs = [
        ['toggle-left', 'gotham-hud-left'],
        ['toggle-right', 'gotham-hud-right'],
        ['toggle-top', 'gotham-hud-top'],
        ['toggle-bottom', 'gotham-hud-bottom']
      ];
      pairs.forEach(function(p) {
        var btn = document.getElementById(p[0]);
        var panel = document.getElementById(p[1]);
        if (btn && panel) {
          btn.addEventListener('click', function() {
            if (document.body.classList.contains('gotham-mobile-ui') && (panel.id === 'gotham-hud-left' || panel.id === 'gotham-hud-right')) {
              panel.classList.toggle('mobile-open');
            } else {
              panel.classList.toggle('collapsed');
            }
            // Keep --ghud-side-active set to panel width even when collapsed,
            // so bottom HUD doesn't collapse with it
            var side = panel.id === 'gotham-hud-left' || panel.id === 'gotham-hud-right' ? panel : null;
            if (side) {
              var style = getComputedStyle(document.documentElement);
              var sideW = parseFloat(style.getPropertyValue('--ghud-side-w')) || 320;
              document.documentElement.style.setProperty('--ghud-side-active', sideW + 'px');
            }
            setTimeout(function() { window.gothamViewer?.resize?.(); }, 50);
          });
          btn.addEventListener('touchend', function(e) {
            e.preventDefault();
            if (document.body.classList.contains('gotham-mobile-ui') && (panel.id === 'gotham-hud-left' || panel.id === 'gotham-hud-right')) {
              panel.classList.toggle('mobile-open');
            } else {
              panel.classList.toggle('collapsed');
            }
            var side = panel.id === 'gotham-hud-left' || panel.id === 'gotham-hud-right' ? panel : null;
            if (side) {
              var style = getComputedStyle(document.documentElement);
              var sideW = parseFloat(style.getPropertyValue('--ghud-side-w')) || 320;
              document.documentElement.style.setProperty('--ghud-side-active', sideW + 'px');
            }
            setTimeout(function() { window.gothamViewer?.resize?.(); }, 50);
          });
        }
      });
      var focus = document.getElementById('toggle-focus');
      if (focus) {
        focus.addEventListener('click', function() {
          document.body.classList.toggle('gotham-focus-mode');
          focus.textContent = document.body.classList.contains('gotham-focus-mode') ? 'HUD' : 'FULL';
          setTimeout(function() {
            window.applyGothamResponsiveShell?.();
            window.gothamViewer?.resize?.();
            window.gothamViewer?.scene?.requestRender?.();
          }, 80);
        });
      }
      // Keyboard: H = toggle all panels
      document.addEventListener('keydown', function(e) {
        if (e.target.matches('input,textarea')) return;
        if (e.code === 'KeyH') {
          pairs.forEach(function(p) { document.getElementById(p[1])?.classList.toggle('collapsed'); });
          setTimeout(function() { window.applyGothamResponsiveShell?.(); window.gothamViewer?.resize?.(); }, 50);
        }
        if (e.code === 'KeyF') document.getElementById('toggle-focus')?.click();
      });
    })();
    </script>

    <style>

      /* ── Cinematic Intro Animation ── */
      @keyframes gotham-intro {

        from { transform: translateX(-100%); opacity: 0; }

        from { transform: translateX(100%); opacity: 0; }
        to   { transform: translateX(0); opacity: 1; }
      }
      @keyframes panel-slide-in-top {
        from { transform: translateY(-100%); opacity: 0; }
        to   { transform: translateY(0); opacity: 1; }

        from { transform: translateY(100%); opacity: 0; }

      .intent-graph { height: 60px; background: rgba(0,240,255,0.05); border: 1px solid rgba(0,240,255,0.1); margin-top: 8px; position: relative; overflow: hidden; }
      .panel-lock-btn { position: absolute; width: 24px; height: 24px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.2); color: #888; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; z-index: 1001; }
    </style>

    <!-- WebSocket Data Connection -->
    <script>
        (function() {
            var reconnectDelay = 2000;
            var maxDelay = 30000;

            // Buffer data until entity system is ready
            window._gothamDataBuffer = [];
            window._gothamDataReady = false;
            var MAX_BUFFER_SIZE = 50;

            function dispatchData(data) {
                if (window._gothamDataReady && window.gothamSystem) {
                    // System ready - dispatch directly
                    window.dispatchEvent(new CustomEvent('gotham-data', { detail: data }));
                } else {
                    // System not ready - buffer it (bounded)
                    if (window._gothamDataBuffer.length >= MAX_BUFFER_SIZE) {
                        window._gothamDataBuffer.shift();
                    }
                    window._gothamDataBuffer.push(data);
                    console.log('[GOTHAM] Buffered data snapshot (' + window._gothamDataBuffer.length + ' pending)');
                }
            }

            // Called by gotham-init.js when entity system is ready
            window._gothamFlushDataBuffer = function() {
                window._gothamDataReady = true;
                if (window._gothamDataBuffer.length > 0) {
                    console.log('[GOTHAM] Flushing ' + window._gothamDataBuffer.length + ' buffered data snapshots');
                    // Only replay the LAST buffered snapshot (most complete)
                    var last = window._gothamDataBuffer[window._gothamDataBuffer.length - 1];
                    window._gothamDataBuffer = [];
                    window.dispatchEvent(new CustomEvent('gotham-data', { detail: last }));
                }
                // Also fetch fresh data as backup
                fetch('/api/data').then(function(r) { return r.json(); }).then(function(data) {
                    console.log('[GOTHAM] Fresh /api/data fetch for initial render');
                    window.dispatchEvent(new CustomEvent('gotham-data', { detail: data }));
                }).catch(function(err) { console.warn('[GOTHAM] /api/data fetch failed:', err); });
            };

            function connect() {
                var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                var host = window.location.host || (window.location.hostname + ":3002");
                var ws = new WebSocket(protocol + '//' + host);
                window._gothamWS = ws;
                window.gothamWS = ws;

                ws.onopen = function() {
                    console.log('[GOTHAM] WebSocket connected');
                    reconnectDelay = 2000;
                };

                ws.onmessage = function(e) {
                      try {
                          var msg = JSON.parse(e.data);
                          if (msg.data) {
                              dispatchData(msg.data);
                          }
                          if (msg.type === 'agent_command') {
                              window.dispatchEvent(new CustomEvent('gotham-agent-command', { detail: msg }));
                          }
                      } catch (err) {
                          console.warn('[GOTHAM] Bad message:', err.message);
                      }
                };

                ws.onclose = function() {
                    console.log('[GOTHAM] Reconnecting in ' + (reconnectDelay / 1000) + 's...');
                    setTimeout(connect, reconnectDelay);
                    reconnectDelay = Math.min(reconnectDelay * 1.5, maxDelay);
                };

                ws.onerror = function() {
                    ws.close();
                };
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', connect);
            } else {
                connect();
            }
        })();
    </script>
</body>
