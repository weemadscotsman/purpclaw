<!doctype html>
<meta charset="utf-8">
<title>PURPCLAW — Cockpit</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  PURPCLAW Cockpit — the light UI, cloned from the Next.js Mission Control.

  Same layout: header (LIVE / OP / clock), the left rail with its stage groups
  and two-letter codes, the chat transcript, and the full composer bar with its
  flyout menus. Plus the two things Mission Control lacked: a sessions sidebar
  and a single consolidated Work panel.

  Served BY the unified API on :7780, so it is same-origin — SSE streaming needs
  no CORS, there is no bundler, no dev server, no turbopack cache to corrupt,
  and no build step between an edit and the running UI.
-->
<style>
  :root{
    --bg:#07070c; --panel:#0e0e18; --panel2:#12121f; --line:#20202f; --ink:#e9e9f4; --dim:#7c7c99;
    --violet:#a855f7; --cyan:#22d3ee; --amber:#f59e0b; --red:#f43f5e; --green:#34d399; --pink:#ec4899;
    --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--mono);overflow:hidden;
       display:grid;grid-template-rows:46px 1fr;grid-template-columns:64px 232px 1fr;
       grid-template-areas:"hd hd hd" "rail side main"}

  /* ── header ────────────────────────────────────────────────────────── */
  header{grid-area:hd;display:flex;align-items:center;gap:14px;padding:0 14px;
         border-bottom:1px solid var(--line);background:var(--panel)}
  .logo{width:30px;height:30px;border-radius:7px;background:
        radial-gradient(circle at 30% 30%,var(--violet),#3b0764);box-shadow:0 0 14px rgba(168,85,247,.45)}
  .live{display:flex;align-items:center;gap:6px;color:var(--green);font-size:11px;letter-spacing:1px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green)}
  .dot.off{background:var(--red);box-shadow:0 0 7px var(--red)}
  .spacer{flex:1}
  .op{font-size:11px;color:var(--dim)}
  .op b{color:var(--cyan)}
  #clock{font-size:11px;color:var(--dim)}
  .hbtn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;
        color:var(--dim);cursor:pointer;font:inherit;font-size:11px}

  /* ── left rail ─────────────────────────────────────────────────────── */
  #rail{grid-area:rail;background:var(--panel);border-right:1px solid var(--line);
        overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
  .stage{color:var(--amber);font-size:8px;letter-spacing:1.5px;margin:12px 0 4px}
  .rb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);
      color:var(--dim);cursor:pointer;font:inherit;font-size:11px;position:relative;flex:none}
  .rb:hover{color:var(--ink);border-color:var(--violet)}
  .rb.on{color:var(--cyan);border-color:var(--cyan);box-shadow:0 0 10px rgba(34,211,238,.25)}

  /* ── sessions sidebar ──────────────────────────────────────────────── */
  #side{grid-area:side;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;min-height:0}
  #newchat{margin:10px;padding:8px;border:1px solid var(--violet);background:transparent;color:var(--violet);
           border-radius:8px;cursor:pointer;font:inherit;font-size:12px}
  #newchat:hover{background:rgba(168,85,247,.13)}
  .shead{padding:6px 14px;color:var(--dim);font-size:9px;letter-spacing:1.5px}
  #sessions{flex:1;overflow:auto;min-height:0}
  .s{padding:8px 14px;cursor:pointer;border-left:2px solid transparent;color:var(--dim);font-size:12px;
     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s:hover{background:rgba(255,255,255,.04);color:var(--ink)}
  .s.on{border-left-color:var(--violet);background:rgba(168,85,247,.1);color:var(--ink)}

  /* ── main ──────────────────────────────────────────────────────────── */
  main{grid-area:main;display:flex;flex-direction:column;min-width:0;min-height:0}
  #log{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:13px}
  .m{max-width:min(780px,90%);padding:11px 14px;border-radius:11px;white-space:pre-wrap;word-wrap:break-word}
  .me{align-self:flex-end;background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.42)}
  .ai{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
  .meta{font-size:10px;color:var(--dim);margin-top:6px}
  .tool{align-self:flex-start;font-size:11px;color:var(--cyan);border:1px dashed rgba(34,211,238,.35);
        padding:4px 9px;border-radius:7px;background:rgba(34,211,238,.06)}
  .tool.bad{color:var(--red);border-color:rgba(244,63,94,.45);background:rgba(244,63,94,.08)}
  .empty{margin:auto;color:var(--dim)}

  /* ── panel drawer (rail targets) ───────────────────────────────────── */
  #panel{position:absolute;inset:46px 0 0 296px;background:var(--bg);overflow:auto;padding:20px;display:none;z-index:20}
  body.panel #panel{display:block}
  .ptitle{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .ptitle b{font-size:15px}
  .ptitle .x{margin-left:auto;cursor:pointer;color:var(--dim);border:1px solid var(--line);
             border-radius:50%;width:24px;height:24px;text-align:center;line-height:22px}
  .card{border:1px solid var(--line);background:var(--panel);border-radius:11px;padding:15px;margin-bottom:14px}
  .card h3{margin:0 0 11px;font-size:10px;letter-spacing:1.6px;color:var(--cyan);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:9px}
  .a{border:1px solid var(--line);border-radius:9px;padding:9px;background:var(--panel2)}
  .a b{color:var(--ink);font-size:12px}.a span{display:block;color:var(--dim);font-size:10px}
  .stat{display:inline-block;margin-right:26px;margin-bottom:8px}
  .stat b{display:block;font-size:21px;color:var(--violet)}
  .stat span{color:var(--dim);font-size:10px;letter-spacing:1px}

  /* ── composer ──────────────────────────────────────────────────────── */
  #bar{border-top:1px solid var(--line);background:var(--panel);padding:10px 12px 4px}
  #in{width:100%;resize:none;min-height:42px;max-height:180px;padding:10px 12px;border-radius:10px;
      background:var(--bg);border:1px solid var(--line);color:var(--ink);font:inherit}
  #in:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 2px rgba(168,85,247,.14)}
  .chips{display:flex;align-items:center;gap:7px;padding:8px 2px 0;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--panel2);color:var(--dim);border-radius:20px;
        padding:5px 11px;font-size:11px;cursor:pointer;white-space:nowrap;position:relative}
  .chip:hover{color:var(--ink);border-color:var(--violet)}
  .chip.on{color:var(--cyan);border-color:rgba(34,211,238,.5)}
  .chip.danger{color:var(--red);border-color:rgba(244,63,94,.5)}
  .chip.violet{color:var(--violet);border-color:rgba(168,85,247,.5)}
  .push{margin-left:auto}
  #send{border:none;background:var(--violet);color:#fff;border-radius:20px;padding:6px 16px;cursor:pointer;font:inherit}
  #send:disabled{opacity:.45;cursor:not-allowed}
  .hint{padding:6px 4px 9px;color:var(--dim);font-size:10px}
  .menu{position:absolute;bottom:34px;left:0;min-width:190px;background:var(--panel2);
        border:1px solid var(--line);border-radius:10px;padding:6px;display:none;z-index:40;
        box-shadow:0 12px 34px rgba(0,0,0,.6)}
  .chip.open .menu{display:block}
  .mh{color:var(--dim);font-size:9px;letter-spacing:1.4px;padding:5px 9px}
  .mi{padding:6px 9px;border-radius:7px;cursor:pointer;color:var(--ink);font-size:12px}
  .mi:hover{background:rgba(168,85,247,.16)}
  .mi.sel{color:var(--cyan)}
  @media(max-width:900px){
    body{grid-template-columns:56px 1fr;grid-template-areas:"hd hd" "rail main"}
    #side{display:none} #panel{left:56px}
  }
</style>

<header>
  <div class="logo"></div>
  <div class="live"><span class="dot" id="live"></span>LIVE</div>
  <div class="spacer"></div>
  <div class="op">OP: <b>Admin</b></div>
  <div id="clock"></div>
  <button class="hbtn" title="Onboarding / how it works">?</button>
  <button class="hbtn" title="Settings">◈</button>
</header>

<nav id="rail"></nav>

<aside id="side">
  <button id="newchat">＋ New chat</button>
  <div class="shead">SESSIONS</div>
  <div id="sessions"></div>
</aside>

<main>
  <div id="log"><div class="empty">Type anything. Enter to send.</div></div>
  <div id="bar">
    <textarea id="in" placeholder="Message PURPCLAW…  (Enter to send, Shift+Enter newline)"></textarea>
    <div class="chips" id="chips"></div>
    <div class="hint">Enter to send · Shift+Enter newline · menus above ↑</div>
  </div>
</main>

<div id="panel"></div>

<script>
const API = location.origin;                       // same-origin — no CORS, no config
const $  = s => document.querySelector(s);
const el = (c,t)=>{const d=document.createElement('div');d.className=c;if(t!=null)d.textContent=t;return d;};

/* ── rail: same stage groups + codes as Mission Control ─────────────── */
const RAIL = [
  ['START',   [['MS','Mission Spine','overview'],['AS','Asher','asher']]],
  ['WORK',    [['WK','Work','work']]],
  ['OBSERVE', [['DR','Dream Swarm','dream'],['DA','Data Analysis','data']]],
  ['CONTROL', [['GK','Risk Gate','gate'],['AB','Abliterator','abl'],['CG','Cognitive Mesh','cog'],
               ['EV','Self-Evolution','evo'],['SM','System Map','map']]],
];
function renderRail(){
  const r=$('#rail'); r.innerHTML='';
  RAIL.forEach(([stage,items])=>{
    r.appendChild(el('stage',stage));
    items.forEach(([code,label,id])=>{
      const b=document.createElement('button');
      b.className='rb'; b.textContent=code; b.title=label; b.dataset.panel=id;
      b.onclick=()=>openPanel(id,label);
      r.appendChild(b);
    });
  });
}

/* ── composer chips (cloned from the Next bottom bar) ───────────────── */
const state={ mode:'Chat', agents:2, auto:true, memory:'Project', folder:'Current Folder', access:'Full System', tokens:0 };
const MENUS={
  mode:   ['Chat','Plan','Execute','Swarm'],
  memory: ['Off','Session','Project','Persistent'],
  access: ['Read Only','Review','Agent Actions','Full System'],
};
function renderChips(){
  const c=$('#chips'); c.innerHTML='';
  const mk=(txt,cls,menuKey,onPick)=>{
    const b=el('chip'+(cls?' '+cls:''),null);
    b.textContent=txt;
    if(menuKey){
      const m=el('menu'); m.appendChild(el('mh',menuKey.toUpperCase()));
      MENUS[menuKey].forEach(opt=>{
        const i=el('mi'+(state[menuKey]===opt?' sel':''),opt);
        i.onclick=e=>{e.stopPropagation();onPick(opt);renderChips();};
        m.appendChild(i);
      });
      b.appendChild(m);
      b.onclick=e=>{e.stopPropagation();document.querySelectorAll('.chip').forEach(x=>x!==b&&x.classList.remove('open'));b.classList.toggle('open');};
    }
    c.appendChild(b); return b;
  };
  mk('＋');
  mk('💬 '+state.mode,'on','mode',v=>state.mode=v);
  mk('👤 '+state.agents);
  mk((state.auto?'🤖 AUTO':'🤖 MANUAL'), state.auto?'on':'').onclick=()=>{state.auto=!state.auto;renderChips();};
  mk('🧠 '+state.memory,'violet','memory',v=>state.memory=v);
  mk('📂 '+state.folder);
  mk('⚡ Chips');
  const t=mk(state.tokens+' tk'); t.classList.add('push');
  mk('🔴 '+state.access,'danger','access',v=>state.access=v);
  const s=document.createElement('button'); s.id='send'; s.textContent='→'; s.onclick=send; c.appendChild(s);
}
document.addEventListener('click',()=>document.querySelectorAll('.chip').forEach(x=>x.classList.remove('open')));

/* ── sessions ───────────────────────────────────────────────────────── */
const LS='purpclaw.cockpit.sessions', LS_CUR='purpclaw.cockpit.current';
let sessions=load(LS,[]), current=localStorage.getItem(LS_CUR)||'';
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(){try{localStorage.setItem(LS,JSON.stringify(sessions));localStorage.setItem(LS_CUR,current)}catch{}}
function cur(){return sessions.find(s=>s.id===current)}
function newChat(){
  current='ck-'+Date.now().toString(36);
  sessions.unshift({id:current,title:'New chat',msgs:[]}); sessions=sessions.slice(0,40);
  state.tokens=0; save(); renderSessions(); renderLog(); renderChips(); $('#in').focus();
}
function renderSessions(){
  const b=$('#sessions'); b.innerHTML='';
  sessions.forEach(s=>{const d=el('s'+(s.id===current?' on':''),s.title||'New chat');
    d.onclick=()=>{current=s.id;save();renderSessions();renderLog();}; b.appendChild(d);});
}
function renderLog(){
  const log=$('#log'); log.innerHTML=''; const s=cur();
  if(!s||!s.msgs.length){log.appendChild(el('empty','Type anything. Enter to send.'));return;}
  s.msgs.forEach(m=>{const d=el('m '+(m.role==='user'?'me':'ai'),m.text);
    if(m.meta)d.appendChild(el('meta',m.meta)); log.appendChild(d);});
  log.scrollTop=log.scrollHeight;
}

/* Reasoning and raw tool JSON are internals — never shown. */
function clean(t){
  let o=String(t||'').replace(/<think>[\s\S]*?<\/think>/gi,'');
  const k=o.lastIndexOf('<think>'); if(k!==-1)o=o.slice(0,k);

  // Strip {"tool": …} blocks by COUNTING braces. A regex with [^{}]* cannot do
  // this: real args nest (a PowerShell command contains @{N='Free(GB)';…}) and
  // the whole block leaked into the reply as prose. Tool activity is already
  // shown as badges above the bubble.
  for(;;){
    const start=o.search(/\{\s*"tool"\s*:/);
    if(start===-1)break;
    let depth=0,end=-1,inStr=false,esc=false;
    for(let i=start;i<o.length;i++){
      const c=o[i];
      if(esc){esc=false;continue}
      if(c==='\\'){esc=true;continue}
      if(c==='"'){inStr=!inStr;continue}
      if(inStr)continue;
      if(c==='{')depth++;
      else if(c==='}'){depth--; if(depth===0){end=i+1;break}}
    }
    if(end===-1){o=o.slice(0,start);break}   // unterminated: still streaming
    o=o.slice(0,start)+o.slice(end);
  }
  return o.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trimStart();
}

/* ── send (SSE) ─────────────────────────────────────────────────────── */
let busy=false;
async function send(){
  const box=$('#in'); const text=box.value.trim(); if(!text||busy)return;
  if(!cur())newChat(); const s=cur();
  if(s.title==='New chat')s.title=text.slice(0,38);
  s.msgs.push({role:'user',text}); box.value=''; renderSessions(); renderLog();

  busy=true; const sendBtn=$('#send'); if(sendBtn)sendBtn.disabled=true;
  const bubble=el('m ai',''); const meta=el('meta','…');
  bubble.appendChild(meta); $('#log').appendChild(bubble); $('#log').scrollTop=1e9;

  let raw='';
  try{
    const r=await fetch(API+'/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream'},
      body:JSON.stringify({message:text,session_id:current,source:'cockpit'})});
    if(!r.ok||!r.body)throw new Error('HTTP '+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder(); let buf='';
    for(;;){
      const{value,done}=await rd.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      const blocks=buf.split('\n\n'); buf=blocks.pop()||'';
      for(const b of blocks){
        let ev='message',data='';
        for(const ln of b.split('\n')){
          if(ln.startsWith('event:'))ev=ln.slice(6).trim();
          else if(ln.startsWith('data:'))data+=ln.slice(5).trim();
        }
        if(!data)continue; let d; try{d=JSON.parse(data)}catch{continue}
        if(ev==='token'){
          raw+=d.content||'';
          bubble.textContent=clean(raw); bubble.appendChild(meta);
          meta.textContent=d.model||'streaming…';
          state.tokens=Math.round(raw.length/4); renderChips();
          $('#log').scrollTop=1e9;
        }else if(ev==='tool-call'){
          $('#log').insertBefore(el('tool','◌ '+d.tool),bubble);
        }else if(ev==='tool-result'){
          const last=[...document.querySelectorAll('.tool')].pop();
          if(last){
            const ok=d.ok!==false;
            last.textContent=(ok?'✓ ':'✗ ')+(d.tool||'')+(ok?'':' — '+String(d.error||'failed').slice(0,80));
            if(!ok)last.classList.add('bad');     // a failure must LOOK failed, not spin
          }
        }else if(ev==='error'){
          bubble.textContent='error: '+(d.error||'unknown'); bubble.appendChild(meta); meta.textContent='failed';
        }else if(ev==='done'){
          const fin=clean(d.reply||raw)||'(no output)';
          bubble.textContent=fin; bubble.appendChild(meta);
          meta.textContent=[d.model,d.toolCalls?d.toolCalls+' tools':''].filter(Boolean).join(' · ')||'done';
          s.msgs.push({role:'assistant',text:fin,meta:meta.textContent});
        }
      }
    }
  }catch(e){
    bubble.textContent='error: '+e.message; bubble.appendChild(meta); meta.textContent='failed';
    s.msgs.push({role:'assistant',text:'error: '+e.message,meta:'failed'});
  }finally{
    busy=false; const sb=$('#send'); if(sb)sb.disabled=false; save(); renderSessions();
  }
}

/* ── panels ─────────────────────────────────────────────────────────── */
async function openPanel(id,label){
  document.body.classList.add('panel');
  const p=$('#panel'); p.innerHTML='';
  const head=el('ptitle'); const b=document.createElement('b'); b.textContent=label; head.appendChild(b);
  const x=el('x','✕'); x.onclick=()=>document.body.classList.remove('panel'); head.appendChild(x);
  p.appendChild(head);
  const body=el('body-wrap'); p.appendChild(body);

  if(id==='work'){ body.innerHTML='<div class="card">loading…</div>'; body.innerHTML=await workHtml(); return; }
  if(id==='overview'){ body.innerHTML=await overviewHtml(); return; }
  body.innerHTML='<div class="card"><h3>'+label.toUpperCase()+
    '</h3><div style="color:var(--dim)">Not wired in the cockpit yet. It exists in the Next UI; '+
    'say the word and it gets ported here with a real data source.</div></div>';
}

async function getJSON(u){ try{ const r=await fetch(API+u); return r.ok?await r.json():null }catch{ return null } }

async function overviewHtml(){
  const h=await getJSON('/api/health'); const rt=h&&h.runtime;
  return `<div class="card"><h3>RUNTIME</h3>
    <div class="stat"><b>${h?'LIVE':'DOWN'}</b><span>STATUS</span></div>
    <div class="stat"><b>${h?Math.round(h.uptime/60)+'m':'—'}</b><span>UPTIME</span></div>
    <div style="margin-top:10px;color:var(--dim);font-size:11px">${
      rt?rt.runtimeId+' · '+rt.profile+'/'+rt.workspace+' · v'+rt.version:'runtime identity unavailable'}</div></div>`;
}

/* One consolidated Work panel: roster + tower + jobs, instead of three rail buttons. */
async function workHtml(){
  const [h,reg,pipe]=await Promise.all([getJSON('/api/health'),getJSON('/api/agents/registry'),getJSON('/api/pipeline')]);
  const roster=(reg&&(reg.agents||reg.registry?.agents))||(pipe&&pipe.registry?.agents)||[];
  const swarm=(pipe&&pipe.swarm?.agents)||[];
  const working=swarm.filter(a=>a.status==='working').length;
  let out=`<div class="card"><h3>WORKFORCE</h3>
    <div class="stat"><b>${roster.length}</b><span>AGENTS</span></div>
    <div class="stat"><b>${working}</b><span>WORKING</span></div>
    <div class="stat"><b>${swarm.length}</b><span>SPAWNED</span></div>
    <div class="stat"><b>${h?'ONLINE':'DOWN'}</b><span>TOWER</span></div></div>`;
  out += roster.length
    ? `<div class="card"><h3>AGENT ROSTER</h3><div class="grid">${
        roster.map(a=>`<div class="a"><b>${a.emoji||''} ${a.name||''}</b><span>${a.role||''}</span><span>${a.division||''}</span></div>`).join('')
      }</div></div>`
    : `<div class="card"><h3>AGENT ROSTER</h3><div style="color:var(--dim)">roster endpoint returned nothing</div></div>`;
  return out;
}

/* ── boot ───────────────────────────────────────────────────────────── */
$('#newchat').onclick=newChat;
$('#in').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
function tick(){ $('#clock').textContent=new Date().toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
tick(); setInterval(tick,1000);
async function ping(){ try{const r=await fetch(API+'/api/health');$('#live').className=r.ok?'dot':'dot off';}catch{$('#live').className='dot off';} }
ping(); setInterval(ping,15000);
renderRail(); renderChips();
if(!sessions.length||!cur())newChat(); else {renderSessions();renderLog();}
</script>
