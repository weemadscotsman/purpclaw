/* ── particle heartbeat ─────────────────────────────────────────────── */
/* The working bubble's spinner is wired to the real run state, not an
   infinite CSS loop pretending something is happening. Same particle idea
   as the desktop toy, scaled to 22px. */
const RMOT=(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)||false;
const PULSE_CANVAS=(()=>{const c=document.createElement('canvas');c.width=22;c.height=22;
  c.style.cssText='width:16px;height:16px;flex:none';return c})();
const PULSE={mode:null,raf:0,t:0,parts:Array.from({length:9},()=>({a:Math.random()*Math.PI*2,r:Math.random()}))};
const PULSE_CFG={THINKING:{rad:7,spd:.55,jit:1.6},OBSERVING:{rad:8.6,spd:.28,jit:.5},
  TOOL_RUNNING:{rad:4.2,spd:2.4,jit:.5},
  VERIFYING:{rad:8,spd:.9,jit:.2,pull:1},FAILOVER:{rad:6,spd:1.4,jit:.9,sweep:1},
  GENTLE:{rad:6.5,spd:.18,jit:.7},COLLAPSE:{rad:7,spd:.8,jit:.3,collapse:1}};
function pulseMode(state){
  const map={THINKING:'THINKING',ROUTING:'FAILOVER',TOOL_RUNNING:'TOOL_RUNNING',OBSERVING:'OBSERVING',
    VERIFYING:'VERIFYING',WAITING_APPROVAL:'GENTLE',STEERED:'FAILOVER',PAUSED:'GENTLE',
    FAILOVER:'FAILOVER',COMPLETION_HELD:'GENTLE',COMPLETE:'COLLAPSE',QUEUED:'GENTLE'};
  PULSE.mode=map[state]||null;PULSE.t=0;
  cancelAnimationFrame(PULSE.raf);PULSE.raf=0;
  if(PULSE.mode&&PULSE_CANVAS.isConnected){
    if(RMOT)drawPulse(0);
    else PULSE.raf=requestAnimationFrame(stepPulse);
  }
}
function stepPulse(ts){
  if(!PULSE.mode)return;
  if(!PULSE_CANVAS.isConnected){PULSE.raf=0;return}
  PULSE.t+=1/60;drawPulse(PULSE.t);
  if(PULSE.mode==='COLLAPSE'&&PULSE.t>1.1)return;   // collapse, then rest
  PULSE.raf=requestAnimationFrame(stepPulse);
}
function drawPulse(t){
  const cfg=PULSE_CFG[PULSE.mode];if(!cfg)return;
  const ctx=PULSE_CANVAS.getContext('2d'),W=PULSE_CANVAS.width,cx=W/2,cy=W/2;
  ctx.clearRect(0,0,W,W);
  let rad=cfg.rad;
  if(cfg.collapse)rad=Math.max(0,cfg.rad*(1-t/1.0));
  if(cfg.pull)rad=Math.max(1.2,cfg.rad/(1+t*.8));
  for(const p of PULSE.parts){
    const a=p.a+t*cfg.spd+p.r*.6;
    const rr=rad+(cfg.jit?Math.sin(t*2+p.r*9)*cfg.jit:0);
    const x=cx+Math.cos(a)*rr+(cfg.sweep?Math.sin(t*1.5)*2.5:0);
    const y=cy+Math.sin(a)*rr;
    ctx.beginPath();ctx.arc(x,y,cfg.collapse?1.4-p.r*.4:1.5,0,7);
    ctx.fillStyle='rgba(166,108,255,'+(0.45+p.r*.5)+')';ctx.fill();
  }
}
function mountPulse(host){
  if(PULSE_CANVAS.parentNode)PULSE_CANVAS.parentNode.removeChild(PULSE_CANVAS);
  host.insertBefore(PULSE_CANVAS,host.firstChild);
}

/* ── run activity trail ─────────────────────────────────────────────── */
/* Ordered evidence rows inside the working bubble. Tool args/results stay
   collapsed under a row until clicked — no raw tool output in the chat. */
function runAddRow(row){RUN.rows.push({icon:row.icon||'◌',label:row.label||'',detail:row.detail||'',state:row.state||'done'});paintRunPanel()}
function runFinishRow(d){
  for(let i=RUN.rows.length-1;i>=0;i--){const r=RUN.rows[i];
    if(r.state==='live'&&r.label.startsWith(d.tool||'\u0000')){
      r.state=d.ok!==false?'ok':'bad';r.icon=d.ok!==false?'✓':'✗';
      if(d.content)r.detail+=(r.detail?'\n':'')+'result: '+String(d.content).slice(0,400);
      break}}
  paintRunPanel();
}
function paintRunPanel(){
  if(!RUN.rpanel)return;
  RUN.rpanel.innerHTML='';
  if(!RUN.rows.length){RUN.rpanel.appendChild(el('runrow','no activity recorded yet'));return}
  RUN.rows.slice(-80).forEach(r=>{
    const row=el('runrow '+(r.state==='bad'?'bad':r.state==='ok'?'ok':''));
    row.appendChild(el('rico',r.icon));
    row.appendChild(el('rlabel',r.label));
    if(r.detail){
      const det=el('rdet',r.detail);row.appendChild(det);row.style.cursor='pointer';
      row.title='click for detail';row.onclick=()=>row.classList.toggle('exp');
    }
    RUN.rpanel.appendChild(row);
  });
}

/* One gate episode = one evolving row. Core's internal retries update the
   same line — remediation belongs to the run ledger, not N chat tombstones. */
function heldRowUpdate(attempt,msg,detail){
  const label='completion held'+(attempt?' · retry '+attempt:'')+' — '+msg;
  if(RUN.heldIdx!=null&&RUN.rows[RUN.heldIdx]){
    const r=RUN.rows[RUN.heldIdx];r.label=label;if(detail)r.detail=detail;
  }else{
    runAddRow({icon:'↻',label,detail,state:'live'});
    RUN.heldIdx=RUN.rows.length-1;
  }
  paintRunPanel();
}
function heldRowResolve(ok){
  if(RUN.heldIdx==null||!RUN.rows[RUN.heldIdx])return;
  const r=RUN.rows[RUN.heldIdx];
  r.icon=ok?'✓':'✗';r.state=ok?'ok':'bad';
  r.label=ok?'completion gate satisfied — evidence complete':'not verified after retries — answer withheld';
  RUN.heldIdx=null;paintRunPanel();
}

/* ── in-run approval card ───────────────────────────────────────────── */
/* Shows Approve / Deny buttons for reacharound, tool-approval and
   approval-request events.  Buttons call the canonical approval API.
   The card is managed outside RUN.rows to avoid double-rendering. */
let _approvalCard=null;   // direct DOM reference — not in RUN.rows
function showApprovalCard(requestId, tool, reason, detail){
  hideApprovalCard();
  const id='approval-row-'+Date.now();
  const row=document.createElement('div');
  row.id=id;
  row.className='runrow warn';
  row.style.cssText='flex-direction:column;align-items:stretch;gap:6px;padding:10px 12px';
  row.innerHTML=`<div style="display:flex;align-items:center;gap:8px">
    <span style="font-size:15px">⏸</span>
    <div style="flex:1">
      <div style="font-weight:600;font-size:12.5px">Approval required — ${esc(tool||'tool')}</div>
      ${reason?'<div style="font-size:11px;color:var(--dim);margin-top:2px">'+esc(reason)+'</div>':''}
      ${detail?'<div style="font-size:10.5px;color:var(--dim);margin-top:2px;white-space:pre-wrap">'+detail+'</div>':''}
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:2px">
    <button id="${id}-ok" class="b" style="flex:1;background:#15803d;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer">✓ Approve</button>
    <button id="${id}-no" class="b" style="flex:1;background:#b91c1c;color:#fff;border:none;padding:6px 12px;border-radius:4px;font-size:12px;cursor:pointer">✗ Deny</button>
  </div>`;
  row.querySelector('#'+id+'-ok').onclick=async()=>{
    row.querySelector('#'+id+'-ok').disabled=true;row.querySelector('#'+id+'-no').disabled=true;
    try{
      const r=await fetch(API+'/api/approvals/'+encodeURIComponent(requestId)+'/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      if(r.ok)hideApprovalCard();else{const j=await r.json();alert('Approve failed: '+(j.error||r.status));row.querySelector('#'+id+'-ok').disabled=false;row.querySelector('#'+id+'-no').disabled=false;}
    }catch(e){alert('Network error: '+e.message);row.querySelector('#'+id+'-ok').disabled=false;row.querySelector('#'+id+'-no').disabled=false;}
  };
  row.querySelector('#'+id+'-no').onclick=async()=>{
    row.querySelector('#'+id+'-ok').disabled=true;row.querySelector('#'+id+'-no').disabled=true;
    try{
      const r=await fetch(API+'/api/approvals/'+encodeURIComponent(requestId)+'/deny',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
      if(r.ok)hideApprovalCard();else{const j=await r.json();alert('Deny failed: '+(j.error||r.status));row.querySelector('#'+id+'-ok').disabled=false;row.querySelector('#'+id+'-no').disabled=false;}
    }catch(e){alert('Network error: '+e.message);row.querySelector('#'+id+'-ok').disabled=false;row.querySelector('#'+id+'-no').disabled=false;}
  };
  _approvalCard=row;
  if(RUN.rpanel)RUN.rpanel.appendChild(row);
}
function hideApprovalCard(){
  if(_approvalCard){
    if(_approvalCard.parentNode)_approvalCard.parentNode.removeChild(_approvalCard);
    _approvalCard=null;
  }
}

/* ── steer / follow-up queue ────────────────────────────────────────── */
async function apiSteer(action,extra={}){
  try{const r=await fetch(API+'/api/steer',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action,session_id:cur,source:'cockpit',...extra})});
    return r.ok?await r.json():null}catch{return null}
}
function mkQB(label,title,act){const b=document.createElement('button');b.type='button';
  b.className='qb'+(act==='steer'?' steer':'');b.textContent=label;b.title=title;b.dataset.act=act;return b}
function paintQueue(){
  const qc=$('#queuecard');if(!qc)return;
  qc.innerHTML='';
  const typed=busy?$('#in').value.trim():'';
  if(Q.length)qc.appendChild(el('qhead','QUEUED FOR AFTER THIS RUN'));
  Q.forEach(q=>{
    const r=el('qrow');r.draggable=true;r.dataset.qid=q.id;
    r.appendChild(el('qdrag','⋮⋮'));
    r.appendChild(el('qtext',q.text));
    r.append(mkQB('↑ Steer','Inject into the running mission now','steer'),
             mkQB('✎','Edit before it runs','edit'),mkQB('🗑','Remove from queue','del'));
    r.ondragstart=e=>e.dataTransfer.setData('text/purpclaw-qid',q.id);
    r.ondragover=e=>{e.preventDefault();r.classList.add('dragover')};
    r.ondragleave=()=>r.classList.remove('dragover');
    r.ondrop=e=>{e.preventDefault();r.classList.remove('dragover');
      const src=e.dataTransfer.getData('text/purpclaw-qid');if(!src||src===q.id)return;
      const from=Q.findIndex(x=>x.id===src),to=Q.findIndex(x=>x.id===q.id);
      if(from<0||to<0)return;Q.splice(to,0,Q.splice(from,1)[0]);paintQueue()};
    r.onclick=e=>{const act=e.target.dataset&&e.target.dataset.act;if(!act)return;
      if(act==='steer')doSteer(q.text,q.id);
      else if(act==='del'){Q=Q.filter(x=>x.id!==q.id);paintQueue()}
      else if(act==='edit'){Q=Q.filter(x=>x.id!==q.id);const box=$('#in');box.value=q.text;
        box.dispatchEvent(new Event('input'));box.focus();paintQueue()}};
    qc.appendChild(r);
  });
  if(busy&&typed){
    qc.appendChild(el('qhead','CURRENT QUEUED INSTRUCTION'));
    const r=el('qrow');
    r.appendChild(el('qdrag','⋮⋮'));
    r.appendChild(el('qtext',typed));
    r.append(mkQB('↑ Steer','Inject into the running mission now','steer'),
             mkQB('✎','Keep editing (focus the composer)','edit'),mkQB('🗑','Discard this text','del'));
    r.onclick=e=>{const act=e.target.dataset&&e.target.dataset.act;if(!act)return;
      if(act==='steer')doSteer(typed,null);
      else if(act==='edit')$('#in').focus();
      else if(act==='del'){const box=$('#in');box.value='';box.dispatchEvent(new Event('input'))}};
    qc.appendChild(r);
  }
}
async function doSteer(text,qid){
  if(!busy||!text)return;
  setRun('STEERED','Steered','injecting at the next safe point…');
  const r=await apiSteer('steer',{directive:text});
  if(r&&r.ok){
    const s=C();
    if(qid){
      // Steer of a queued item — update the queued bubble in s.msgs to 'steer'.
      Q=Q.filter(x=>x.id!==qid);paintQueue();
      if(s){const m=s.msgs.find(x=>x.qid===qid);if(m){m.state='steer';sv();
        // TURN-UNIT LAW: patch the queued bubble in place — paintLog() here
        // would rebuild the transcript mid-run and detach the live bubble.
        const dom=$('#log').querySelector('.msg[data-qid="'+qid+'"]');
        if(!dom)paintLog()}
      }
    }else{
      // Steer directly from composer — append one user bubble, no rebuild.
      if(s){s.msgs.push({role:'user',text,state:'steer'});sv();
        $('#log').appendChild(messageBubble(s.msgs[s.msgs.length-1]));maybeFollowLatest();
      }
      const box=$('#in');box.value='';box.dispatchEvent(new Event('input'));
    }
    runAddRow({icon:'↪',label:'steered: '+text.slice(0,80)});
  }else{
    runAddRow({icon:'✗',label:'steer not delivered',state:'bad',
      detail:'the run may have just finished — send it as a normal message instead'});
  }
}
async function pauseRun(){
  if(!busy)return;
  if(RUN.state==='PAUSED'){
    await apiSteer('resume');   // release any unconsumed pause so the next message is not assassinated
    $('#in').focus();return}    // resume = keep typing; queue drains on next send
  setRun('PAUSED','⏸ Paused','waiting for the current step to land — state kept');
  const r=await apiSteer('pause',{reason:'operator pause'});
  if(!r)runAddRow({icon:'!',label:'pause request failed to reach Core',state:'bad'});
}
function paintPause(){
  const b=$('#pauseBtn');if(!b)return;
  b.classList.toggle('on',RUN.state==='PAUSED');
  b.textContent=RUN.state==='PAUSED'?'▶':'✋';
  b.title=RUN.state==='PAUSED'?'Paused — type to resume after this run':'Hold at the next safe point (state is kept)';
}
function paintPlaceholder(){
  const box=$('#in');if(!box)return;
  box.placeholder=busy?'Keep typing to queue follow-up changes…  (Enter queues · ↑ Steer injects now)'
    :'Message PURPCLAW…  (Ctrl+Enter to send)';
}
function paintActivePill(){
  const rc=[...document.querySelectorAll('#recent .rc')].find(x=>x.classList.contains('on'));
  if(!rc)return;
  let s=rc.querySelector('.rcstate');
  if(!(busy&&RUN.state!=='IDLE')){if(s)s.remove();return}
  if(!s){s=el('rcstate');rc.appendChild(s)}
  s.className='rcstate '+({PAUSED:'warn',WAITING_APPROVAL:'warn',COMPLETION_HELD:'warn',
    FAILED:'bad',CANCELLED:'bad',COMPLETE:'okc'}[RUN.state]||'');
  const lead={PAUSED:'Ⅱ PAUSED',STEERED:'↪ steered',COMPLETION_HELD:'🐟 completion held',
    WAITING_APPROVAL:'⏸ approval',FAILED:'✗ failed',CANCELLED:'■ stopped',COMPLETE:'✓ complete'}[RUN.state]
    ||('● '+RUN.label);
  s.textContent=lead+(RUN.calls?' · '+RUN.calls+(RUN.calls===1?' call':' calls'):'')
    +(RUN.state==='TOOL_RUNNING'&&RUN.detail?' · '+RUN.detail.slice(0,40):'');
}
function drainQueue(){
  if(busy||!Q.length)return;
  const next=Q.shift();paintQueue();
  const s=C();
  if(s){
    // P0.5.5 — The queued message was already added to s.msgs when queued.
    // Find it by qid and update it to 'active' so the operator sees the
    // transition from queued → active in the same bubble. Also update RUN.state
    // up front so companionAngolin() paints the correct sprite before paintLog()
    // rebuilds the bubble — the queued bubble should show active processing state.
    if(next.id){
      const existing=s.msgs.find(m=>m.qid===next.id);
      if(existing){existing.state='active';existing.turnId=null;existing.intentClass=null}
    }
    if(s.title==='New mission')s.title=next.text.slice(0,40);
    // Set RUN.state to RECEIVED before painting so the bubble sprite shows active.
    setRun('RECEIVED','Active','processing queued message');
    sv();paintRail();
    // TURN-UNIT LAW: patch the queued bubble to 'active' in place — no
    // paintLog() rebuild (would detach the transcript mid-transition).
    const existing=s.msgs.find(m=>m.qid===next.id);
    const dom=next.id?$('#log').querySelector('.msg[data-qid="'+next.id+'"]'):null;
    if(dom){dom.replaceWith(messageBubble(existing||{role:'user',text:next.text,state:'active',qid:next.id}));}
    else paintLog();
  }
  sendText(next.text,s);
}

/* ── send ───────────────────────────────────────────────────────────── */
let busy=false,currentAbort=null,recognition=null;
function stopGeneration(){if(currentAbort)currentAbort.abort();if(busy)apiSteer('clear')}
function toggleVoice(){
  /* VOICE MODE LAW: mic button = canonical voice toggle. Full loop
     (STT→chat→TTS→listen) + overlay lives in media/voice-mode.js;
     this legacy path stays as fallback when that module is absent. */
  if(window.VoiceMode){window.VoiceMode.toggle();return}
  if(recognition){recognition.stop();return}
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){note('Voice input is not available in this browser.');return}
  recognition=new SpeechRecognition();recognition.continuous=true;recognition.interimResults=true;
  const box=$('#in'),base=box.value;
  recognition.onresult=e=>{let finalText='',interim='';for(let i=0;i<e.results.length;i++){
      const text=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=text;else interim+=text}
    box.value=[base,finalText||interim].filter(Boolean).join(base?' ':'');box.dispatchEvent(new Event('input'))};
  recognition.onend=()=>{recognition=null;S.voice=false;paintCtl();box.focus()};
  recognition.onerror=e=>{if(e.error!=='aborted')note('Voice input stopped: '+e.error)};
  try{S.voice=true;recognition.start();paintCtl()}catch{recognition=null;S.voice=false;paintCtl()}
}
/* Enter while idle sends; Enter while running queues the follow-up for after
   the run. Steer is the only path that touches the live mission. */
async function send(){
  const box=$('#in'),text=box.value.trim();if(!text)return;
  if(busy){
    const qid='q-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
    Q.push({id:qid,text});
    // P0.5.5 — Queued messages must appear in the chat log immediately so
    // the operator can see their intent was recorded, not swallowed.
    const s=C();if(s){s.msgs.push({role:'user',text,state:'queued',qid});sv();
      // TURN-UNIT LAW: mid-run enqueue appends one bubble — never paintLog(),
      // which would wipe the transcript and detach the live run bubble.
      $('#log').appendChild(messageBubble(s.msgs[s.msgs.length-1]));maybeFollowLatest()}
    box.value='';box.style.height='auto';box.dispatchEvent(new Event('input'));
    paintQueue();return;
  }
  if(!C())newMission();
  const s=C();if(s.title==='New mission')s.title=text.slice(0,40);
  // P0.5.3 — Wire supersedeTurn + isAuthoritative into the live send path.
  // Create the new turn record first so it can be the replacement target
  // for any stale turn we mark as superseded. Then look at the most recent
  // stale executable turn in this session; if one exists, mark it
  // SUPERSEDED by the new operator correction. Then the dispatch-boundary
  // gate below refuses to dispatch anything that is not the freshest
  // authoritative turn.
  const intentClass = TA.classifyIntent(text);
  const newTurn = TA.newTurn({
    sessionId: cur,
    intentClass,
    authority: TA.AUTHORITY.CURRENT,
    status: TA.TURN_STATUS.OPEN,
    rawText: text,
    visibleText: '',
    emptyOutput: false,
  });
  TURN_STATE.push(cur, newTurn);
  let retryTarget = null;
  if (intentClass === TA.INTENT_CLASSES.RETRY) {
    const resolved = TA.resolveRetryTarget(TURN_STATE.all(), cur, newTurn);
    if (!resolved.ok) {
      // P0.5.4 — surface retry failure to the operator visibly instead of
      // silently swallowing it. The retry must resolve to a specific turn;
      // if no unambiguous retryable failure exists, say so.
      TURN_STATE.update(cur, newTurn.turnId, { status: TA.TURN_STATUS.CANCELLED, failureClass: 'RETRY_TARGET_UNKNOWN' });
      note('Retry target unknown — no retryable failed turn to repeat.');
      s.msgs.push({role:'error',text:'RETRY_TARGET_UNKNOWN',meta:'retry'});
      box.value='';
      sv();paintLog();
      return;
    }
    retryTarget = resolved.turn;
    // Mark the retry turn with retryOf linkage.
    TURN_STATE.update(cur, newTurn.turnId, { retryOf: retryTarget.turnId, status: TA.TURN_STATUS.OPEN });
    s.msgs.push({role:'user',text:`Retry: ${retryTarget.rawText.slice(0,80)}`,turnId:newTurn.turnId,intentClass,retryOf:retryTarget.turnId});
    box.value='';
    followLatest=true;sv();paintRail();paintLog();
    await sendText(retryTarget.rawText, s, newTurn);
    return;
  }
  if (intentClass !== TA.INTENT_CLASSES.RETRY) {
    const stale = TA.resolveSupersedeTarget(TURN_STATE.all(), cur, newTurn.turnId);
    if (stale) {
      TA.supersedeTurn(TURN_STATE.all(), cur, stale.turnId, newTurn.turnId, 'FRESH_OPERATOR_CORRECTION');
    }
  }
  s.msgs.push({role:'user',text,turnId:newTurn.turnId,intentClass});
  box.value='';box.style.height='auto';followLatest=true;sv();paintRail();paintLog();
  await sendText(text,s,newTurn);
}
async function sendText(text,s,operatorTurn){
  // P0-4 LAW: DOM nodes can never become chat content. Coerce anything
  // non-string at the dispatch boundary (a past bug stringified a live
  // element into "[object HTMLDivElement]" and re-sent it).
  if(typeof text!=='string'){try{text=(text&&text.textContent!=null)?text.textContent:String(text);}catch(_){text=String(text);}}
  text=String(text||'').trim();
  if(busy)return;if(!s)s=C();
  busy=true;currentAbort=new AbortController();document.body.classList.add('running');
  Object.assign(RUN,{state:'THINKING',label:'Thinking',detail:'preparing the run',rows:[],
    calls:0,provider:'',startedAt:Date.now(),providerRow:false,capsuleRow:false,heldIdx:null,
    route:null,_answering:false,_firstToken:false});

  // P0.5.3 — Dispatch-boundary authority gate. The turn must still be the
  // freshest authoritative one immediately before we call the provider.
  // If a fresh operator correction has landed since send() registered this
  // turn, refuse to dispatch with a visible note.
  if (operatorTurn && !TA.isAuthoritative(TURN_STATE.all(), cur, operatorTurn)) {
    TURN_STATE.update(cur, operatorTurn.turnId, { status: TA.TURN_STATUS.SUPERSEDED, supersededReason: 'SUPERSEDED_BEFORE_DISPATCH' });
    busy = false;
    document.body.classList.remove('running');
    note('Stale intent — refused to dispatch. The current authoritative turn supersedes this one.');
    s.msgs.push({role:'error',text:'EXECUTION_REJECTED_STALE_INTENT',meta:'rejected'});
    paintLog();
    return;
  }

  // Working bubble: collapsed execution shell. Live draft text streams in the
  // body; every tool/steer/evidence event becomes an ordered row in the
  // expandable trail instead of conversation diarrhoea.
  const bub=el('msg a runbub');
  // AVATAR ROW LAW: live run gets the same row wrapper as history bubbles —
  // card + PurpAngolin avatar sibling on the right, outside the card.
  const runRow=el('mrow mrow-assistant');
  const runAv=el('mavatar purp-avatar');
  const angolin=document.createElement('img');
  angolin.className='companion-angolin';angolin.alt='PurpAngolin';
  angolin.id='companion-angolin-'+(RUN.turnId||'live');
  angolin.onerror=()=>{runAv.classList.add('avatar-fallback');angolin.remove()};
  runAv.appendChild(angolin);
  RUN.activeAngolinId=angolin.id;
  // STREAMING UI P0 FIX: rhead/messageText/mt/rpanel all live inside ONE
  // flex:1/min-width:0 column (rcol); the card DOM node persists across
  // THINKING→ANSWERING→DONE inside the row wrapper.
  const rhead=el('rhead');
  RUN.rtitle=el('rtitle','🟣 Working');RUN.rstat=el('rstat','0 calls · 0.0s');
  const rtog=el('rtog','▾');
  rhead.append(RUN.rtitle,RUN.rstat,rtog);
  rhead.onclick=()=>{bub.classList.toggle('open');rtog.textContent=bub.classList.contains('open')?'▴':'▾'};
  const rcol=el('rcol');                       // flex:1 1 auto; min-width:0
  const messageText=el('mtext'),mt=el('mt','thinking…');
  // THINKING BUBBLE: live model thoughts stream here (reasoning events only).
  // Collapses to "🧠 Thought for Ns" when the first visible token arrives.
  const thinkWrap=el('thinkwrap');
  thinkWrap.style.cssText='display:none;margin:6px 0;border-left:2px solid var(--purple);padding:4px 8px;background:rgba(128,90,213,.08);border-radius:4px';
  const thinkHead=el('thinkhead','💭 Thinking…');
  thinkHead.style.cssText='font:600 10.5px var(--sans);color:#d9c7ff;cursor:pointer;user-select:none';
  const thinkText=el('pre');
  thinkText.id='thinkingText';
  thinkText.style.cssText='margin:4px 0 0;font:400 10.5px var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-word;max-height:140px;overflow-y:auto';
  thinkText.textContent='';
  thinkHead.onclick=()=>{thinkText.style.display=thinkText.style.display==='none'?'block':'none'};
  thinkWrap.append(thinkHead,thinkText);
  mt.replaceWith(thinkWrap,mt);
  mt.style.display='none';                    // hidden until first answer token
  RUN.thinkWrap=thinkWrap;RUN.thinkText=thinkText;RUN.thinkHead=thinkHead;
  RUN.rpanel=el('rpanel');
  rcol.append(messageText,thinkWrap,RUN.rpanel);
  rcol.insertBefore(mt,messageText.nextSibling);
  bub.append(rhead,rcol);
  runRow.append(bub,runAv);                   // [card][avatar]
  // [CHAT_LAYOUT] debug receipt — prints element widths at every phase change.
  // If bodyWidth collapses while messageWidth stays wide, this log names the culprit instantly.
  RUN.layoutProbe=phase=>{try{console.log('[CHAT_LAYOUT]',JSON.stringify({
    phase,
    bubbleWidth:Math.round(bub.getBoundingClientRect().width),
    colWidth:Math.round(rcol.getBoundingClientRect().width),
    bodyWidth:Math.round(messageText.getBoundingClientRect().width),
    headerWidth:Math.round(rhead.getBoundingClientRect().width)}))}catch(_){}};
  $('#log').appendChild(runRow);maybeFollowLatest();
  mountPulse(rhead);
  setRun('THINKING','Thinking','preparing the run');
  if(RUN.layoutProbe)RUN.layoutProbe('THINKING-bubble-created');
  startTimer();paintCtl();paintQueue();paintPlaceholder();

  // The mission envelope — the canonical execution contract (lib/mission-envelope.js).
  // These are not UI preferences: `access` resolves to a permission profile the
  // tool dispatcher enforces, and `memory` bounds how far recall may reach.
  const envelope={mode:S.mode,agents:S.agents,provider:S.provider,speed:S.speed,
    intelligence:S.intelligence,memory:S.memory,workspace:S.workspace,chips:S.chips,
    attachments:S.attachments,access:ACCESS_WIRE[S.access]||'review'};
  const operatorContext={composerMode:S.mode,accessMode:S.access,memoryMode:S.memory,

              const _manualViol=R.routing_mode==='MANUAL'&&_srvProv&&_reqProv&&_reqProv!=='auto'&&_reqProv!==_srvProv;
              const mode=_manualViol?'MANUAL ✗PIN VIOLATION':(R.routing_mode==='MANUAL'?'MANUAL':'AUTO');
              const bits=[mode];
              // POOL TRUTH (2026-08-26): AUTO renders its named pool, then the
              // served model underneath — e.g. "AUTO · OPENROUTER FREE ↳ model".
              // MANUAL renders pin provider + model. Never a hybrid identity.
              if(!_manualViol&&R.routing_mode!=='MANUAL'&&R.pool_id&&R.pool_id!=='global'){
                bits.push(R.pool_id.toUpperCase().replace(/_/g,' '));
                if(R.served&&R.served.model)bits.push('↳ '+String(R.served.model).split('/').pop());
                else if(R.served&&R.served.provider)bits.push('↳ '+providerLabel(R.served.provider));
              } else if(!_manualViol&&R.served&&R.served.provider){
                bits.push(providerLabel(R.served.provider));
                if(R.served&&R.served.model)bits.push(String(R.served.model).split('/').pop());
              }
              else if(_manualViol)bits.push('pinned '+providerLabel(_reqProv)+' · served '+providerLabel(_srvProv));
              if(R.fallback&&R.fallback.occurred&&!_manualViol)bits.push('↻FB');
              if(Array.isArray(R.attempted)&&R.attempted.length>1)bits.push('x'+R.attempted.length);
              b.textContent=bits.join(' · ');
              if(_manualViol){b.style.background='#7a1220';b.style.borderColor='#ff4d6d';b.title='PIN VIOLATION: manual pin was not honored — served by '+_srvProv+' (receipt '+(R.route_id?R.route_id.slice(0,8):'')+')';}
              else b.title='purpclaw.routing-receipt/1'+(R.route_id?' · '+R.route_id.slice(0,8):'')+'\nclick meta line for full receipt';
              mt.appendChild(b);
            }
            paintRoutingReceipt(R);
            // Expandable receipt — click the meta line for full detail (Rule 5).
            mt.style.cursor='pointer';mt.title='click for full telemetry receipt';
            const receiptLines=()=>[
              '── ROUTING ──',
              'Requested       '+reqP+(reqM&&reqM!=='auto'?' · '+reqM:''),
              'Resolved        '+(resProv?providerLabel(resProv):'unknown')+(resModel?' · '+resModel:''),
              ...(Array.isArray(T.fallbackPath)&&T.fallbackPath.length?['Fallbacks       '+T.fallbackPath.length,
                ...T.fallbackPath.map(f=>'  '+providerLabel(f.provider)+(f.statusCode?' · HTTP '+f.statusCode:'')+' · '+(f.status||'failed')+(f.next?' → '+providerLabel(f.next):''))]:[]),
              ...(R?[
                'Receipt         purpclaw.routing-receipt/1'+(R.route_id?' · '+R.route_id.slice(0,8):''),
                ...(R.mode?['Mode            '+R.mode]:[]),
                ...(R.pool_id?['Pool            '+R.pool_id+' ('+(R.fallback_policy||'scored')+')']:[]),
                ...(R.provider_route?['Provider route  '+R.provider_route]:[]),
                ...(Array.isArray(R.attempted)&&R.attempted.length?R.attempted.map(a=>'  #'+a.attempt_index+' '+providerLabel(a.provider)+' · '+(a.model||'').split('/').pop()+' · '+(a.outcome||'?')+(a.status_code?' HTTP '+a.status_code:'')+(a.latency_ms!=null?' '+a.latency_ms+'ms':'')):['Attempts       none recorded']),
                ...(R.fallback&&R.fallback.occurred?['Fallback        from attempt '+R.fallback.from_attempt+' — '+(R.fallback.reason||'unspecified')]:[]),
              ]:[]),
              '── THINKING ──',
              'Effort          '+(T.reasoningState||'n/a'),
              'Tokens          '+(T.reasoningTokens!=null?T.reasoningTokens:'unavailable'),
              '── USAGE ──',
              'Prompt          '+fmtTk(T.promptTokens),
              'Completion      '+fmtTk(T.completionTokens),
              'Reasoning       '+(T.reasoningTokens!=null?fmtTk(T.reasoningTokens):'unavailable'),
              'Total           '+fmtTk(T.totalTokens),
              '── EXECUTION ──',
              'Route           '+(T.route||'CHAT'),
              'Lease           '+(T.lease||'none'),
              'Tool calls      '+(T.toolCalls||0),
              'Agent calls     '+(T.agentCalls||0),
              'Skill calls     '+(T.skillCalls||0),
              '── TIMING ──',
              'TTFT            '+(T.ttftMs!=null?T.ttftMs+' ms':'unavailable'),
              'Total           '+(T.durationMs!=null?(T.durationMs/1000).toFixed(2)+'s':'—'),
              '── STATUS ──',
              String(T.status||d.status||'complete').toUpperCase(),
            ].join('\n');
            let _expanded=false;
            mt.onclick=()=>{
              _expanded=!_expanded;
              if(_expanded){mt._prevText=mt.textContent;mt.textContent=receiptLines();mt.style.whiteSpace='pre';paintRoutingReceipt(R);}
              else{mt.textContent=mt._prevText||'';mt.style.whiteSpace='';paintRoutingReceipt(R);}
            };
            if(RUN.state!=='PAUSED'){
              if(d.ok===false||d.status==='partial')setRun('PARTIAL','Not verified',d.maxTurnsHit?'execution turn limit reached':'completion evidence was not satisfied');
              else setRun('COMPLETE','Complete','run finished — evidence in the trail')}
            const assistantMsg={role:'assistant',text:fin,meta:mt._prevText||mt.textContent,turnId:operatorTurn?.turnId,telemetry:T};
            // STREAMUI P0 (Rule 2): NEVER rebuild the log at done. The bubble
            // already shows the streamed answer; finalize it in place — one
            // markdown normalization pass, no DOM replacement, no scroll jump.
            renderAssistant(messageText,fin);
            // MODE-OFFER LAW: if the runtime flagged an intent mismatch on this
            // turn, append the operator controls under the reply. Structured
            // state only — never parsed from model text.
            const mo=d.modeOffer||window.__purpclaw_modeOffer__;
            window.__purpclaw_modeOffer__=null;
            if(mo&&mo.kind==='EXECUTION_INTENT_NO_LEASE'){
              const row=el('modeoffer');
              const cap=mo.capability?` (${mo.capability})`:'';
              const lbl=document.createElement('span');lbl.textContent=`⚡ needs execution${cap}`;row.appendChild(lbl);
              const bRun=document.createElement('button');bRun.textContent='Run once';
              bRun.onclick=()=>{row.remove();window.__purpclaw_runOnce__=true;$('#in').value=text;send()};
              const bWork=document.createElement('button');bWork.textContent='Switch to Work';
              bWork.onclick=()=>{row.remove();S.mode='work';paintCtl();window.__purpclaw_runOnce__=false;$('#in').value=text;send()};
              const bNo=document.createElement('button');bNo.textContent='Cancel';bNo.onclick=()=>row.remove();
              [bRun,bWork,bNo].forEach(b=>{b.className='mobtn';row.appendChild(b)});
              $('#log').appendChild(row);maybeFollowLatest();
            }
            if (operatorTurn && _ta && finalRetryable === _ta.RETRYABLE.YES) {
              assistantMsg.retryable = true;
              assistantMsg.retryOf = operatorTurn.turnId;
              attachRetryButton(operatorTurn.turnId);
            }
            s.msgs.push(assistantMsg);
          }else{
            // Empty output → structured failure card.
            const fc=_rel;const fcReason=fc.reason||'UNKNOWN';
            const fcCause=fc.cause?` (cause: ${fc.cause})`:'';
            const cardText=`⚠ No assistant output was produced\nstate: ${fc.state}\nreason: ${fcReason}${fcCause}\nturn: ${fc.turn}`;
            renderAssistant(messageText,cardText);
            mt.style.color='#c2410c';mt.textContent='failed · '+fcReason;
            setRun('FAILED','Failed',`empty output · ${fcReason}`);
            const assistantMsg={role:'assistant',text:cardText,meta:'failed · '+fcReason,turnId:operatorTurn?.turnId};
            // Failure cards are also retryable if the failure class allows.
            // STREAMUI P0 (Rule 2): finalize in place — no paintLog() rebuild.
            if (operatorTurn && _ta && finalRetryable === _ta.RETRYABLE.YES) {
              assistantMsg.retryable = true;
              assistantMsg.retryOf = operatorTurn.turnId;
              attachRetryButton(operatorTurn.turnId);
            }
            s.msgs.push(assistantMsg);
          }}
      }}
  }catch(e){
    // P0.5.1 — Persist failure-class on the operator turn so retry can
    // resolve against the live turn registry.
    if (operatorTurn && TA) {
      const failureClass = e.name === 'AbortError' ? 'OPERATOR_CANCEL' : 'NETWORK';
      TURN_STATE.update(cur, operatorTurn.turnId, {
        status: e.name === 'AbortError' ? 'CANCELLED' : 'FAILED',
        failureClass,
        visibleText: clean(raw),
        emptyOutput: !clean(raw),
        retryable: TA.classifyRetryability(failureClass, e.name === 'AbortError' ? 'CANCELLED' : 'FAILED'),
        completedAt: Date.now(),
      });
    }
    if(e.name==='AbortError'){
      setRun('CANCELLED','Stopped','stopped by operator');
      const partial=clean(raw);messageText.textContent=partial||'Response stopped.';mt.textContent='stopped';
      const assistantMsg={role:'assistant',text:messageText.textContent,meta:'stopped',turnId:operatorTurn?.turnId};
      s.msgs.push(assistantMsg); // STREAMUI Rule 2: bubble already on screen — no rebuild
    }else{
      setRun('FAILED','Failed',String(e.message).slice(0,90));
      messageText.textContent='⚠ '+e.message;mt.textContent='failed';
      const assistantMsg={role:'assistant',text:'⚠ '+e.message,meta:'failed',turnId:operatorTurn?.turnId};
      s.msgs.push(assistantMsg); // STREAMUI Rule 2: no rebuild
      // P0.5.2 — surface Retry on network failure bubbles only. Deterministic
      // programming errors (ReferenceError etc.) from fetch are non-retryable.
      const isDeterministic = /^(ReferenceError|SyntaxError|TypeError)/.test(e.name||'');
      if (!isDeterministic && operatorTurn && TA && TA.classifyRetryability('NETWORK', 'FAILED') === TA.RETRYABLE.YES) {
        attachRetryButton(operatorTurn.turnId);
      }
    }
  }finally{
    currentAbort=null;busy=false;document.body.classList.remove('running');stopTimer();
    paintBubbleHead();paintStrip();paintActivePill();paintPlaceholder();
    sv();paintRail();paintCtl();paintQueue();maybeFollowLatest();
    // A paused run waits for the operator; otherwise queued follow-ups drain.
    if(RUN.state!=='PAUSED')setTimeout(drainQueue,300);
    setTimeout(()=>{if(!busy&&RUN.state==='COMPLETE')setRun('IDLE')},3500);
  }
}

// Resets immediately when server responds. Replaces plain setInterval so a
// recovering server isn't dogpiled with three simultaneous requests.
let _hdrFail=0,_hdrTimer=null;
function scheduleHeaderRefresh(){
  if(_hdrTimer)clearTimeout(_hdrTimer);
  const base=15000,max=120000,delay=Math.min(base*Math.pow(2,_hdrFail),max);
  _hdrTimer=setTimeout(async()=>{
    _hdrTimer=null;
    try{
      await refreshHeader();
      if(_hdrFail>0){console.log('[cockpit] server back online — poll reset to',base,'ms');}
      _hdrFail=0;
    }catch{
      _hdrFail++;
      console.warn('[cockpit] header poll fail #'+_hdrFail+' — backing off to',Math.min(base*Math.pow(2,_hdrFail),max)/1000,'s');
    }
    scheduleHeaderRefresh();
  },delay);
}

<div id="zampDock">

<!-- ZAMP mini-player: canvas visualizer + transport, fed by media/zamp/* (see _vendor/PROVENANCE.md).
     Centered inside the glass shell; fully transparent — the dock IS the chrome. -->
<div id="zampMini" style="width:280px;z-index:9000;margin:0 auto;padding:0 8px 6px;
  background:transparent;border:none;border-radius:10px;
  box-shadow:none;font:11px/1.4 monospace;color:var(--ink,#ddd);
  overflow:hidden;">
  <canvas id="zampCanvas" width="278" height="90" style="display:block;width:100%;height:90px;background:transparent;border-radius:10px;"></canvas>
  <div id="zampLabel" style="padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;">no track</div>
  <div style="display:flex;gap:4px;padding:0 6px 6px;">
    <button data-zamp="toggle" title="play/pause">▶/⏸</button>
    <button data-zamp="prev" title="previous">⏮</button>
    <button data-zamp="next" title="next">⏭</button>
    <button data-zamp="prevStyle" title="previous visual">◀</button>
    <span id="zampStyleName" style="flex:1;text-align:center;opacity:.7;align-self:center;">style</span>
    <button data-zamp="nextStyle" title="next visual">▶</button>
    <button data-zamp="hide" title="hide player">×</button>
  </div>
  <div style="display:flex;gap:4px;padding:0 6px 6px;">
    <input id="zampSeek" type="range" min="0" max="1000" value="0" style="flex:1;" title="seek">

  </div>

    <button data-zamp="loadfile" title="load local audio file">Load File</button>

    <button id="zampUndock" title="pop out / dock back">⤢</button>

      border-right:2px solid var(--dim,#666);border-bottom:2px solid var(--dim,#666);opacity:.6;margin-left:2px;"></span>
  </div>

<script>
(function(){
  'use strict';
  var dock=document.getElementById('zampDock');
  var tab=document.getElementById('zampTitlebar');
  // --- cockpit content area (excludes left rail + composer) for centering/clamping ---
  function contentRect(){
    var rail=document.getElementById('rail');
    var lw=rail?rail.getBoundingClientRect().right+12:12;
    var comp=document.querySelector('#composer,#composerBar,.composer');
    var bh=comp?comp.getBoundingClientRect().top-8:window.innerHeight-8;
    return {x:lw,y:64,w:Math.max(240,window.innerWidth-lw-16),
            h:Math.max(160,bh-64)};
  }
  function clampPos(x,y,w,h){
    var c=contentRect();
    if(w>window.innerWidth-20||h>window.innerHeight-20||x<c.x-c.w*.5||x>c.x+c.w||y<0||y>c.y+c.h){
      x=c.x+(c.w-w)/2; y=c.y+(c.h-h)/2;               // recenter in main stage
    }
    x=Math.max(0,Math.min(window.innerWidth-w-8,x));
    y=Math.max(0,Math.min(window.innerHeight-h-8,y));
    return {x:Math.round(x),y:Math.round(y)};
  }
  // --- DOCKED_LEFT_RAIL vs FLOATING_WIDGET: one instance, two homes ---
  var railItem=document.getElementById('zampRailItem');
  function setFloating(f){
    if(f){ // pop out: same DOM, centered in content area or restored pos
      dock.classList.add('floating');
      document.body.setAttribute('data-zamp-floating','1');
      var w=dock.offsetWidth||312,h=dock.offsetHeight||260,x,y,placed=false;
      try{var p=JSON.parse(localStorage.getItem('purpclaw-zamp-pos')||'null');
        if(p&&isFinite(p.x)&&isFinite(p.y)){var cl=clampPos(p.x,p.y,w,h);
          x=cl.x;y=cl.y;placed=true;}}catch(e){}
      if(!placed){var c=contentRect();
        x=c.x+(c.w-w)/2; y=c.y+(c.h-h)/2;}
      dock.style.left=x+'px';dock.style.top=y+'px';
    } else { // dock back into the rail
      dock.classList.remove('floating');
      document.body.removeAttribute('data-zamp-floating');
    }
    try{localStorage.setItem('purpclaw-zamp-floating',f?'1':'0')}catch(e){}
  }
  var startFloating=false;
  try{startFloating=localStorage.getItem('purpclaw-zamp-floating')==='1'}catch(e){}
  if(startFloating)setFloating(true);
  // --- drag (grab the widget title bar; only meaningful while floating) ---
  var dragging=false,dx=0,dy=0,moved=false;
  tab.addEventListener('mousedown',function(e){
    dragging=true;moved=false;dx=e.clientX-dock.offsetLeft;dy=e.clientY-dock.offsetTop;
    e.preventDefault();});
  window.addEventListener('mousemove',function(e){
    if(!dragging)return;moved=true;
    var x=Math.max(0,Math.min(window.innerWidth-60,e.clientX-dx));
    var y=Math.max(0,Math.min(window.innerHeight-40,e.clientY-dy));
    dock.style.left=x+'px';dock.style.top=y+'px';
    try{localStorage.setItem('purpclaw-zamp-pos',JSON.stringify({x:x,y:y}))}catch(e){}});
  window.addEventListener('mouseup',function(){dragging=false});
  tab.addEventListener('mousedown',function(e){
    dragging=true;moved=false;dx=e.clientX-dock.offsetLeft;dy=e.clientY-dock.offsetTop;
    e.preventDefault();});
  tab.addEventListener('click',function(){if(moved)moved=false;});
  var undockBtn=document.getElementById('zampUndock');
  if(undockBtn)undockBtn.addEventListener('click',function(){setFloating(true)});
  var dockBack=document.getElementById('zampDockBack');
  if(dockBack)dockBack.addEventListener('click',function(e){
    e.stopPropagation();setFloating(false);});
  if(railItem)railItem.addEventListener('click',function(ev){
    if(ev.target.closest('#zampRailPlay'))return;   // play button doesn't pop out
    setFloating(true);});
  var railPlay=document.getElementById('zampRailPlay');
  if(railPlay)railPlay.addEventListener('click',function(){
    window.ZampPlayback.toggle();});
  // --- resize grip (bottom-right) ---
  var grip=document.getElementById('zampGrip'),rz=null;
  grip.addEventListener('mousedown',function(e){
    rz={w:dock.offsetWidth,h:dock.offsetHeight,mx:e.clientX,my:e.clientY};
    e.preventDefault();e.stopPropagation();});
  window.addEventListener('mousemove',function(e){
    if(!rz)return;
    var w=Math.max(240,Math.min(window.innerWidth-16,rz.w+e.clientX-rz.mx));
    var h=Math.max(140,Math.min(window.innerHeight-16,rz.h+e.clientY-rz.my));
    dock.style.width=w+'px';
    var cl=clampPos(dock.offsetLeft,dock.offsetTop,w,h);
    dock.style.left=cl.x+'px';dock.style.top=cl.y+'px';
    try{localStorage.setItem('purpclaw-zamp-size',JSON.stringify({w:w,h:h}))}catch(e){}});
  window.addEventListener('mouseup',function(){if(rz){rz=null;
    try{var p=JSON.parse(localStorage.getItem('purpclaw-zamp-pos')||'null')||{};
      localStorage.setItem('purpclaw-zamp-pos',JSON.stringify(p))}catch(e){}}});
  // restore persisted size
  try{var sz=JSON.parse(localStorage.getItem('purpclaw-zamp-size')||'null');
    if(sz&&sz.w>=240)dock.style.width=sz.w+'px';}catch(e){}
  // re-clamp on viewport changes (floating only)
  window.addEventListener('resize',function(){
    if(!dock.classList.contains('floating'))return;
    var cl=clampPos(dock.offsetLeft,dock.offsetTop,dock.offsetWidth,dock.offsetHeight);
    dock.style.left=cl.x+'px';dock.style.top=cl.y+'px';});
})();
</script>

<script src="cockpit/media/zamp/ZampPlayback.js"></script>
<script>
(function(){
  'use strict';
  var mini=document.getElementById('zampMini'), showBtn=document.getElementById('zampShowBtn');
  var canvas=document.getElementById('zampCanvas'), label=document.getElementById('zampLabel'),
      styleNameEl=document.getElementById('zampStyleName'), seek=document.getElementById('zampSeek'),
      vol=document.getElementById('zampVol');

  function visible(v){
    mini.style.display=v?'block':'none';
    showBtn.style.display=v?'none':'block';
    try{localStorage.setItem('purpclaw-zamp-visible',v?'1':'0');}catch(e){}
  }
  try{ if(localStorage.getItem('purpclaw-zamp-visible')!=='0') visible(true); else visible(false);}catch(e){visible(true);}

  window.ZampPlayback.init();

  window.zampVisual.attach(canvas);
  // Canvas-sized instance: registry defaults to fullscreen resize; override for mini-player
  window.zampVisual._resize=function(){
    canvas.width=278;canvas.height=90;
    window.zampVisual._initParticles.call(window.zampVisual);
  };
  window.zampVisual._resize();
  window.zampVisual.start();

  function paint(s){
    label.textContent=s.playing?'▶ '+s.label:'⏸ '+s.label;
    styleNameEl.textContent=(s.styleNames&&s.styleNames[s.styleIndex])||('style '+(s.styleIndex+1)+'/'+s.styleCount);
    // rail footer strip mirrors the same single state
    var rt=document.getElementById('zampRailTrack');
    var rp=document.getElementById('zampRailPlay');
    if(rt)rt.textContent=s.label||'No media';
    if(rp)rp.textContent=s.playing?'⏸':'▶';
  }
  window.ZampPlayback.onChange(paint);
  paint(window.ZampPlayback.getState());

  mini.addEventListener('click',function(ev){
    var a=ev.target.closest('[data-zamp]');if(!a)return;
    var act=a.getAttribute('data-zamp'),P=window.ZampPlayback;
    if(act==='toggle')P.toggle();
    else if(act==='next')P.next();
    else if(act==='prev')P.prev();
    else if(act==='nextStyle')P.cycleStyle(1);
    else if(act==='prevStyle')P.cycleStyle(-1);
    else if(act==='hide')visible(false);
  });
  showBtn.addEventListener('click',function(){visible(true);});
  seek.addEventListener('input',function(){
    var s=window.ZampPlayback.getState();
    if(s.duration>0)window.ZampPlayback.seek(seek.value/1000*s.duration);
  });
  vol.addEventListener('input',function(){window.ZampPlayback.setVolume(vol.value/100);});

  /** Public hook for the rest of the cockpit: hand generated/uploaded media here. */
  window.zampPlayMedia=function(tracks,autoplay){
    visible(true);
    return window.ZampPlayback.load(tracks,autoplay);
  };

  // --- Visualizer selector: dynamic from the ONE registry (no copies) ---
  var vizSel=document.getElementById('zampVizSel');
  if(vizSel&&window.ZampVisualRegistry){
    vizSel.innerHTML=window.ZampVisualRegistry.STYLE_NAMES.map(function(n,i){
      return '<option value="'+i+'">'+esc(n)+'</option>';}).join('');
    vizSel.addEventListener('change',function(){
      window.ZampPlayback.setStyle(parseInt(vizSel.value,10)||0);});
    // keep in sync when style cycles via ◀/▶ buttons
    window.ZampPlayback.onChange(function(s){
      if(document.activeElement!==vizSel)vizSel.value=s.styleIndex;});
  }
  // --- Skin selector: canonical registry + Follow PurpClaw ---
  var skinSel=document.getElementById('zampSkinSel');
  function applyPlayerSkin(){
    try{var v=localStorage.getItem('purpclaw-zamp-skin')||'follow';}catch(e){var v='follow';}
    if(v==='follow'||!document.body.getAttribute('data-skin')){
      mini.removeAttribute('data-skin');            // inherit cockpit tokens
      return;
    }
    mini.setAttribute('data-skin',v);               // deliberate override
  }
  if(skinSel&&window.SKIN_KEYS){
    document.body.addEventListener('skinchange',applyPlayerSkin);
    new MutationObserver(applyPlayerSkin).observe(document.body,{attributes:true,attributeFilter:['data-skin']});
    var opts='<option value="follow">Skin: Follow PurpClaw</option>'+
      window.SKIN_KEYS.map(function(k){return '<option value="'+k+'">'+esc(k)+'</option>';}).join('');
    skinSel.innerHTML=opts;
    try{skinSel.value=localStorage.getItem('purpclaw-zamp-skin')||'follow';}catch(e){}
    skinSel.addEventListener('change',function(){
      try{localStorage.setItem('purpclaw-zamp-skin',skinSel.value)}catch(e){}
      applyPlayerSkin();});
    applyPlayerSkin();
  }
  // --- Load File: local media into the same queue/controller ---
  var fileBtn=mini.querySelector('[data-zamp="loadfile"]'), fileInp=document.getElementById('zampFile');
  if(fileBtn&&fileInp){
    fileBtn.addEventListener('click',function(){fileInp.click();});
    fileInp.addEventListener('change',function(){
      var files=[].slice.call(fileInp.files||[]);
      if(!files.length)return;
      visible(true);
      window.ZampPlayback.load(files.map(function(f){
        return {url:URL.createObjectURL(f),label:f.name};}),true);
      fileInp.value='';
    });
  }
})();
</script>
