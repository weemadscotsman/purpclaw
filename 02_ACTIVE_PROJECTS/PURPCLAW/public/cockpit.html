<!doctype html>
<meta charset="utf-8">
<title>PURPCLAW</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<!--
  PURPCLAW Cockpit — full composer parity, no framework.

  Every control from the Next.js bottom bar is here, with the same options and
  icons, sourced from app/components/composer/types.ts:
    launcher (21 items over Attach/Context/Actions), New, Mode (4), Agents (8),
    Provider (8) + Speed (3) + Intelligence (4), Memory (4), Workspace (6),
    Quick Actions (14), token meter, Access Control (4), voice, send.

  Architecture rule: UI displays state, backend owns state, UI requests actions,
  backend performs them. Nothing canonical lives in this file — delete it and
  PurpClaw still runs from CLI, TUI and API.

  Served same-origin by unified_api (/, /ui, /cockpit): SSE needs no CORS, and
  there is no React, no Next, no bundler, no build step.
-->
<style>
:root{
  --frame:#dcebe2; --canvas:#faf9f6; --card:#fff; --ink:#24242b; --dim:#8b8b96;
  --line:#e8e6df; --line2:#f1efe9;
  --purple:#8b5cf6; --purple-soft:#f3eeff; --mint:#3fae7f; --amber:#d97706; --red:#e11d48;
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; --r:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--frame);font:14px/1.6 var(--sans);color:var(--ink);
     padding:10px;display:flex;gap:10px;overflow:hidden;transition:background .5s}
body.running{background:#ece4ff}

#rail{width:236px;flex:none;background:var(--canvas);border-radius:var(--r);
      display:flex;flex-direction:column;min-height:0;padding:14px 10px}
.wordmark{display:flex;align-items:center;gap:8px;padding:4px 8px 14px}
.wordmark b{font-weight:700;font-size:15px}.wordmark .p{color:var(--purple)}
.status{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--mint)}
.status.off{background:var(--red)}
#newmission{width:100%;padding:10px;border-radius:11px;border:none;background:var(--purple);
   color:#fff;font:600 13px var(--sans);cursor:pointer;margin-bottom:12px}
#newmission:hover{filter:brightness(1.07)}
.nav{display:flex;flex-direction:column;gap:1px}
.nv{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;cursor:pointer;
    color:#4a4a55;font-size:13px}
.nv:hover{background:var(--line2)}
.rhead{padding:16px 10px 6px;color:var(--dim);font-size:10px;letter-spacing:1.2px;font-weight:600}
#recent{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:1px}
.rc{padding:7px 10px;border-radius:9px;cursor:pointer;color:#5a5a66;font-size:12.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rc:hover{background:var(--line2)} .rc.on{background:var(--purple-soft);color:var(--purple)}
.me{margin-top:8px;padding:9px 10px;border-radius:11px;display:flex;align-items:center;gap:9px;
    border:1px solid var(--line);cursor:pointer;font-size:12.5px}
.av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--purple),#c4b5fd)}

main{flex:1;background:var(--canvas);border-radius:var(--r);display:flex;flex-direction:column;
     min-width:0;min-height:0;position:relative}
#top{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--dim);font-size:12px}
#top .sp{flex:1}
.pill{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;color:#5a5a66;background:#fff}
#stage{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0}
.hero{margin:auto;text-align:center;padding:0 20px}
.hero .orb{width:46px;height:46px;border-radius:50%;margin:0 auto 16px;
   background:radial-gradient(circle at 32% 30%,#c4b5fd,var(--purple));box-shadow:0 8px 26px rgba(139,92,246,.32)}
.hero h1{font:600 25px var(--sans);margin:0 0 6px}
.hero p{color:var(--dim);margin:0;font-size:13.5px}
#log{padding:22px 26px;display:flex;flex-direction:column;gap:13px}
.msg{max-width:min(760px,88%);padding:12px 15px;border-radius:15px;white-space:pre-wrap;
     word-wrap:break-word;font-size:13.5px}
.msg.u{align-self:flex-end;background:var(--purple);color:#fff;border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg .mt{font:400 10.5px var(--mono);color:var(--dim);margin-top:7px}
.msg.u .mt{color:#e9ddff}
.tool{align-self:flex-start;display:inline-flex;gap:7px;font:500 11.5px var(--mono);
   color:var(--purple);background:var(--purple-soft);border-radius:20px;padding:5px 12px}
.tool.ok{color:var(--mint);background:#e6f5ee} .tool.bad{color:var(--red);background:#ffe9ee}

/* ── composer ───────────────────────────────────────────────────────── */
#composer{margin:0 auto 10px;width:min(860px,calc(100% - 44px));background:var(--card);
   border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 14px rgba(20,20,30,.05);transition:.3s}
body.running #composer{border-color:#cbb6ff;box-shadow:0 3px 22px rgba(139,92,246,.16)}
#in{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--ink);
    font:14px/1.6 var(--sans);padding:15px 17px 6px;min-height:52px;max-height:180px}
#in::placeholder{color:#a8a8b4}
/* ONE control rail. Never wraps to a second row — the composer must read as a
   single command console, not a toolbar scattered under a text box. Overflow is
   handled by collapsing secondary pills into ＋ (see fitRail), not by wrapping. */
.ctl{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:visible;
     padding:8px 10px 10px;border-top:1px solid var(--line2)}
.b{flex:none}
/* Access is the supervision dial, so it wears the permission colour, not purple. */
.b.acc{background:#fff4ed;color:#c2410c;border-color:#fed7aa;font-weight:600}
.b.acc.lo{background:#effaf1;color:#15803d;border-color:#bbf7d0}
.b.acc.hi{background:#fef1f1;color:#b91c1c;border-color:#fecaca}
.c{position:relative}
.b{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;
   color:#5a5a66;border-radius:10px;padding:6px 9px;font:500 12px var(--sans);cursor:pointer;white-space:nowrap}
.b:hover{background:var(--line2)} .b.on{background:var(--purple-soft);color:var(--purple)}
.sp{flex:1}
#go{width:33px;height:33px;border-radius:50%;border:none;background:var(--purple);color:#fff;
    cursor:pointer;font-size:15px;flex:none}
#go:disabled{opacity:.4;cursor:not-allowed}
.menu{position:absolute;bottom:40px;left:0;min-width:212px;max-width:330px;background:#fff;
   border:1px solid var(--line);border-radius:13px;padding:7px;display:none;z-index:70;
   box-shadow:0 16px 44px rgba(20,20,30,.16);max-height:60vh;overflow:auto}
.menu.right{left:auto;right:0}
.c.open .menu{display:block}
/* Inside the ⋯ tray, a collapsed control's own popover would nest one absolute
   layer inside another and overflow. Flatten them: the pill becomes a heading
   and its options list inline, so the tray reads as one scrollable stack. */
.tray>.menu{overflow-x:hidden;min-width:248px}
.tray>.menu .c{position:static}
.tray>.menu .c>.b{width:100%;justify-content:flex-start;color:var(--dim);
   font:600 9.5px var(--sans);letter-spacing:1.2px;padding:9px 9px 3px;pointer-events:none}
.tray>.menu .c .menu{position:static;display:block;border:none;box-shadow:none;
   padding:0;max-width:none;min-width:0;max-height:none;overflow:visible}
.mh{color:var(--dim);font:600 9.5px var(--sans);letter-spacing:1.2px;padding:8px 9px 4px}
.mi{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:12.5px}
.mi:hover{background:var(--line2)}
.mi.sel{color:var(--purple);font-weight:600;background:var(--purple-soft)}
.mi .tick{margin-left:auto;color:var(--purple)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.foot{text-align:center;color:var(--dim);font-size:11px;padding-bottom:12px}

#drawer{position:absolute;inset:0;background:var(--canvas);border-radius:var(--r);
        padding:22px 26px;overflow:auto;display:none;z-index:50}
body.drawer #drawer{display:block}
.dh{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.dh h2{font:600 18px var(--sans);margin:0}
.dh .x{margin-left:auto;cursor:pointer;color:var(--dim);border:1px solid var(--line);background:#fff;
   border-radius:50%;width:28px;height:28px;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card h3{font:600 10px var(--sans);letter-spacing:1.4px;color:var(--dim);margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(184px,1fr));gap:9px}
.it{border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--canvas)}
.it b{display:block;font-size:12.5px}.it span{display:block;color:var(--dim);font-size:11px}
.stat{display:inline-block;margin:0 26px 10px 0}
.stat b{display:block;font:600 21px var(--sans);color:var(--purple)}
.stat span{color:var(--dim);font-size:10.5px;letter-spacing:.8px}
@media(max-width:860px){#rail{display:none}body{padding:6px}}
</style>

<nav id="rail">
  <div class="wordmark"><span class="p">🟣</span><b>PURP<span class="p">CLAW</span></b><span class="status" id="dot"></span></div>
  <button id="newmission">＋ New Mission</button>
  <div class="nav" id="nav"></div>
  <div class="rhead">RECENT</div>
  <div id="recent"></div>
  <div class="me" id="identity"><span class="av"></span><span id="who">Admin</span></div>
</nav>

<main>
  <div id="top"><span class="pill" id="rt">runtime …</span><span class="sp"></span><span class="pill" id="clock"></span></div>
  <div id="stage">
    <div class="hero" id="hero">
      <div class="orb"></div><h1>What's the mission?</h1>
      <p>Ask PurpClaw anything — it has your machine, your agents and your tools.</p>
    </div>
    <div id="log" style="display:none"></div>
  </div>
  <div id="composer">
    <textarea id="in" placeholder="Message PURPCLAW…  (Ctrl+Enter to send)"></textarea>
    <div class="ctl" id="ctl"></div>
  </div>
  <div class="foot">Ctrl+Enter · drop files · menus above ↑</div>
  <div id="drawer"></div>
</main>

<script>
const API=location.origin,$=s=>document.querySelector(s);
const el=(c,t)=>{const d=document.createElement('div');d.className=c;if(t!=null)d.textContent=t;return d};

/* ── constants: verbatim from app/components/composer/types.ts ──────── */
const MODES=[['chat','Chat','💬'],['plan','Plan','📋'],['execute','Execute','⚡'],['swarm','Swarm','🐝']];
const AGENTS=[['planner','Planner'],['researcher','Research'],['builder','Builder'],['security','Security'],
              ['designer','Designer'],['video','Video'],['audio','Audio'],['custom','Custom']];
const PROVIDERS=[['auto','Auto'],['openai','OpenAI'],['claude','Claude'],['gemini','Gemini'],
                 ['deepseek','DeepSeek'],['kimi','Kimi'],['qwen','Qwen'],['local','Local']];
const SPEEDS=[['fast','⚡ Fast'],['balanced','⚡⚡ Balanced'],['deep','⚡⚡⚡ Deep']];
const INTEL=[['low','🟢 Low'],['medium','🟡 Medium'],['high','🟠 High'],['extreme','🔴 Extreme']];
const MEMORY=[['off','○ Off'],['session','◐ Session'],['project','◉ Project'],['persistent','🧠 Persistent']];
const WORKSPACES=[['dreamforge','DreamForge'],['omnicode','OmniCode'],['gotham','Gotham'],
                  ['openclaw','OpenClaw'],['current','Current Folder'],['custom','Custom Project']];
const CHIPS=['Search','Think','Research','Code','Explain','Design','Debug','Write','Market','Legal','OSINT','Voice','Video','Image'];
const ACCESS=[['readOnly','🟢 Read Only'],['review','🟡 Review'],['agentActions','🟠 Agent Actions'],['fullSystem','🔴 Full System']];
/* UI id → wire value the backend envelope enforces. Keep in step with lib/mission-envelope.js. */
const ACCESS_WIRE={readOnly:'read-only',review:'review',agentActions:'agent-actions',fullSystem:'full-system'};
const LAUNCHER=[
  ['Attach',[['file','Files','📄'],['folder','Folder','📁'],['image','Images','🖼️'],['audio','Audio','🎵'],
             ['video','Video','🎬'],['url','URL','🔗'],['clipboard','Clipboard','📋'],['recent','Recent Files','🕐']]],
  ['Context',[['workspace','Workspace','🧠'],['project','Project','📦'],['document','Document','📝'],
              ['saved','Saved Context','💾'],['agent','Mention Agent','👤'],['skill','Mention Skill','🛠️']]],
  ['Actions',[['action','Run Action','⚡'],['repo','Search Repo','🔍'],['web','Web Search','🌐'],
              ['research','Deep Research','🧪'],['genImage','Generate Image','🎨'],
              ['genVideo','Generate Video','📹'],['genAudio','Generate Audio','🔊']]],
];
/* Route table — same APIs the Next composer posts to. */
const ROUTES={chat:'/api/chat',plan:'/api/llm/plan',execute:'/api/kernel/jobs',swarm:'/api/harness/coordinate'};
const NAV=[['🧠','Missions','missions'],['🤖','Agents','agents'],['🔧','Tools','tools'],['🧩','Skills','skills'],
           ['📁','Projects','projects'],['🧠','Memory','memory'],['⚙️','Settings','settings']];

/* ── state ──────────────────────────────────────────────────────────── */
const S={mode:'chat',agents:['planner','builder'],provider:'auto',speed:'balanced',intelligence:'medium',
         memory:'project',workspace:'current',chips:[],access:'fullSystem',tokens:0,attachments:[],voice:false};
const lbl=(arr,id)=>{const f=arr.find(x=>x[0]===id);return f?f[1]:id};

/* ── sessions ───────────────────────────────────────────────────────── */
const K='purpclaw.cockpit.v3',KC=K+'.cur';
let sess=ld(K,[]),cur=localStorage.getItem(KC)||'';
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function sv(){try{localStorage.setItem(K,JSON.stringify(sess));localStorage.setItem(KC,cur)}catch{}}
function C(){return sess.find(x=>x.id===cur)}
function newMission(){cur='m-'+Date.now().toString(36);
  sess.unshift({id:cur,title:'New mission',msgs:[]});sess=sess.slice(0,40);
  S.tokens=0;sv();paintRail();paintLog();paintCtl();$('#in').focus()}

/* ── render ─────────────────────────────────────────────────────────── */
function paintRail(){
  const n=$('#nav');n.innerHTML='';
  NAV.forEach(([ic,label,id])=>{const d=el('nv');d.innerHTML=`<span>${ic}</span><span>${label}</span>`;
    d.onclick=()=>drawer(id,label);n.appendChild(d)});
  const r=$('#recent');r.innerHTML='';
  sess.forEach(s=>{const d=el('rc'+(s.id===cur?' on':''),s.title||'New mission');
    d.onclick=()=>{cur=s.id;sv();paintRail();paintLog()};r.appendChild(d)});
}
function paintLog(){
  const s=C(),log=$('#log'),hero=$('#hero');
  if(!s||!s.msgs.length){hero.style.display='';log.style.display='none';return}
  hero.style.display='none';log.style.display='flex';log.innerHTML='';
  s.msgs.forEach(m=>{const d=el('msg '+(m.role==='user'?'u':'a'),m.text);
    if(m.meta)d.appendChild(el('mt',m.meta));log.appendChild(d)});
  log.scrollTop=log.scrollHeight;
}

/* Build one dropdown. sections = [[header, items, renderItem]] */
function dropdown(faceHtml,title,build,alignRight){
  const w=el('c');const b=document.createElement('button');b.className='b';b.innerHTML=faceHtml;
  const m=el('menu'+(alignRight?' right':''));build(m);
  b.onclick=e=>{e.stopPropagation();
    document.querySelectorAll('.c').forEach(x=>x!==w&&x.classList.remove('open'));w.classList.toggle('open')};
  w.append(b,m);return w;
}
function opt(label,selected,onPick,tick){
  const i=el('mi'+(selected?' sel':''));i.textContent=label;
  if(selected&&tick)i.appendChild(el('tick','✓'));
  i.onclick=e=>{e.stopPropagation();onPick();paintCtl()};
  return i;
}

/* Mark a control as collapsible into the ⋯ tray when the rail runs out of room. */
const pri2=n=>{n.dataset.pri='2';return n};
function paintCtl(){
  const c=$('#ctl');c.innerHTML='';

  // + launcher — Attach / Context / Actions (21 items)
  c.appendChild(dropdown('＋','',m=>{
    LAUNCHER.forEach(([head,items])=>{
      m.appendChild(el('mh',head.toUpperCase()));
      items.forEach(([kind,label,icon])=>{
        const i=el('mi');i.innerHTML=`<span>${icon}</span><span>${label}</span>`;
        i.onclick=e=>{e.stopPropagation();launch(kind,label)};m.appendChild(i);
      });
    });
  }));

  // ＋ New — new mission/session
  const nb=document.createElement('button');nb.className='b';nb.innerHTML='＋ New';
  nb.onclick=newMission;c.appendChild(nb);

  // Mode
  c.appendChild(dropdown(`${MODES.find(x=>x[0]===S.mode)[2]} ${lbl(MODES,S.mode)}`,'',m=>{
    m.appendChild(el('mh','MODE'));
    MODES.forEach(([id,label,icon])=>m.appendChild(opt(`${icon} ${label}`,S.mode===id,()=>S.mode=id,true)));
  }));

  // Agents (n)
  c.appendChild(dropdown(`👤 ${S.agents.length}`,'',m=>{
    m.appendChild(el('mh',`AGENTS (${S.agents.length} ACTIVE)`));
    const g=el('mgrid');
    AGENTS.forEach(([id,label])=>g.appendChild(opt(label,S.agents.includes(id),
      ()=>{S.agents=S.agents.includes(id)?S.agents.filter(a=>a!==id):[...S.agents,id]})));
    m.appendChild(g);
  }));

  // Provider / Speed / Intelligence
  c.appendChild(pri2(dropdown(`🤖 ${lbl(PROVIDERS,S.provider)}`,'',m=>{
    m.appendChild(el('mh','PROVIDER'));
    PROVIDERS.forEach(([id,label])=>m.appendChild(opt(label,S.provider===id,()=>S.provider=id,true)));
    m.appendChild(el('mh','SPEED'));
    SPEEDS.forEach(([id,label])=>m.appendChild(opt(label,S.speed===id,()=>S.speed=id,true)));
    m.appendChild(el('mh','INTELLIGENCE'));
    INTEL.forEach(([id,label])=>m.appendChild(opt(label,S.intelligence===id,()=>S.intelligence=id,true)));
  })));

  // Memory Level
  c.appendChild(pri2(dropdown(`🧠 ${lbl(MEMORY,S.memory).replace(/^\S+\s/,'')}`,'',m=>{
    m.appendChild(el('mh','MEMORY LEVEL'));
    MEMORY.forEach(([id,label])=>m.appendChild(opt(label,S.memory===id,()=>S.memory=id,true)));
  })));

  // Workspace
  c.appendChild(pri2(dropdown(`📂 ${lbl(WORKSPACES,S.workspace)}`,'',m=>{
    m.appendChild(el('mh','WORKSPACE'));
    WORKSPACES.forEach(([id,label])=>m.appendChild(opt(label,S.workspace===id,()=>S.workspace=id,true)));
  })));

  // Quick Actions (chips)
  c.appendChild(pri2(dropdown(`⚡ Chips${S.chips.length?' ('+S.chips.length+')':''}`,'',m=>{
    m.appendChild(el('mh','QUICK ACTIONS'));
    const g=el('mgrid');
    CHIPS.forEach(ch=>g.appendChild(opt(ch,S.chips.includes(ch),
      ()=>{S.chips=S.chips.includes(ch)?S.chips.filter(x=>x!==ch):[...S.chips,ch]})));
    m.appendChild(g);
  })));

  c.appendChild(el('sp'));

  // token meter
  const t=document.createElement('button');t.className='b';t.innerHTML=`${S.tokens} tk <span style="opacity:.5">▴</span>`;
  t.onclick=()=>drawer('context','Active Context');c.appendChild(pri2(t));

  // Access Control — the four-rung supervision dial. Enforced server-side.
  const accTone={readOnly:'lo',review:'',agentActions:'',fullSystem:'hi'}[S.access]||'';
  const acc=dropdown(lbl(ACCESS,S.access).replace(/^\S+\s/,'').toUpperCase(),'',m=>{
    m.appendChild(el('mh','ACCESS CONTROL'));
    ACCESS.forEach(([id,label])=>m.appendChild(opt(label,S.access===id,()=>S.access=id,true)));
  },true);
  acc.querySelector('.b').className='b acc '+accTone;
  c.appendChild(acc);

  // voice
  const v=document.createElement('button');v.className='b'+(S.voice?' on':'');v.textContent='🎤';
  v.title='Voice input';v.onclick=()=>{S.voice=!S.voice;paintCtl();
    if(S.voice)note('Voice capture is not wired in this build — the toggle is recorded and sent with the turn.')};
  c.appendChild(v);

  // send
  const go=document.createElement('button');go.id='go';go.textContent='→';go.onclick=send;c.appendChild(go);
  fitRail();
}

/* Keep the rail to ONE row. When it overflows, drop the least-essential pills
   into the ⋯ tray from the right, rather than wrapping into toolbar spaghetti.
   Nodes are MOVED, not rebuilt, so each control keeps its state and handlers.
   Send, access and the mode pill are never collapsed — they are the identity of
   the bar. ponytail: measure-and-move; a ResizeObserver would be tidier but this
   runs only on repaint and resize. */
function fitRail(){
  const c=$('#ctl');if(!c)return;
  // Collapsed pills live INSIDE the tray, so removing the tray would delete
  // them outright — widening the window silently lost Memory, Workspace, Chips
  // and the token meter. Repaint from canonical order instead of un-moving.
  if(c.querySelector('.tray'))return paintCtl();
  const movable=[...c.children].filter(n=>n.dataset&&n.dataset.pri==='2');
  if(c.scrollWidth<=c.clientWidth||!movable.length)return;

  const t=el('c tray');const tb=document.createElement('button');
  tb.className='b';tb.textContent='⋯';tb.title='More controls';
  const tm=el('menu right');tm.appendChild(el('mh','MORE CONTROLS'));
  tb.onclick=e=>{e.stopPropagation();
    document.querySelectorAll('.c').forEach(x=>x!==t&&x.classList.remove('open'));t.classList.toggle('open')};
  t.append(tb,tm);c.insertBefore(t,c.querySelector('.sp'));

  // Collapse from the right until it fits, or nothing movable is left.
  for(let i=movable.length-1;i>=0&&c.scrollWidth>c.clientWidth;i--){
    tm.insertBefore(movable[i],tm.children[1]||null);
  }
  if(!tm.querySelector('.c'))t.remove();
}
addEventListener('resize',()=>{clearTimeout(fitRail._t);fitRail._t=setTimeout(paintCtl,120)});
const closeMenus=()=>document.querySelectorAll('.c').forEach(x=>x.classList.remove('open'));
document.addEventListener('click',closeMenus);
// Escape closes any open popover — a menu left hanging over the conversation
// during a resize is exactly the Windows-95-toolbar behaviour we're avoiding.
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});

function note(msg){const s=C();if(!s)return;s.msgs.push({role:'assistant',text:'ℹ '+msg,meta:'cockpit'});sv();paintLog()}

/* Launcher actions: the ones with a real path do it; the rest say so plainly. */
function launch(kind,label){
  document.querySelectorAll('.c').forEach(x=>x.classList.remove('open'));
  const box=$('#in');
  const prefix={repo:'Search the repo for ',web:'Search the web for ',research:'Do deep research on ',
    genImage:'Generate an image of ',genVideo:'Generate a video of ',genAudio:'Generate audio of ',
    action:'Run action: ',agent:'@',skill:'/'}[kind];
  if(prefix){box.value=(box.value?box.value+' ':'')+prefix;box.focus();return}
  if(kind==='clipboard'){navigator.clipboard.readText().then(t=>{box.value+=t;box.focus()})
    .catch(()=>note('Clipboard read was blocked by the browser.'));return}
  if(kind==='url'){const u=prompt('URL to attach:');if(u){box.value+=' '+u;box.focus()}return}
  if(kind==='file'||kind==='image'||kind==='audio'||kind==='video'||kind==='folder'){
    const inp=document.createElement('input');inp.type='file';if(kind==='folder')inp.webkitdirectory=true;
    inp.multiple=true;inp.onchange=()=>{S.attachments=[...S.attachments,...[...inp.files].map(f=>({name:f.name,size:f.size,kind}))];
      note(`Attached ${inp.files.length} ${label.toLowerCase()} — names are sent with the turn; upload wiring is pending.`);paintCtl()};
    inp.click();return}
  if(kind==='workspace'||kind==='project'){drawer('projects','Projects');return}
  note(`"${label}" has no wired handler yet — it exists in the menu, the backend route is not connected.`);
}

/* Reasoning + tool JSON are internals. Brace-counted: real args nest. */
function clean(t){
  let o=String(t||'').replace(/<think>[\s\S]*?<\/think>/gi,'');
  const k=o.lastIndexOf('<think>');if(k!==-1)o=o.slice(0,k);
  for(;;){const st=o.search(/\{\s*"tool"\s*:/);if(st===-1)break;
    let d=0,end=-1,q=false,esc=false;
    for(let i=st;i<o.length;i++){const ch=o[i];
      if(esc){esc=false;continue}if(ch==='\\'){esc=true;continue}
      if(ch==='"'){q=!q;continue}if(q)continue;
      if(ch==='{')d++;else if(ch==='}'){d--;if(d===0){end=i+1;break}}}
    if(end===-1){o=o.slice(0,st);break}o=o.slice(0,st)+o.slice(end)}
  return o.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trimStart();
}

/* ── send ───────────────────────────────────────────────────────────── */
let busy=false;
async function send(){
  const box=$('#in'),text=box.value.trim();if(!text||busy)return;
  if(!C())newMission();
  const s=C();if(s.title==='New mission')s.title=text.slice(0,40);
  s.msgs.push({role:'user',text});box.value='';box.style.height='auto';paintRail();paintLog();

  busy=true;document.body.classList.add('running');
  const go=$('#go');if(go)go.disabled=true;
  const bub=el('msg a',''),mt=el('mt','thinking…');bub.appendChild(mt);
  $('#log').appendChild(bub);$('#log').scrollTop=1e9;

  // The mission envelope — the canonical execution contract (lib/mission-envelope.js).
  // These are not UI preferences: `access` resolves to a permission profile the
  // tool dispatcher enforces, and `memory` bounds how far recall may reach.
  const envelope={mode:S.mode,agents:S.agents,provider:S.provider,speed:S.speed,
    intelligence:S.intelligence,memory:S.memory,workspace:S.workspace,chips:S.chips,
    attachments:S.attachments,access:ACCESS_WIRE[S.access]||'review'};
  const operatorContext={composerMode:S.mode,accessMode:S.access,memoryMode:S.memory,
    workspace:S.workspace,enabledAgents:S.agents,quickChips:S.chips,
    modelControl:{speed:S.speed,intelligence:S.intelligence,provider:S.provider},
    attachments:S.attachments,estimatedTokens:S.tokens};

  let raw='';
  try{
    const r=await fetch(API+'/api/chat',{method:'POST',
      headers:{'Content-Type':'application/json','Accept':'text/event-stream'},
      body:JSON.stringify({message:text,session_id:cur,source:'cockpit',envelope,
        route:ROUTES[S.mode]||'/api/chat',operatorContext,
        provider:S.provider,mode:S.mode,memory:S.memory,workspace:S.workspace,
        access:S.access,agents:S.agents,chips:S.chips,voice:S.voice})});
    if(!r.ok||!r.body)throw new Error('HTTP '+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const{value,done}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split('\n\n');buf=parts.pop()||'';
      for(const p of parts){
        let ev='message',data='';
        for(const ln of p.split('\n')){
          if(ln.startsWith('event:'))ev=ln.slice(6).trim();
          else if(ln.startsWith('data:'))data+=ln.slice(5).trim()}
        if(!data)continue;let d;try{d=JSON.parse(data)}catch{continue}
        if(ev==='token'){raw+=d.content||'';bub.textContent=clean(raw);bub.appendChild(mt);
          mt.textContent=d.model||'…';S.tokens=Math.round(raw.length/4);paintCtl();$('#log').scrollTop=1e9}
        else if(ev==='tool-call'){$('#log').insertBefore(el('tool','◌ '+d.tool),bub)}
        else if(ev==='tool-result'){const last=[...document.querySelectorAll('.tool')].pop();
          if(last){const ok=d.ok!==false;
            last.textContent=(ok?'✓ ':'✗ ')+(d.tool||'')+(ok?'':' — '+String(d.error||'failed').slice(0,80));
            last.className='tool '+(ok?'ok':'bad')}}
        else if(ev==='error'){bub.textContent='⚠ '+(d.error||'unknown');bub.appendChild(mt);mt.textContent='failed'}
        else if(ev==='done'){const fin=clean(d.reply||raw)||'(no output)';
          bub.textContent=fin;bub.appendChild(mt);
          mt.textContent=[d.model,d.toolCalls?d.toolCalls+' tools':''].filter(Boolean).join(' · ')||'done';
          s.msgs.push({role:'assistant',text:fin,meta:mt.textContent})}
      }}
  }catch(e){bub.textContent='⚠ '+e.message;bub.appendChild(mt);mt.textContent='failed';
    s.msgs.push({role:'assistant',text:'⚠ '+e.message,meta:'failed'})}
  finally{busy=false;document.body.classList.remove('running');
    const g=$('#go');if(g)g.disabled=false;sv();paintRail()}
}

/* ── drawers ────────────────────────────────────────────────────────── */
async function j(u){try{const r=await fetch(API+u);return r.ok?await r.json():null}catch{return null}}
async function drawer(id,label){
  document.body.classList.add('drawer');
  const d=$('#drawer');d.innerHTML='';
  const h=el('dh');const t=document.createElement('h2');t.textContent=label;h.appendChild(t);
  const x=document.createElement('button');x.className='x';x.textContent='✕';
  x.onclick=()=>document.body.classList.remove('drawer');h.appendChild(x);d.appendChild(h);
  const body=el('b');d.appendChild(body);body.innerHTML='<div class="card">loading…</div>';

  if(id==='context'){
    body.innerHTML=`<div class="card"><h3>ACTIVE CONTEXT</h3>
      <div class="it" style="margin-bottom:7px"><b>🤖 ${lbl(PROVIDERS,S.provider)} · ${lbl(SPEEDS,S.speed)} · ${lbl(INTEL,S.intelligence)}</b><span>model control</span></div>
      <div class="it" style="margin-bottom:7px"><b>🔒 ${lbl(ACCESS,S.access)}</b><span>access</span></div>
      <div class="it" style="margin-bottom:7px"><b>🧠 ${lbl(MEMORY,S.memory)}</b><span>memory</span></div>
      <div class="it" style="margin-bottom:7px"><b>📦 ${lbl(WORKSPACES,S.workspace)}</b><span>workspace</span></div>
      <div class="it" style="margin-bottom:7px"><b>👤 ${S.agents.map(a=>lbl(AGENTS,a)).join(', ')||'none'}</b><span>agents</span></div>
      <div class="it" style="margin-bottom:7px"><b>⚡ ${S.chips.join(', ')||'none'}</b><span>quick actions</span></div>
      <div class="it"><b>📎 ${S.attachments.map(a=>a.name).join(', ')||'none'}</b><span>attachments</span></div></div>`;
    return}
  if(id==='agents'){
    const [reg,pipe]=await Promise.all([j('/api/agents/registry'),j('/api/pipeline')]);
    const roster=(reg&&(reg.agents||reg.registry?.agents))||(pipe&&pipe.registry?.agents)||[];
    const swarm=(pipe&&pipe.swarm?.agents)||[];
    body.innerHTML=`<div class="card"><h3>WORKFORCE</h3>
      <div class="stat"><b>${roster.length}</b><span>AGENTS</span></div>
      <div class="stat"><b>${swarm.filter(a=>a.status==='working').length}</b><span>WORKING</span></div>
      <div class="stat"><b>${swarm.length}</b><span>SPAWNED</span></div></div>`+
      (roster.length?`<div class="card"><h3>ROSTER</h3><div class="g">${roster.map(a=>
        `<div class="it"><b>${a.emoji||''} ${a.name||''}</b><span>${a.role||''}</span><span>${a.division||''}</span></div>`).join('')}</div></div>`:'');
    return}
  if(id==='missions'){
    body.innerHTML=`<div class="card"><h3>MISSIONS</h3>${sess.length?sess.map(s=>
      `<div class="it" style="margin-bottom:7px"><b>${s.title}</b><span>${s.msgs.length} messages</span></div>`).join('')
      :'<div style="color:var(--dim)">no missions yet</div>'}</div>`;return}
  if(id==='tools'){
    const cap=await j('/api/capabilities');const n=cap?(cap.count||(cap.capabilities||[]).length||0):0;
    body.innerHTML=`<div class="card"><h3>TOOLRUNTIME</h3><div class="stat"><b>${n||'—'}</b><span>CAPABILITIES</span></div>
      <div style="color:var(--dim);font-size:12px">Every tool call passes the governed ToolRuntime: scope, schema, path-security, permissions, steering, approval.</div></div>`;return}
  if(id==='settings'){
    const h2=await j('/api/health');const rt=h2&&h2.runtime;
    body.innerHTML=`<div class="card"><h3>RUNTIME</h3><div style="font:12px var(--mono);color:#5a5a66">${
      rt?`${rt.runtimeId}<br>profile ${rt.profile} · workspace ${rt.workspace}<br>v${rt.version}`:'runtime identity unavailable'}</div></div>`;return}
  body.innerHTML=`<div class="card"><h3>${label.toUpperCase()}</h3>
    <div style="color:var(--dim);font-size:12.5px">No data source wired for this view yet. Its controls live in the composer.</div></div>`;
}

/* ── boot ───────────────────────────────────────────────────────────── */
$('#newmission').onclick=newMission;
$('#identity').onclick=()=>drawer('settings','Settings');
$('#in').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();send()}
  else if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,180)+'px'});
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();
  const f=[...(e.dataTransfer?.files||[])];if(!f.length)return;
  S.attachments=[...S.attachments,...f.map(x=>({name:x.name,size:x.size,kind:'file'}))];
  note(`Dropped ${f.length} file(s) — names travel with the turn; upload wiring is pending.`);paintCtl()});
setInterval(()=>$('#clock').textContent=new Date().toLocaleTimeString(),1000);
(async()=>{const h=await j('/api/health');$('#dot').className='status'+(h?'':' off');
  const rt=h&&h.runtime;$('#rt').textContent=rt?`${rt.profile}/${rt.workspace} · v${rt.version}`:'runtime offline';
  if(rt&&rt.profile)$('#who').textContent=rt.profile.replace(/^\w/,c=>c.toUpperCase())})();
setInterval(async()=>{const h=await j('/api/health');$('#dot').className='status'+(h?'':' off')},15000);
paintRail();paintCtl();
if(!sess.length||!C())newMission();else paintLog();
</script>
