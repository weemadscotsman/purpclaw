<!doctype html>
<html><head><meta charset="utf-8">
<title>PURPCLAW</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="cockpit/skin-tokens.css">
<script src="cockpit/skin-loader.js" defer></script>
<script src="cockpit/media/zamp/ZampVisualRegistry.js"></script>
<script src="cockpit/media/voice-mode.js" defer></script>
<script src="cockpit/media/widgets/WidgetHost.js"></script>
<script src="cockpit/media/widgets/camera-widget.js"></script>
<script src="cockpit/media/widgets/clock-widget.js"></script>
<script src="cockpit/media/widgets/calendar-widget.js"></script>
<script src="cockpit/media/widgets/tamagotchi-widget.js"></script>
<script src="cockpit/media/widgets/zamp-widget.js"></script>
<!--
  PURPCLAW Cockpit — full composer parity, no framework.

  Every control from the Next.js bottom bar is here, with the same options and
  icons, sourced from app/components/composer/types.ts:
    launcher (21 items over Attach/Context/Actions), New, Mode (4), Agents (8),
    Provider (8) + Speed (3) + Intelligence (4), Memory (4), Workspace (6),
    Quick Actions (14), token meter, Access Control (4), voice, send.

  Architecture rule: UI displays state, backend owns state, UI requests actions,
  backend performs them. Nothing canonical lives in this file — delete it and
  PurpClaw still runs from CLI, TUI and API.

  Served same-origin by unified_api (/, /ui, /cockpit): SSE needs no CORS, and
  there is no React, no Next, no bundler, no build step.
-->
<style>
:root{
  color-scheme:dark;
  --frame:#06070c; --canvas:#090a12; --card:#10111c; --card2:#131522;
  --ink:#f2f0f7; --dim:#858395; --muted:#b8b4c3;
  --line:#252638; --line2:#191b29;
  --purple:#a66cff; --purple2:#7c4dff; --purple-soft:rgba(166,108,255,.12);
  --mint:#35d39a; --amber:#f3a63b; --red:#ff667d;
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace; --r:14px;
}
*{box-sizing:border-box}
/* Invisible scrollbars everywhere — content scrolls, chrome doesn't */
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%;margin:0}
body{background:
  radial-gradient(circle at 82% 8%,rgba(124,77,255,.10),transparent 28%),
  radial-gradient(circle at 12% 95%,rgba(166,108,255,.06),transparent 26%),var(--frame);
  font:14px/1.6 var(--sans);color:var(--ink);padding:8px;display:flex;gap:8px;
  overflow:hidden;transition:background .35s}
body.running{background-color:#080711}
button,textarea{font:inherit}
input{background:#0b0d16!important;color:var(--ink)!important;border-color:var(--line)!important}
input::placeholder{color:#686676}
button:focus-visible,textarea:focus-visible,.nv:focus-visible,.rc:focus-visible,.me:focus-visible{
  outline:2px solid var(--purple);outline-offset:2px}

#rail{width:224px;flex:none;background:rgba(9,10,18,.96);border:1px solid var(--line);
  border-radius:var(--r);display:flex;flex-direction:column;min-height:0;padding:14px 10px;
  box-shadow:0 18px 60px rgba(0,0,0,.22);
  transition:margin-left .28s ease,width .28s ease}
/* COLLAPSE LAW (Eddie 2026-08-25): the whole side panel slides closed to the
   left and STAYS closed until reopened. body.rail-closed slides it fully off
   canvas; a floating reopen tab is the only way back.
   GEOMETRY LAW (2026-08-26 restoration pass): margin must cancel width+gap
   exactly (-(224px+8px gap)=-232px) so main keeps its 8px left edge when
   closed — -248px overshot by 16px and pushed the workspace off-screen. */
body.rail-closed #rail{margin-left:-232px}
#railOpen{position:fixed;left:8px;top:14px;z-index:99;display:none;
  width:34px;height:34px;border-radius:9px;border:1px solid rgba(166,108,255,.4);
  background:rgba(9,10,18,.92);color:#d9c7ff;font-size:16px;cursor:pointer;align-items:center;justify-content:center}
body.rail-closed #railOpen{display:flex}
.wordmark{display:flex;align-items:center;gap:10px;padding:3px 8px 18px}
.brandmark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;
  background:var(--purple-soft);border:1px solid rgba(166,108,255,.32);color:var(--purple);
  font:700 13px var(--mono);box-shadow:inset 0 0 18px rgba(166,108,255,.1);overflow:hidden}
.brandmark video{width:100%;height:100%;object-fit:cover;border-radius:inherit;pointer-events:none}
.wordmark b{font-weight:700;font-size:15px;letter-spacing:.3px}.wordmark .p{color:var(--purple)}
.status,.live-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);
  box-shadow:0 0 0 3px rgba(53,211,154,.09),0 0 12px rgba(53,211,154,.24)}
.status{margin-left:auto}.status.off,.live-dot.off{background:var(--red);box-shadow:none}
#newmission{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(166,108,255,.4);
  background:var(--purple-soft);color:#d9c7ff;font:600 12.5px var(--sans);cursor:pointer;margin-bottom:12px}
#newmission:hover{background:rgba(166,108,255,.18);border-color:var(--purple)}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;
  color:var(--muted);font-size:12.5px;border:1px solid transparent;background:transparent;
  width:100%;text-align:left;transition:.15s}
.nv>span:first-child{display:grid;place-items:center;width:20px;color:var(--dim);font:600 15px var(--mono)}
.nv:hover{background:var(--line2);color:var(--ink)}
.nv.active{background:var(--purple-soft);color:#e8deff;border-color:rgba(166,108,255,.22)}
.nv.active>span:first-child{color:var(--purple)}
.rhead{padding:18px 10px 7px;color:#646273;font-size:9.5px;letter-spacing:1.4px;font-weight:700}
#recent{flex:1;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.rc{padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--dim);font-size:12px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:transparent;border:0;
  width:100%;text-align:left}
.rc:hover{background:var(--line2);color:var(--muted)}
.rc.on{background:rgba(255,255,255,.035);color:#d5d1dc}
.rc.more{color:var(--purple);font-size:11px;margin-top:3px}
.me{margin-top:8px;padding:9px 10px;border-radius:10px;display:flex;align-items:center;gap:9px;
  border:1px solid var(--line);cursor:pointer;font-size:12px;color:var(--muted);background:rgba(255,255,255,.012)}
.me:hover{border-color:#35374c;background:var(--line2)}
.av{width:22px;height:22px;border-radius:7px;background:var(--purple-soft);
  border:1px solid rgba(166,108,255,.32);position:relative}
.av:after{content:'P';position:absolute;inset:0;display:grid;place-items:center;color:var(--purple);font:600 9px var(--mono)}

main{flex:1;background:rgba(9,10,18,.9);border:1px solid var(--line);border-radius:var(--r);
  display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;overflow:hidden;
  box-shadow:0 18px 70px rgba(0,0,0,.2)}
main:before{content:'';pointer-events:none;position:absolute;inset:0;background:
  linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
  linear-gradient(90deg,rgba(255,255,255,.01) 1px,transparent 1px);
  background-size:52px 52px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.32),transparent 65%)}
#top{height:54px;display:flex;align-items:center;gap:10px;padding:0 18px;color:var(--dim);
  font-size:11px;border-bottom:1px solid var(--line2);position:relative;z-index:2}
#top .sp{flex:1}
.corestate{display:flex;align-items:center;gap:8px;color:var(--muted);font:600 10px var(--mono);letter-spacing:.8px}
.runtime{color:var(--dim);font:500 10.5px var(--mono);padding-left:3px}
.topcount{display:flex;align-items:baseline;gap:5px;color:var(--dim);text-transform:uppercase;
  letter-spacing:.7px;font:500 9.5px var(--mono)}
.topcount b{color:var(--muted);font-size:11px}
#clock{min-width:52px;text-align:right;color:var(--muted);font:500 11px var(--mono)}
#stage{flex:1;overflow:auto;display:flex;flex-direction:column;min-height:0;position:relative;z-index:1;
  scroll-behavior:smooth;overscroll-behavior:contain;scrollbar-gutter:stable}
.hero{margin:auto;text-align:center;padding:42px 20px;max-width:620px}
.hero .kicker{display:inline-flex;align-items:center;gap:8px;color:var(--dim);font:600 9.5px var(--mono);
  letter-spacing:1.4px;text-transform:uppercase;margin-bottom:18px}
.hero .orb{width:54px;height:54px;border-radius:16px;margin:0 auto 18px;display:grid;place-items:center;
  color:#eaddff;font:700 16px var(--mono);border:1px solid rgba(166,108,255,.38);
  background:radial-gradient(circle at 35% 25%,rgba(220,190,255,.2),transparent 34%),var(--purple-soft);
  box-shadow:0 16px 46px rgba(124,77,255,.16)}
.hero h1{font:600 30px/1.2 var(--sans);letter-spacing:-.7px;margin:0 0 9px}
.hero p{color:var(--dim);margin:0 auto;font-size:13px;max-width:460px}
#log{width:100%;max-width:960px;margin:0 auto;padding:28px 30px;display:flex;flex-direction:column;gap:14px;min-width:0}
/* AVATAR ROW LAW: the row owns layout, the card owns content, the avatar
   owns identity. Avatars are SIBLINGS of their card inside .mrow — never
   children of the card, never absolutely positioned, no negative margins.
   User:   [avatar][card]   Assistant: [card][PurpAngolin avatar]. */
.mrow{display:flex;width:100%;min-width:0;gap:10px;align-items:flex-start;padding:2px 0}
.mrow-user{justify-content:flex-start}
.mrow-assistant{justify-content:flex-start}
.mrow .msg{min-width:0;max-width:calc(100% - 54px)}
.mavatar{flex:0 0 40px;width:40px;height:40px;border-radius:12px;overflow:hidden;position:relative}
.mavatar img,.mavatar video{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:640px){.mavatar{flex-basis:36px;width:36px;height:36px}.mrow{gap:8px}}
.msg{padding:12px 15px;border-radius:14px;white-space:pre-wrap;
  word-wrap:break-word;font-size:13px;position:relative;min-width:0}
.msg.u{background:var(--purple2);color:#fff;border-bottom-right-radius:5px}
.msg.a{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
/* TURN-UNIT WIDTH LAW: an assistant turn's card width is set by its phase at
   mount (THINKING) and never changes through ANSWERING/DONE/ERROR. Width is
   driven by the fixed face column + a stable flex-basis, not by content. */
.msg.a.runbub{width:min(760px,88%);flex:0 0 auto;flex-direction:column;gap:0}
.mtext{white-space:pre-wrap;word-break:break-word}
.mactions{display:flex;gap:4px;margin-top:8px;opacity:0;transform:translateY(2px);transition:.15s}
.msg:hover .mactions,.msg:focus-within .mactions{opacity:1;transform:none}
.mact{border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025);color:var(--dim);
  border-radius:7px;padding:3px 7px;font:500 9.5px var(--mono);cursor:pointer}
.mact:hover{color:var(--ink);background:rgba(255,255,255,.06);border-color:rgba(166,108,255,.24)}
/* ── rendered markdown ───────────────────────────────────────────────
   Long answers need a readable measure and real vertical rhythm. Wide
   content (tables, code) scrolls inside its own box so the message column
   never grows a horizontal scrollbar. */
.msg.a .md-p{margin:0 0 9px;line-height:1.62}
.msg.a .md-p:last-child{margin-bottom:0}
.msg.a .md-h{font-weight:650;line-height:1.35;margin:14px 0 7px;color:var(--ink)}
.msg.a .md-h:first-child{margin-top:0}
.msg.a .md-h1{font-size:17px}.msg.a .md-h2{font-size:15.5px}.msg.a .md-h3{font-size:14px}
.msg.a .md-h4,.msg.a .md-h5,.msg.a .md-h6{font-size:13px;color:var(--dim)}
.msg.a .md-list{margin:0 0 9px;padding-left:20px}
.msg.a .md-list li{margin:2px 0;line-height:1.6}
.msg.a .md-code{font:12px var(--mono);background:var(--line2);
  border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.msg.a .md-pre{margin:0 0 10px;padding:10px 12px;background:#faf9f6;
  border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.msg.a .md-pre code{font:12px/1.55 var(--mono);background:none;border:none;padding:0;white-space:pre}
.msg.a .md-quote{margin:0 0 10px;padding:2px 0 2px 11px;
  border-left:3px solid var(--purple-soft);color:var(--dim)}
.msg.a .md-hr{border:none;border-top:1px solid var(--line);margin:13px 0}
.msg.a .md-tablewrap{overflow-x:auto;margin:0 0 10px}
.msg.a .md-table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.msg.a .md-table th,.msg.a .md-table td{border:1px solid var(--line);
  padding:5px 9px;text-align:left;vertical-align:top}
.msg.a .md-table th{background:var(--line2);font-weight:600}
.msg.a a{color:var(--purple);text-decoration:underline;text-underline-offset:2px}
.msg .mt{font:400 10.5px var(--mono);color:var(--dim);margin-top:7px}
.msg.u .mt{color:#e9ddff}
/* ROUTING RECEIPT BADGE (#22): tiny truth chip on the meta line */
.msg .route-badge{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid rgba(128,90,213,.55);border-radius:9px;background:rgba(128,90,213,.12);color:#d9c7ff;font:600 9.5px var(--mono);letter-spacing:.4px;vertical-align:1px}
/* Companion (AVATAR ROW LAW): Mochi/PurpAngolin identity lives in the
   .mavatar sibling slot to the RIGHT of the assistant card, not inside it. */
.msg.a .mc{display:none}
.mavatar.purp-avatar{background:var(--card);border:1px solid var(--line)}
.mc-icon{font-size:38px;line-height:1;flex:none;
  text-shadow:0 0 10px rgba(168,85,247,.7),0 0 24px rgba(168,85,247,.35);
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.4));min-width:52px;text-align:center}
/* Wrapper for the text content column — fills remaining width. */
.msg.a .mc-body{flex:1;min-width:0}
/* PurpAngolin — avatar-sized sprite in the .mavatar sibling slot (right of
   the assistant card). Driven by RUN.state via companionAngolin(). */
.companion-angolin{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s}
/* Narrow screens — avatar row law holds; avatars shrink via .mavatar media rule. */
  .companion-angolin{width:48px;height:48px}
  .lil-u-sprite{width:48px;height:48px}
}
/* ── Lil Babshaggoth / Lil U — operator companion on user bubbles ──────────── */
/* Lil U fixed equal-frame sprite strips from lil-babshaggoth/LIL_U_FIXED/
   Each frame is 128×128. CSS steps() drives frame-cell animation.
   Old broken atlas pack (PURPCLAW_LIL_GUY_ANIMATION_PACK) retired — uneven cells. */
/* Sprite window is 52×52; strips are native 128px frames → scale by 52/128.
   background-size and keyframe offsets below are stripW × 0.40625 so each
   frame fits exactly — no zoom/crop clipping. */
@keyframes lu-idle    {from{background-position:0 0} to{background-position:-468px 0}}
@keyframes lu-blink   {from{background-position:0 0} to{background-position:-468px 0}}
@keyframes lu-loading  {from{background-position:0 0} to{background-position:-468px 0}}
@keyframes lu-hop      {from{background-position:0 0} to{background-position:-416px 0}}
@keyframes lu-working  {from{background-position:0 0} to{background-position:-260px 0}}
@keyframes lu-tool_use {from{background-position:0 0} to{background-position:-260px 0}}
@keyframes lu-done     {from{background-position:0 0} to{background-position:-208px 0}}
@keyframes lu-error    {from{background-position:0 0} to{background-position:-208px 0}}
@keyframes lu-sleep    {from{background-position:0 0} to{background-position:-208px 0}}
@keyframes lu-wave     {from{background-position:0 0} to{background-position:-208px 0}}
@keyframes lu-excited  {from{background-position:0 0} to{background-position:-208px 0}}
@keyframes lu-recover  {from{background-position:0 0} to{background-position:-208px 0}}
.lil-u-sprite{
  width:52px;height:52px;flex:none;display:block;
  background-repeat:no-repeat;image-rendering:pixelated;
  margin:auto;
}
.lil-u-idle    {background-image:url('lil-babshaggoth/LIL_U_FIXED/idle/idle_strip.png');          background-size:468px 52px;animation:lu-idle    1503ms steps(9) infinite}
.lil-u-blink   {background-image:url('lil-babshaggoth/LIL_U_FIXED/blink/blink_strip.png');         background-size:468px 52px;animation:lu-blink   1125ms steps(9) infinite}
.lil-u-loading {background-image:url('lil-babshaggoth/LIL_U_FIXED/loading/loading_strip.png');     background-size:468px 52px;animation:lu-loading  900ms  steps(9) infinite}
.lil-u-hop     {background-image:url('lil-babshaggoth/LIL_U_FIXED/hop/hop_strip.png');            background-size:416px 52px;animation:lu-hop     1000ms steps(8) infinite}
.lil-u-working {background-image:url('lil-babshaggoth/LIL_U_FIXED/working/working_strip.png');      background-size:260px  52px;animation:lu-working  835ms  steps(5) infinite}
.lil-u-tool_use{background-image:url('lil-babshaggoth/LIL_U_FIXED/tool_use/tool_use_strip.png');  background-size:260px  52px;animation:lu-tool_use 715ms  steps(5) infinite}
.lil-u-done    {background-image:url('lil-babshaggoth/LIL_U_FIXED/done/done_strip.png');          background-size:208px  52px;animation:lu-done    668ms  steps(4) infinite}
.lil-u-error   {background-image:url('lil-babshaggoth/LIL_U_FIXED/error/error_strip.png');         background-size:208px  52px;animation:lu-error   800ms  steps(4) infinite}
.lil-u-sleep   {background-image:url('lil-babshaggoth/LIL_U_FIXED/sleep/sleep_strip.png');        background-size:208px  52px;animation:lu-sleep   1000ms steps(4) infinite}
.lil-u-wave    {background-image:url('lil-babshaggoth/LIL_U_FIXED/wave/wave_strip.png');          background-size:208px  52px;animation:lu-wave    668ms  steps(4) infinite}
.lil-u-excited {background-image:url('lil-babshaggoth/LIL_U_FIXED/excited/excited_strip.png');    background-size:208px  52px;animation:lu-excited 572ms  steps(4) infinite}
.lil-u-recover {background-image:url('lil-babshaggoth/LIL_U_FIXED/recover/recover_strip.png');    background-size:208px  52px;animation:lu-recover 800ms  steps(4) infinite}
/* User bubble layout (AVATAR ROW LAW): Lil U avatar lives in the .mavatar
   sibling slot of the row, not inside the card. The card is text-only. */
.msg.u .lil-u-wrap{display:none}
.mavatar.lil-u-avatar{background:rgba(168,85,247,.12);border:1px solid var(--line)}
.msg.u .lil-u-name{font:500 9.5px var(--sans);color:rgba(255,255,255,.35);letter-spacing:.4px;text-transform:uppercase;text-align:center}
.msg.u .lil-u-body{flex:1;min-width:0}
.tool{align-self:flex-start;display:inline-flex;gap:7px;font:500 11.5px var(--mono);
  color:var(--purple);background:var(--purple-soft);border-radius:20px;padding:5px 12px}
.tool.ok{color:var(--mint);background:rgba(53,211,154,.09)}
.tool.bad{color:var(--red);background:rgba(255,102,125,.09)}

/* ── composer ───────────────────────────────────────────────────────── */
#composer{margin:0 auto 10px;width:min(1080px,calc(100% - 44px));background:rgba(16,17,28,.94);
  border:1px solid #2a2c3f;border-radius:16px;box-shadow:0 18px 50px rgba(0,0,0,.25);transition:.25s;
  position:relative;z-index:3;backdrop-filter:blur(18px)}
#composer.dropzone{outline:2px dashed var(--purple);outline-offset:-6px;background:rgba(64,30,120,.25)}
body.running #composer{border-color:rgba(166,108,255,.58);box-shadow:0 18px 58px rgba(64,30,120,.22)}
#in{width:100%;border:none;outline:none;resize:none;background:transparent;color:var(--ink);
  font:14px/1.6 var(--sans);padding:15px 17px 8px;min-height:56px;max-height:180px}
#in::placeholder{color:#6d6b7d}
/* ONE control rail. Never wraps to a second row — the composer must read as a
   single command console, not a toolbar scattered under a text box. Overflow is
   handled by collapsing secondary pills into ＋ (see fitRail), not by wrapping. */
.ctl{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow:visible;
  padding:8px 10px 10px;border-top:1px solid var(--line2)}
/* REFLOW LAW (mobile): BELOW the base rule so the cascade lets it win.
   Below 860px the rail may wrap to a second deliberate row instead of
   clipping — fitRail's tray-collapse still runs first. */
@media(max-width:860px){
  .ctl{flex-wrap:wrap;row-gap:2px}
  /* widget dock must never push the rail past the viewport */
  #rail{max-width:100vw;min-width:0}
  #widgetDock,#widgetDockItems{min-width:0;max-width:100%;overflow:hidden}
}
.b{flex:none}
/* Access is the supervision dial, so it wears the permission colour, not purple. */
.b.acc{background:rgba(243,166,59,.09);color:var(--amber);border-color:rgba(243,166,59,.22);font-weight:600}
.b.acc.lo{background:rgba(53,211,154,.09);color:var(--mint);border-color:rgba(53,211,154,.22)}
.b.acc.hi{background:rgba(255,102,125,.09);color:var(--red);border-color:rgba(255,102,125,.24)}
.c{position:relative}
.b{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;
  color:var(--muted);border-radius:9px;padding:6px 9px;font:500 11.5px var(--sans);cursor:pointer;white-space:nowrap}
.b:hover{background:var(--line2);color:var(--ink)} .b.on{background:var(--purple-soft);color:var(--purple)}
.composer-new{display:inline-flex}
.sp{flex:1}

.menu{position:absolute;bottom:40px;left:0;min-width:212px;max-width:330px;background:#131522;

.menu.right{left:auto;right:0}
.c.open .menu{display:block}
/* Inside the ⋯ tray, a collapsed control's own popover would nest one absolute
   layer inside another and overflow. Flatten them: the pill becomes a heading
   and its options list inline, so the tray reads as one scrollable stack. */
.tray>.menu{overflow-x:hidden;min-width:248px}
.tray>.menu .c{position:static}
.tray>.menu .c>.b{width:100%;justify-content:flex-start;color:var(--dim);

   padding:0;max-width:none;min-width:0;max-height:none;overflow:visible}

/* ── execution shell ───────────────────────────────────────────────── */
/* One state source (the run's SSE stream) feeds: the activity strip, the
   working bubble with its particle heartbeat, the steer/queue card and the
   sidebar's live mission pill. No surface keeps its own copy of the truth. */
#strip{display:none;align-items:center;gap:9px;margin:10px 12px 0;padding:7px 12px;
  border:1px solid rgba(166,108,255,.22);background:rgba(166,108,255,.05);border-radius:11px;
  cursor:pointer;font:500 11px var(--sans);color:var(--muted);text-align:left;width:calc(100% - 24px)}
#strip.show{display:flex}
/* The purpangolin. Sits at the head of the run strip and shows the sprite for
   the current runtime state. Hidden by default and only revealed once a real
   frame actually loads (see paintMascot), so a missing asset degrades to the
   existing dot — never a broken-image glyph. */
#strip .smascot{width:26px;height:26px;flex:none;object-fit:contain;display:none;
  margin-right:1px;image-rendering:auto;filter:drop-shadow(0 0 4px rgba(166,108,255,.5))}
#strip .smascot.on{display:block}
#strip.show .smascot.on ~ .sdot{display:none}
#strip .sdot{width:7px;height:7px;border-radius:50%;background:var(--purple);flex:none;
  animation:stripPulse 1.6s ease-in-out infinite}
#strip.warn .sdot{background:var(--amber)}
#strip.bad .sdot{background:var(--red)}
#strip.still .sdot{animation:none}
@keyframes stripPulse{50%{opacity:.3}}
#strip .slabel{color:var(--ink);font-weight:600;white-space:nowrap}
#strip .sdetail{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)}
#strip .sstat{color:var(--dim);font:500 10px var(--mono);white-space:nowrap}
#strip:hover{border-color:rgba(166,108,255,.45);background:rgba(166,108,255,.09)}

#queuecard{margin:8px 12px 0;border:1px solid var(--line);border-radius:11px;
  background:rgba(16,17,28,.7);overflow:hidden}
#queuecard:empty{display:none}
.qhead{padding:6px 11px 2px;color:#646273;font:600 9px var(--sans);letter-spacing:1.2px}
.qrow{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 6px;border-top:1px solid var(--line2);font-size:12px}
.qrow:first-of-type{border-top:none}
.qdrag{cursor:grab;color:var(--dim);flex:none;padding:0 2px;user-select:none}
.qrow[draggable=true]{cursor:default}
.qtext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.qb{flex:none;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:7px;
  padding:3px 8px;font:600 10px var(--sans);cursor:pointer;white-space:nowrap}
.qb.steer{color:#d9c7ff;border-color:rgba(166,108,255,.4);background:var(--purple-soft)}
.qb:hover{color:var(--ink);border-color:#3b3e54;background:var(--line2)}
.qrow.dragover{border-top:1px solid var(--purple)}

#slashpop{position:absolute;bottom:100%;left:12px;right:12px;max-height:320px;overflow-y:auto;
  background:rgba(16,17,28,.98);border:1px solid #3b3e54;border-radius:12px;margin-bottom:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 24px rgba(168,85,247,.15);z-index:50}
.slashrow{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px}
.slashrow:hover,.slashrow.cur{background:rgba(166,108,255,.18)}
.slashrow .si{width:20px;text-align:center}
.slashrow .sl{font-weight:600;color:#e8e4f8}
.slashrow .sd{color:#6d6b7d;font-size:11px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slashrow .sm{color:#9b8ec4;font-size:10px;font-family:var(--mono)}
.slashempty{padding:14px;color:#6d6b7d;font-size:11px;text-align:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;margin-right:6px;border-radius:999px;
  background:rgba(166,108,255,.16);border:1px solid rgba(166,108,255,.45);color:#d9c7ff;
  font:600 11px var(--sans);cursor:pointer;position:relative;z-index:4}
.chip:hover{background:rgba(166,108,255,.3)}
.runbub .rhead{display:flex;align-items:center;gap:8px;margin:-2px 0 6px;cursor:pointer;user-select:none}
/* STREAMING UI P0: the working bubble's content column. .msg.a is a flex ROW;
   everything text-bearing lives in this column so the reply body always gets
   full remaining width — never content-sized, never a vertical sliver. */
.runbub .rcol{flex:1 1 auto;min-width:0;width:100%}
.runbub .rcol .mtext,.runbub .rcol .mt{min-width:0;max-width:100%;overflow-wrap:anywhere;word-break:normal}
.runbub .rtitle{font:600 11px var(--sans);color:#d9c7ff;letter-spacing:.3px;white-space:nowrap}
.runbub .rstat{font:500 10px var(--mono);color:var(--dim);white-space:nowrap}
.runbub .rtog{margin-left:auto;color:var(--dim);font:600 11px var(--mono)}
.runbub .rpanel{display:none;flex-direction:column;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;min-width:0;overflow-x:hidden;overflow-y:hidden;-ms-overflow-style:none;scrollbar-width:none}
.runbub .rpanel::-webkit-scrollbar{display:none}
.runbub.open .rpanel{display:flex}
.runrow{display:flex;align-items:baseline;gap:8px;padding:3px 2px;font:500 11px var(--mono);color:var(--muted);min-width:0}
.runrow .rico{flex:none;width:14px;text-align:center;flex-shrink:0}
.runrow .rlabel{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;white-space:normal;cursor:default}
.runrow.ok .rico{color:var(--mint)} .runrow.bad .rico{color:var(--red)}
.runrow .rlabel:hover{color:var(--ink)}
.runrow .rdet{display:none;flex-basis:100%;margin:2px 0 6px 22px;padding:7px 9px;border-left:2px solid var(--line);
  font:400 10.5px var(--mono);color:var(--dim);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}
.runrow.exp .rdet{display:block}
.rcstate{display:block;white-space:normal;overflow:hidden;text-overflow:ellipsis;
  font:500 9.5px var(--mono);color:var(--purple);padding-top:1px}
.rcstate.warn{color:var(--amber)} .rcstate.bad{color:var(--red)} .rcstate.okc{color:var(--mint)}
#pauseBtn{width:33px;height:33px;display:grid;place-items:center;padding:0;border:1px solid var(--line)}
#pauseBtn.on{color:var(--amber);background:rgba(243,166,59,.12);border-color:rgba(243,166,59,.34)}

/* ══ LAYOUT REGIMES — law: ONE sidebar, two presentations. NO bottom bar. ══
   >=1150  FULL DESKTOP   inline sidebar, full composer controls permitted.
   <=1149  COMPACT/MOBILE the SAME #rail becomes an off-canvas drawer slid over
           the chat (☰ sole entry; backdrop / Esc / item-click closes). No
           bottom navigation, no relocated sidebar controls, EVER. The sidebar
           is never rebuilt into a second component — it is re-presented. */
@media(max-width:1149px){
  body{padding:7px;display:block}
  main{height:calc(100% - 14px);width:100%;margin-left:0}
  /* off-canvas drawer = the existing #rail, moved not cloned */
  #rail{position:fixed;top:0;left:0;bottom:0;height:auto;width:min(320px,88vw);
    margin-left:0!important;min-width:0;max-width:88vw;z-index:1000;border-radius:0;
    border-top:0;border-bottom:0;border-left:0;
    transform:translateX(-105%);transition:transform .18s ease}
  body.drawer-open #rail{transform:translateX(0)}
  body.rail-closed #rail{margin-left:0!important} /* desktop ✕/☰ law is compact-void */
  #railOpen{display:flex!important} /* hamburger = ONLY compact entry */
  #composer{width:min(1080px,calc(100% - 22px));margin-bottom:8px}
  .foot{display:none}
  #drawer{padding:12px 14px}.dh{top:-12px}
  .topcount{display:none}
  /* ── condensed composer (two-state): idle hides secondary pills, live reveals
     them. Same nodes MOVE between states — never duplicate. */
  #in{min-height:44px;max-height:140px;padding:13px 15px 6px}
  #composer:not(.live) .ctl>[data-pri="2"],
  #composer:not(.live) .ctl>.tray{display:none}
  .b{padding:6px 8px;font-size:11px}
}
/* drawer backdrop node (compact only; inert on desktop) */
#railBackdrop{display:none}
@media(max-width:520px){
  #top{padding:0 12px}.runtime{display:none}.corestate{font-size:9px}
  .hero h1{font-size:25px}.hero p{font-size:12px}
  #log{padding:18px 14px}.msg{max-width:94%}
  #composer{width:calc(100% - 12px)}
  .ctl{gap:1px}.b{padding:6px 7px}
  .mactions{opacity:1}
  .g{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  #top{padding:0 12px}.runtime{display:none}.corestate{font-size:9px}
  .nv>span:last-child{display:none}.nv>span:first-child{font-size:16px}
  .hero h1{font-size:25px}.hero p{font-size:12px}
  #log{padding:18px 14px}.msg{max-width:94%}
  #composer{width:calc(100% - 12px)}
  .ctl{gap:1px}.b{padding:6px 7px}
  .mactions{opacity:1}
  .g{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<script>
const API=location.origin,$=s=>document.querySelector(s);
const el=(c,t)=>{const d=document.createElement('div');d.className=c;if(t!=null)d.textContent=t;return d};
/* Memory atoms, tool descriptions and mission titles are arbitrary recorded
   text — never interpolate them into HTML raw. */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ── P0 chat/turn authority — load the canonical pure-function spine ──
   The browser can't require() a Node module, so we ship the proven logic in
   as an IIFE that exposes `window.__purpclaw_ta__`. Source of truth lives in
   lib/turn-authority.js; the inlined copy here MUST be kept in sync and is
   exercised by lib/__tests__/turn-authority.test.js. */

  }else{

    else if(m.meta)luBody.appendChild(el('mt',m.meta));
    d.appendChild(luBody);
    row.append(av,d);           // [avatar][card]
  }
  return row;
  const actions=el('mactions');
  const action=(label,title,fn)=>{const b=document.createElement('button');b.type='button';b.className='mact';
    b.textContent=label;b.title=title;b.onclick=fn;actions.appendChild(b);return b};
  action('Copy','Copy message',async e=>{const b=e.currentTarget;
    try{await navigator.clipboard.writeText(clean(m.text));b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200)}
    catch{note('Copy was blocked by the browser.')}});
  if(m.role==='user')action('Edit','Edit and resend',()=>{
    const box=$('#in');box.value=clean(m.text);box.dispatchEvent(new Event('input'));box.focus();box.setSelectionRange(box.value.length,box.value.length)});
  else action('Quote','Quote in your next message',()=>{
    const box=$('#in'),quote=clean(m.text).split('\n').map(x=>'> '+x).join('\n');
    box.value=(box.value?box.value+'\n\n':'')+quote+'\n\n';box.dispatchEvent(new Event('input'));box.focus()});
  // P0.5.2 — Retry button on retryable assistant bubbles.
  // Click → call resolveRetryTarget against the live turn registry. If the
  // target is unambiguous, fire a fresh operator turn with retryOf linkage
  // and re-send the target's rawText. If no retryable failure exists,
  // surface RETRY_TARGET_UNKNOWN to the operator visibly.
  if (m.retryable === true && TA) {
    action('Retry','Retry this specific failed turn',()=>{
      const turns = TURN_STATE.all();
      const sessionTurns = turns[cur] || [];
      const fakeRetry = { turnId: 'pending', intentClass: TA.INTENT_CLASSES.RETRY };
      const resolved = TA.resolveRetryTarget(turns, cur, fakeRetry);
      if (!resolved.ok) {
        note('Retry target unknown — no retryable failed turn to repeat.');
        return;
      }
      const newTurn = TA.newTurn({
        sessionId: cur,
        intentClass: TA.INTENT_CLASSES.RETRY,
        authority: TA.AUTHORITY.CURRENT,
        status: TA.TURN_STATUS.OPEN,
        rawText: 'retry',
        visibleText: '',
        emptyOutput: false,
        retryOf: resolved.turn.turnId,
      });
      // NETWORK_ERROR lineage: a retry CONTINUES the failed turn's identity —
      // same server-side turnId, attempt+1 — so the stream events replace the
      // failed bubble in place instead of stacking a duplicate assistant card.
      newTurn.lineageTurnId = resolved.turn.turnId;
      newTurn.attempt = (resolved.turn.attempt || 1) + 1;
      TURN_STATE.update(cur, resolved.turn.turnId, { supersededBy: newTurn.turnId });
      TURN_STATE.push(cur, newTurn);
      const s2 = C();
      if (s2) {
        s2.msgs.push({role:'user',text:'Retry: '+resolved.turn.rawText.slice(0,80),turnId:newTurn.turnId,intentClass:TA.INTENT_CLASSES.RETRY,retryOf:resolved.turn.turnId});
      }
      sv();paintRail();paintLog();
      sendText(resolved.turn.rawText, s2 || C(), newTurn);
    });
  }
  // mactions — goes inside the text column for both bubble types.
  // Assistant: .mc-body. User: .lil-u-body.
  if(isAssistant){
    const body=d.querySelector('.mc-body');
    if(body)body.appendChild(actions);
  }else{
    const body=d.querySelector('.lil-u-body');
    if(body)body.appendChild(actions);
  }
  return row;
}
/* P0.5.2 — Attach a Retry button to a specific operator turn's assistant bubble.
   Called from the SSE done handler when finalRetryable === RETRYABLE.YES.
   Finds the most recently rendered assistant bubble and stamps the retryable
   flag on it so the next paintLog will render the Retry button. */
function attachRetryButton(turnId){
  const s=C();if(!s)return;
  for (let i = s.msgs.length - 1; i >= 0; i--) {
    if (s.msgs[i].turnId === turnId && s.msgs[i].role === 'assistant') {
      s.msgs[i].retryable = true;
      // TURN-UNIT LAW: stamp retry on the live bubble in place. The done
      // handler finalizes the bubble without a paintLog() rebuild, so the
      // button must be added to the DOM directly, not via full repaint.
      const dom=$('#log').querySelector('.msg[data-turnid="'+turnId+'"]');
      if(dom){dom.replaceWith(messageBubble(s.msgs[i]));}
      else paintLog();
      return;
    }
  }
}

/* Build one dropdown. sections = [[header, items, renderItem]] */
let MENU_PICK=false; // true while a pick-triggered rebuild runs — that one MAY close
function dropdown(faceHtml,title,build,alignRight){
  const w=el('c');const b=document.createElement('button');b.className='b';b.innerHTML=faceHtml;
  const m=el('menu'+(alignRight?' right':''));build(m);
  // Clicks inside the menu (headers, gaps, padding) must NOT bubble to the
  // document closer — only a real pick or genuine click-away closes it.
  m.addEventListener('click',e=>e.stopPropagation());
  b.onclick=e=>{e.stopPropagation();
    document.querySelectorAll('.c').forEach(x=>x!==w&&x.classList.remove('open'));
    // Rebuild menu content on open so registry-driven lists (workspaces) are
    // never stale — build() may be async. Clear first so items don't duplicate.
    try{m.innerHTML='';const r=build(m);if(r&&typeof r.then==='function')r.catch(err=>console.error('[dropdown] rebuild failed:',err));}catch(_){}
    w.classList.toggle('open')};
  w.append(b,m);return w;
}
function opt(label,selected,onPick,tick){
  const i=el('mi'+(selected?' sel':''));i.textContent=label;
  if(selected&&tick)i.appendChild(el('tick','✓'));
  i.onclick=e=>{e.stopPropagation();MENU_PICK=true;try{onPick()}finally{paintCtl();MENU_PICK=false}};
  return i;
}

const THINK_LEVELS=[['quick','⚡ QUICK'],['normal','● NORMAL'],['hard','◆ HARD'],
  ['xhard','◆◆ EXTRA HARD'],['max','★ MAX']];
function currentModelMeta(){
  if(S.provider!=='openrouter'||!S.model||S.model==='openrouter/free')return null;
  return (OR_CATALOG&&OR_CATALOG.all||[]).find(x=>x.id===S.model)||null;
}
/* Context used: real turn tokens when the run reports them, else chars/4
   estimate of the live transcript. Limit: registry truth, else unknown. */
function ctxBucket(){
  const meta=currentModelMeta();
  if(!meta)return null;
  const limit=meta.context_length>0?meta.context_length:null;
  if(!limit)return null;
  const txt=(typeof convoText==='function'&&convoText())||'';
  const used=Math.max(S.tokens||0,Math.ceil(txt.length/4));
  return {used,limit,label:S.model};
}
const fmtK=n=>n>=1024?(Math.round(n/1024)+'K'):String(n);
/* Reasoning support: registry `reasoning` flag or supported_parameters
   carrying reasoning/effort controls. */
function thinkState(){
  const meta=currentModelMeta();
  const supported=!!meta&&(meta.reasoning===true||
    (meta.supported_parameters||[]).some(p=>/reason|effort|budget/i.test(p)));
  const cur=S.think||'normal';
  const found=THINK_LEVELS.find(l=>l[0]===cur);
  return {supported,label:supported?(found?found[1]:cur.toUpperCase()):'MODEL DEFAULT'};
}

let visionStream=null;   // updated by camera widget paint() via hook below

/* Keep the rail intentionally quiet. Secondary mission configuration always
   lives in one setup tray rather than expanding into toolbar spaghetti.
   Nodes are MOVED, not rebuilt, so each control keeps its state and handlers.
   Send, access and the mode pill are never collapsed — they are the identity of
   the bar. */
function fitRail(){
  const c=$('#ctl');if(!c||c.querySelector('.tray')||c.scrollWidth<=c.clientWidth+2)return;
  const movable=[...c.children].filter(n=>n.dataset&&n.dataset.pri==='2');if(!movable.length)return;

  const t=el('c tray');const tb=document.createElement('button');
  tb.className='b';tb.textContent='⚙';tb.title='Mission setup';
  const tm=el('menu right');tm.appendChild(el('mh','MISSION SETUP'));
  tb.onclick=e=>{e.stopPropagation();
    document.querySelectorAll('.c').forEach(x=>x!==t&&x.classList.remove('open'));t.classList.toggle('open')};
  t.append(tb,tm);c.insertBefore(t,c.querySelector('.sp'));

  // Move the least-important controls only until the rail fits. Wide screens
  // keep the complete mission envelope visible; narrow screens get one tray.
  for(let i=movable.length-1;i>=0&&c.scrollWidth>c.clientWidth+2;i--){
    tm.insertBefore(movable[i],tm.children[1]||null);
  }
  if(!tm.querySelector('.c'))t.remove();
}

/* Drag-drop intake on the composer: files, multiple files, folders (via
   webkitGetAsEntry recursion), and archives — all through the canonical
   capsule pipeline. Dropping is an explicit ingestion gesture. */
function entryFile(entry){ // FileSystemEntry → Promise<File-like> preserving relative path
  return new Promise(resolve=>{
    if(entry.isFile){
      entry.file(f=>{ try{Object.defineProperty(f,'webkitRelativePath',{value:entry.fullPath.replace(/^\//,'')});}catch(_){} resolve(f); },()=>resolve(null));
    }else if(entry.isDirectory){
      const reader=entry.createReader(),acc=[];
      const readBatch=()=>reader.readEntries(async batch=>{
        if(!batch.length){
          for(const e of acc){const f=await entryFile(e);if(f)acc.files.push(f);}
          resolve(acc.files);
          return;
        }
        acc.push(...batch);readBatch();
      },()=>resolve(null));
      acc.files=[];readBatch();
    }else resolve(null);
  });
}
async function handleDropFiles(dt){
  const items=[...(dt.items||[])];
  const entries=items.map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  let files=[];
  if(entries.length){
    for(const e of entries){const r=await entryFile(e);files=files.concat(r||[]);}
  }
  if(!files.length)files=[...(dt.files||[])];
  if(!files.length)return;
  note('📥 dropped '+files.length+' item'+(files.length>1?'s':''));
  // Many small drops: bundle into ONE folder capsule so coverage is unified.
  if(files.length>1||files[0].webkitRelativePath){
    note('🗂 packing drop…');
    const {blob,name}=await zipFileList(files);
    await uploadCapsule(blob,name,'drop');
  }else{
    const f=files[0];
    const smallText=f.size<=65536&&/text|json|javascript|csv|markdown|xml/.test(f.type||'');
    if(smallText){
      S.attachments.push({kind:'file',name:f.name,size:f.size,content:(await f.text()).slice(0,65536)});
      note('📄 attached '+f.name+' (content included)');
    }else await uploadCapsule(f,f.name);
  }
  paintCtl();
}

/* ══ SLASH BINDING SYSTEM — popover, chips, send contract (§1–§6) ══ */
const SLASH={items:[],popopen:false,mode:null,query:'',cursor:0,results:[],bindings:[]};
async function slashInit(){
  try{
    const [c,a,s,t,i]=await Promise.all([
      fetch('/api/registry/commands').then(r=>r.json()),
      fetch('/api/registry/agents').then(r=>r.json()).catch(()=>({agents:[]})),
      fetch('/api/registry/skills').then(r=>r.json()).catch(()=>({skills:[]})),
      fetch('/api/registry/tools').then(r=>r.json()).catch(()=>({flat:[]})),
      fetch('/api/registry/instructions').then(r=>r.json()).catch(()=>({instructions:[]}))
    ]);
    SLASH.commands=c||[];
    SLASH.reg={
      agent:(a.agents||[]).map(x=>({...x,icon:x.icon||'🧠'})),
      skill:(s.skills||[]).map(x=>({...x,icon:'⚡'})),
      tool:(t.flat||[]).map(x=>({...x,icon:'🔧',name2:x.name,desc:x.desc})),
      instruction:(i.instructions||[]).map(x=>({...x,icon:'📝'})),
    };
  }catch(e){SLASH.commands=[];SLASH.reg={agent:[],skill:[],tool:[],instruction:[]};}
}
function slashDetect(){
  // '/' typed at start of current token → popover. Only selection creates bindings.
  const box=$('#in'),pos=box.selectionStart,text=box.value.slice(0,pos);
  const m=text.match(/(^|\s)\/([a-z]*)$/i);
  if(!m){if(SLASH.popopen)slashClose();return null;}
  const typed=m[2];
  if(!typed)return {cmdMode:true,typed:''};
  const cmd=SLASH.commands.find(c=>c.cmd===typed.toLowerCase());
  if(cmd)return {cmdMode:false,cmd,typed:''};  // registry mode, empty query
  const partial=SLASH.commands.find(c=>c.cmd.startsWith(typed.toLowerCase()));
  return partial?{cmdMode:true,typed}:{null:null};
}
function slashOpen(state){
  SLASH.popopen=true;SLASH.cursor=0;
  const box=$('#in');
  let host=document.getElementById('slashpop');
  if(!host){host=document.createElement('div');host.id='slashpop';document.getElementById('composer').appendChild(host);}
  if(state.cmdMode){
    SLASH.mode='command';SLASH.query=state.typed||'';
    SLASH.results=(state.typed?SLASH.commands.filter(c=>c.cmd.startsWith(SLASH.query)):SLASH.commands)
      .map(c=>({kind:'command',icon:c.icon,label:'/'+c.cmd,desc:c.hint,cmd:c}));
  }else{
    SLASH.mode='registry';SLASH.cmd=state.cmd.cmd;SLASH.query=box.value.slice(box.selectionStart).trim();
    const q=SLASH.query.toLowerCase();
    const items=(SLASH.reg[SLASH.cmd]||[]);
    const scored=items.map(it=>{
      const nm=(it.name||'').toLowerCase();
      let score=-1;
      if(nm.startsWith(q))score=0;else if(nm.includes(q))score=1;
      return {...it,score};
    }).filter(it=>q===''||it.score>=0).sort((a,b)=>a.score-b.score);
    SLASH.results=scored.map(it=>({kind:'registry',icon:it.icon,label:it.name,
      desc:it.desc||'',meta:SLASH.cmd==='agent'?(it.tools?it.tools+' tools':''):(SLASH.cmd==='tool'?it.ns:(it.steps?it.steps+' steps':'')),item:it}));
  }
  slashPaint();
}
function slashPaint(){
  const host=document.getElementById('slashpop');if(!host)return;
  host.innerHTML='';
  SLASH.results.slice(0,40).forEach((r,i)=>{
    const row=document.createElement('div');row.className='slashrow'+(i===SLASH.cursor?' cur':'');
    row.innerHTML='<span class="si">'+r.icon+'</span><span class="sl"></span><span class="sd"></span><span class="sm"></span>';
    row.querySelector('.sl').textContent=r.label;
    row.querySelector('.sd').textContent=(r.desc||'').slice(0,60);
    row.querySelector('.sm').textContent=r.meta||'';
    row.onmousedown=e=>{e.preventDefault();SLASH.cursor=i;SLASH.pickCurrent();};
    host.appendChild(row);
  });
  if(!SLASH.results.length){host.innerHTML='<div class="slashempty">no matches</div>';}
}
function slashClose(){SLASH.popopen=false;const h=document.getElementById('slashpop');if(h)h.remove();}
function slashPickCurrent(){
  const r=SLASH.results[SLASH.cursor];if(!r){slashClose();return;}
  if(r.kind==='command'){
    // move from command mode into registry mode: replace '/cmd' with '/cmd ' and reopen
    const box=$('#in');
    box.value=box.value.replace(/\/[a-z]*$/i,'/'+r.cmd.cmd+' ');
    slashClose();slashOpen({cmdMode:false,cmd:r.cmd});
    box.focus();
    return;
  }
  // pick registry item → binding chip
  addBindingChip(SLASH.cmd,r.item);
  // remove the typed '/cmd query' text
  const box=$('#in');
  box.value=box.value.replace(/\/[a-z]+[^/]*$/i,'');
  slashClose();paintChips();box.focus();
}
function addBindingChip(kind,item){
  if(kind==='agent'&&SLASH.bindings.some(b=>b.kind==='agent')){
    note('↻ replaces '+SLASH.bindings.find(b=>b.kind==='agent').id);
    SLASH.bindings=SLASH.bindings.filter(b=>b.kind!=='agent');
  }
  if((kind==='workflow'||kind==='goal')&&SLASH.bindings.some(b=>b.kind===kind)){
    note('⚠ only one '+kind+' per message');return;
  }
  SLASH.bindings.push({kind,id:item.id||item.name});
}
function paintChips(){
  document.querySelectorAll('.chip').forEach(el=>el.remove());
  const composer=document.getElementById('composer');
  for(const b of SLASH.bindings){
    const chip=document.createElement('span');chip.className='chip';
    const cmd=(SLASH.commands||[]).find(c=>c.cmd===b.kind)||{};
    chip.textContent=(cmd.icon||'')+' '+b.id+' ×';
    chip.title=b.kind+':'+b.id+' — click to remove';
    chip.onclick=()=>{SLASH.bindings=SLASH.bindings.filter(x=>x!==b);paintChips();};
    composer.insertBefore(chip,$('#in'));
  }
}

/* Local file/folder attach: real reads, not decorative inputs. Small text
   files carry their content into the mission envelope; anything bigger or
   binary goes through the CANONICAL INTAKE pipeline (/api/upload → capsule
   with manifest + coverage receipt) so PurpClaw can enumerate, parse and
   audit every file in the drop. Folders are zipped client-side and sent
   through the same capsule path — no more metadata-only ghost attachments. */
async function uploadCapsule(fileOrBlob, name, kindHint){
  note('⬆ intake: '+name+' ('+Math.round(fileOrBlob.size/1048576*10)/10+' MB)…');
  try{
    const r=await fetch('/api/upload?source=chat-drop&sessionId='+(S.session||''),{method:'POST',headers:{'x-filename':name},body:fileOrBlob});
    const d=await r.json();
    if(!d.ok)throw new Error(d.error||('HTTP '+r.status));
    S.attachments.push({kind:d.kind,name,capsuleId:d.capsuleId,path:d.path,root:d.root,
      manifestPath:d.manifestPath,fileCount:d.fileCount});
    note(d.summary||('📦 '+d.capsuleId+' — '+d.fileCount+' files'));
  }catch(e){ note('⚠ intake failed: '+e.message); }
}
function pickLocal(kind){
  const inp=document.createElement('input');inp.type='file';
  if(kind==='folder'&&'webkitdirectory'in inp){inp.webkitdirectory=true;inp.multiple=true;}
  inp.onchange=async()=>{
    const files=[...inp.files];if(!files.length)return;
    if(kind==='folder'){
      // REAL folder ingestion: zip the relative-path tree client-side (store
      // method via ZIP64-less local headers), then send through the capsule
      // pipeline so structure + contents survive. No flattening.
      note('🗂 packing '+files.length+' files…');
      const {blob,name}=await zipFileList(files);
      await uploadCapsule(blob,name,'folder');
    }else{
      const f=files[0];
      // Tiny text files inline instantly — no round trip. Everything else
      // goes through the canonical intake capsule.
      const smallText=f.size<=65536&&/text|json|javascript|csv|markdown|xml/.test(f.type||'');
      if(smallText){
        S.attachments.push({kind:'file',name:f.name,size:f.size,content:(await f.text()).slice(0,65536)});
        note('📄 attached '+f.name+' (content included)');
      }else{
        await uploadCapsule(f,f.name);
      }
    }
    paintCtl();
  };
  inp.click();
}
/* Minimal STORE-method zip writer (no deps): CRC32 + local headers + central
   directory. Files are stored uncompressed — fine for source trees; archives
   of already-compressed media just cost bandwidth. */
async function zipFileList(files){
  const table=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c;}return t;})();
  const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=table[(c^b[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
  const enc=new TextEncoder(),chunks=[],central=[];let offset=0;
  for(const f of files){
    const data=new Uint8Array(await f.arrayBuffer());
    const nameStr=(f.webkitRelativePath||f.name).replace(/^\/+/,'');
    const nameB=enc.encode(nameStr);
    const crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);
    lh.setUint16(10,0,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);
    lh.setUint16(26,nameB.length,true);lh.setUint16(28,0,true);
    chunks.push(new Uint8Array(lh.buffer),nameB,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);
    ch.setUint16(10,0,true);ch.setUint16(12,0,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);
    ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,nameB.length,true);ch.setUint32(42,offset,true);
    central.push(new Uint8Array(ch.buffer),nameB);
    offset+=30+nameB.length+data.length;
  }
  let cdSize=0;for(const c of central)cdSize+=c.length;
  const eocd=new DataView(new ArrayBuffer(22));
  eocd.setUint32(0,0x06054b50,true);eocd.setUint16(8,files.length,true);eocd.setUint16(10,files.length,true);
  eocd.setUint32(12,cdSize,true);eocd.setUint32(16,offset,true);
  return {blob:new Blob([...chunks,...central,new Uint8Array(eocd.buffer)],{type:'application/zip'}),
          name:'folder-'+Date.now()+'.zip'};
}

/* Reasoning + tool JSON are internals. Brace-counted: real args nest. */

/* ── markdown render ────────────────────────────────────────────────────
   Assistant answers arrive as Markdown. Rendering them with textContent
   showed the operator raw source — literal **bold**, backticked code and
   pipe-tables — which flattened headings and tables into one slab of prose.

   SECURITY: the text is HTML-escaped FIRST, then formatting is applied to
   the already-escaped string. Model output therefore cannot introduce markup;
   there is no path from provider text to live HTML. That is sanitising by
   construction rather than trusting a blocklist. */
const MD_TICK = String.fromCharCode(96);
const MD_FENCE = MD_TICK + MD_TICK + MD_TICK;

function mdEsc(t) {
  return String(t == null ? '' : t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function mdInline(t) {
  // Inline code first, so its contents are not further formatted.
  const codeRe = new RegExp(MD_TICK + '([^' + MD_TICK + '\\n]+)' + MD_TICK, 'g');
  return t
    .replace(codeRe, '<code class="md-code">$1</code>')
    .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>')
    // Links: only http/https survive. No javascript: or data: targets.
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
}

function mdToHtml(src) {
  const esc = mdEsc(src);
  const blocks = [];
  // Pull fenced code out before anything else: its body must stay literal.
  const fenceRe = new RegExp(MD_FENCE + '([a-z0-9+#-]*)\\n([\\s\\S]*?)' + MD_FENCE, 'gi');
  const text = esc.replace(fenceRe, function (m, lang, body) {
    blocks.push('<pre class="md-pre"><code>' + body.replace(/\n$/, '') + '</code></pre>');
    return '<!--MDB' + (blocks.length - 1) + '-->';
  });

  const lines = text.split('\n');
  const out = [];
  let para = [];
  let i = 0;
  const flushPara = function () {
    if (para.length) out.push('<p class="md-p">' + mdInline(para.join(' ')) + '</p>');
    para = [];
  };
  const cells = function (r) {
    return r.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); });
  };

  while (i < lines.length) {
    const ln = lines[i];

    // Table: a header row followed by a separator row.
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      flushPara();
      const head = cells(ln);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push('<div class="md-tablewrap"><table class="md-table"><thead><tr>'
        + head.map(function (h) { return '<th>' + mdInline(h) + '</th>'; }).join('')
        + '</tr></thead><tbody>'
        + rows.map(function (r) {
            return '<tr>' + r.map(function (c) { return '<td>' + mdInline(c) + '</td>'; }).join('') + '</tr>';
          }).join('')
        + '</tbody></table></div>');
      continue;
    }

    // Heading.
    const h = ln.match(/^(#{1,6})\s+(.*)$/);
    if (h) {
      flushPara();
      out.push('<div class="md-h md-h' + Math.min(6, h[1].length) + '">' + mdInline(h[2]) + '</div>');
      i++; continue;
    }

    // Horizontal rule.
    if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(ln)) {
      flushPara(); out.push('<hr class="md-hr">'); i++; continue;
    }

    // Blockquote (">" is already escaped to &gt; at this point).
    if (/^\s*&gt;\s?/.test(ln)) {
      flushPara();
      const q = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i])) {
        q.push(lines[i].replace(/^\s*&gt;\s?/, '')); i++;
      }
      out.push('<blockquote class="md-quote">' + mdInline(q.join(' ')) + '</blockquote>');
      continue;
    }

    // Lists.
    if (/^\s*(?:[-*+]|\d+\.)\s+/.test(ln)) {
      flushPara();
      const ordered = /^\s*\d+\./.test(ln);
      const items = [];
      while (i < lines.length && /^\s*(?:[-*+]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/, '')); i++;
      }
      const tag = ordered ? 'ol' : 'ul';
      out.push('<' + tag + ' class="md-list">'
        + items.map(function (x) { return '<li>' + mdInline(x) + '</li>'; }).join('')
        + '</' + tag + '>');
      continue;
    }

    // A code-block placeholder is a block element: emit it directly rather
    // than letting it fall into a paragraph, because <pre> inside <p> is
    // invalid and the browser silently closes the <p>, wrecking the layout.
    if (/^<!--MDB\d+-->$/.test(ln.trim())) { flushPara(); out.push(ln.trim()); i++; continue; }

    // Blank line ends a paragraph.
    if (!ln.trim()) { flushPara(); i++; continue; }

    para.push(ln); i++;
  }
  flushPara();

  // Restore fenced code blocks.
  return out.join('').replace(/<!--MDB(\d+)-->/g, function (m, n) { return blocks[Number(n)] || ''; });
}

/* Render assistant markdown into an element. Falls back to plain text if the
   renderer throws — a formatting bug must never blank the answer. */
function renderAssistant(el, text) {
  try { el.innerHTML = mdToHtml(text); }
  catch (e) { el.textContent = text; }
}

function clean(t){
  let o=String(t||'').replace(/<think>[\s\S]*?<\/think>/gi,'');
  const k=o.lastIndexOf('<think>');if(k!==-1)o=o.slice(0,k);
  for(;;){const st=o.search(/\{\s*"tool"\s*:/);if(st===-1)break;
    let d=0,end=-1,q=false,esc=false;
    for(let i=st;i<o.length;i++){const ch=o[i];
      if(esc){esc=false;continue}if(ch==='\\'){esc=true;continue}
      if(ch==='"'){q=!q;continue}if(q)continue;
      if(ch==='{')d++;else if(ch==='}'){d--;if(d===0){end=i+1;break}}}
    if(end===-1){o=o.slice(0,st);break}o=o.slice(0,st)+o.slice(end)}
  // Encoding damage must not reach the operator as visible garbage. Strip the
  // U+FFFD replacement character and any unpaired surrogate — both are the
  // residue of a bad decode (the "😭����" mess), never content the model meant.
  o=o.replace(/�/g,'')
     .replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])/g,'')
     .replace(/(^|[^\uD800-\uDBFF])[\uDC00-\uDFFF]/g,'$1');
  return o.replace(/[ \t]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trimStart();
}

function _generateFace(opts){

function companionAngolin(){
