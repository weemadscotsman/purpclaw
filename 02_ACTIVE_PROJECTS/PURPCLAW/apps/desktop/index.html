<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PURPCLAW — Desktop</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#07040e;--bg-panel:#100a1d;--bg-raised:#160f28;
  --border:#241a3a;--border-strong:#3a2a5e;
  --accent:#a855f7;--accent-2:#ec4899;
  --success:#4ade80;--warning:#f5b52a;--danger:#ef4444;--info:#22d3ee;
  --text:#ece7f5;--text-muted:#8b7fa8;
  --font:'Chakra Petch',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--font);color:var(--text);background:var(--bg);display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:3px}

/* ── Top Bar ── */
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:8px 16px;
  background:var(--bg-panel);border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.brand{
  display:flex;align-items:center;gap:8px;
  font-size:16px;font-weight:700;letter-spacing:.06em;
  color:var(--accent);
}
.brand-mark{
  width:30px;height:30px;border-radius:7px;
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);
  display:grid;place-items:center;font-size:16px;
}
.status-badge{
  display:flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:20px;
  font-size:11px;font-family:var(--mono);letter-spacing:.08em;
  background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.3);
  color:var(--success);
}
.status-badge.disconnected{
  background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:var(--danger);
}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── Main Layout ── */
#main{display:flex;flex:1;overflow:hidden}

/* ── Left Rail ── */
#rail{
  width:220px;flex-shrink:0;
  background:linear-gradient(180deg,var(--bg-panel),#0b0716);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow-y:auto;padding:8px;
}
#rail-header{
  padding:12px 10px 10px;
  border-bottom:1px solid var(--border);
  margin-bottom:8px;
}
#rail-header .brand{font-size:15px}
#rail-header .tag{font-size:9px;color:var(--text-muted);letter-spacing:.05em;padding-top:2px}

.nav-item{
  display:flex;align-items:center;gap:9px;
  width:100%;text-align:left;padding:9px 10px;border-radius:8px;
  color:var(--text-muted);font-size:12.5px;font-weight:500;
  cursor:pointer;border:1px solid transparent;
  transition:background .15s,color .15s,border-color .15s;
}
.nav-item:hover{background:var(--bg-raised);color:var(--text)}
.nav-item.active{background:rgba(168,85,247,.18);border-color:rgba(168,85,247,.4);color:var(--text)}
.nav-item.active .ni-ico{color:var(--accent)}
.ni-ico{width:18px;text-align:center;font-size:14px;flex-shrink:0}

.nav-group{
  font-family:var(--mono);font-size:8.5px;
  letter-spacing:.2em;color:var(--text-muted);
  padding:10px 10px 4px;opacity:.6;
}

/* ── Content ── */
#content{
  flex:1;min-width:0;display:flex;flex-direction:column;
  overflow:hidden;
}
#chat-output{
  flex:1;overflow-y:auto;padding:16px;
  display:flex;flex-direction:column;gap:12px;
}
#chat-input-area{
  padding:12px 16px;
  background:var(--bg-panel);border-top:1px solid var(--border);
  display:flex;gap:10px;align-items:flex-end;
}
#chat-input{
  flex:1;background:var(--bg-raised);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;
  color:var(--text);font-family:var(--font);font-size:13px;
  resize:none;outline:none;min-height:42px;max-height:120px;
  transition:border-color .15s;
}
#chat-input:focus{border-color:var(--accent)}
#chat-input::placeholder{color:var(--text-muted)}
#send-btn{
  height:42px;padding:0 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  border-radius:10px;font-weight:600;font-size:13px;
  letter-spacing:.04em;white-space:nowrap;
  transition:opacity .15s,filter .15s;
}
#send-btn:hover{filter:brightness(1.15)}
#send-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── Message Bubbles ── */
.msg{
  display:flex;gap:10px;max-width:82%;
}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-avatar{
  width:30px;height:30px;border-radius:8px;flex-shrink:0;
  background:rgba(168,85,247,.2);border:1px solid rgba(168,85,247,.3);
  display:grid;place-items:center;font-size:13px;
  align-self:flex-end;
}
.msg.user .msg-avatar{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.3)}
.msg-bubble{
  background:var(--bg-raised);border:1px solid var(--border);
  border-radius:12px;padding:10px 14px;
  font-size:13px;line-height:1.55;
  word-break:break-word;
}
.msg.user .msg-bubble{
  background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.35);
}
.msg-role{font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--text-muted);margin-bottom:4px}
.msg.user .msg-role{color:var(--info);text-align:right}

/* ── Approval Modal ── */
#approval-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(7,4,14,.85);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;
}
#approval-box{
  background:var(--bg-panel);border:1px solid var(--accent);
  border-radius:16px;padding:28px 32px;
  max-width:520px;width:90%;
  box-shadow:0 0 40px rgba(168,85,247,.25);
}
#approval-box h2{
  font-size:14px;font-family:var(--mono);letter-spacing:.12em;
  color:var(--accent);margin-bottom:16px;
  display:flex;align-items:center;gap:10px;
}
#approval-box h2 .ico{font-size:20px}
#approval-method{
  font-family:var(--mono);font-size:12px;
  background:var(--bg-raised);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;margin-bottom:12px;
  color:var(--text-muted);word-break:break-all;
}
#approval-command{
  font-family:var(--mono);font-size:12px;
  background:#0a0613;border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;margin-bottom:16px;
  color:var(--warning);word-break:break-all;max-height:80px;overflow-y:auto;
}
.ap-row{display:flex;gap:10px;margin-top:4px}
.ap-btn{
  flex:1;padding:10px;border-radius:9px;font-weight:600;font-size:13px;
  border:1px solid;transition:filter .15s;
}
.ap-btn.allow{background:rgba(74,222,128,.15);border-color:var(--success);color:var(--success)}
.ap-btn.allow:hover{filter:brightness(1.2)}
.ap-btn.deny{background:rgba(239,68,68,.12);border-color:var(--danger);color:var(--danger)}
.ap-btn.deny:hover{filter:brightness(1.2)}

/* ── Sessions Panel ── */
#sessions-panel{
  position:fixed;inset:0;z-index:500;
  display:flex;justify-content:flex-end;
}
#sessions-backdrop{
  position:absolute;inset:0;background:rgba(7,4,14,.6);
}
#sessions-drawer{
  position:relative;width:340px;
  background:var(--bg-panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.panel-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--border);
  font-size:13px;font-weight:600;letter-spacing:.06em;
}
#sessions-list{flex:1;overflow-y:auto;padding:8px}
.session-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:10px;cursor:pointer;
  color:var(--text-muted);font-size:12.5px;
  border:1px solid transparent;transition:all .15s;
}
.session-item:hover{background:var(--bg-raised);color:var(--text)}
.session-item.selected{background:rgba(168,85,247,.15);border-color:rgba(168,85,247,.4);color:var(--text)}
.session-item .si-ico{font-size:16px;color:var(--accent);width:20px;text-align:center}
.session-item .si-name{flex:1}
.session-item .si-time{font-family:var(--mono);font-size:10px;color:var(--text-muted)}
.new-session-btn{
  margin:10px 14px;padding:10px;
  background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.4);
  border-radius:10px;color:var(--accent);font-weight:600;font-size:13px;
  text-align:center;cursor:pointer;transition:filter .15s;
}
.new-session-btn:hover{filter:brightness(1.2)}

/* ── Tool Results ── */
.tool-result{
  background:#0a0613;border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-family:var(--mono);font-size:12px;
  color:var(--text-muted);margin-top:8px;max-height:200px;overflow-y:auto;
  white-space:pre-wrap;word-break:break-all;
}
.tool-result.error{color:var(--danger);border-color:rgba(239,68,68,.3)}
.tool-result.success{color:var(--success);border-color:rgba(74,222,128,.3)}

/* ── Gateway Stats ── */
#stats-bar{
  display:flex;gap:14px;padding:6px 16px;
  background:var(--bg-panel);border-top:1px solid var(--border);
  font-family:var(--mono);font-size:10px;color:var(--text-muted);
  flex-shrink:0;overflow-x:auto;
}
.stat-chip{display:flex;align-items:center;gap:5px}
.stat-val{color:var(--text)}
.stat-val.ok{color:var(--success)}
.stat-val.err{color:var(--danger)}

/* ── Views ── */
.view{display:none;flex-direction:column;flex:1;overflow:hidden}
.view.active{display:flex}
</style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <div class="brand">
    <div class="brand-mark">⬡</div>
    PURPCLAW
  </div>
  <div id="gateway-status" class="status-badge disconnected">
    <span class="dot"></span>
    <span id="status-text">CONNECTING</span>
  </div>
  <div style="flex:1"></div>
  <button class="nav-item" onclick="showView('sessions')" title="Sessions" style="padding:6px 10px;border-radius:8px">
    <span class="ni-ico">☰</span>
  </button>
</div>

<!-- Main -->
<div id="main">

  <!-- Rail -->
  <div id="rail">
    <div id="rail-header">
      <div class="brand">⬡ PURPCLAW</div>
      <div class="tag">AUTONOMOUS WORKSTATION</div>
    </div>

    <div class="nav-group">WORKSPACE</div>
    <button class="nav-item active" onclick="showView('chat')" data-view="chat">
      <span class="ni-ico">◈</span> Chat
    </button>
    <button class="nav-item" onclick="showView('agents')" data-view="agents">
      <span class="ni-ico">⬡</span> Agents
    </button>
    <button class="nav-item" onclick="showView('workflows')" data-view="workflows">
      <span class="ni-ico">⟁</span> Workflows
    </button>
    <button class="nav-item" onclick="showView('eval')" data-view="eval">
      <span class="ni-ico">◉</span> Eval
    </button>
    <button class="nav-item" onclick="showView('memory')" data-view="memory">
      <span class="ni-ico">◫</span> Memory
    </button>
    <button class="nav-item" onclick="showView('hooks')" data-view="hooks">
      <span class="ni-ico">⚡</span> Hooks
    </button>
    <button class="nav-item" onclick="showView('marketplace')" data-view="marketplace">
      <span class="ni-ico">◇</span> Marketplace
    </button>
    <button class="nav-item" onclick="showView('skills')" data-view="skills">
      <span class="ni-ico">✦</span> Skills
    </button>
    <button class="nav-item" onclick="showView('settings')" data-view="settings">
      <span class="ni-ico">⚙</span> Settings
    </button>
  </div>

  <!-- Content Area (switches per view) -->
  <div id="content">

    <!-- CHAT VIEW -->
    <div id="view-chat" class="view active">
      <div id="chat-output"></div>
      <div id="chat-input-area">
        <textarea id="chat-input" placeholder="Ask PURPCLAW anything…" rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()">SEND</button>
      </div>
    </div>

    <!-- AGENTS VIEW -->
    <div id="view-agents" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">ACTIVE AGENTS</h2>
        <div id="agents-list"></div>
      </div>
    </div>

    <!-- WORKFLOWS VIEW -->
    <div id="view-workflows" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">WORKFLOWS</h2>
        <div id="workflows-list"></div>
      </div>
    </div>

    <!-- EVAL VIEW -->
    <div id="view-eval" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">EVAL SUITES</h2>
        <div style="display:flex;flex-direction:column;gap:10px">
          <button class="nav-item active" style="border:1px solid var(--border)" onclick="runEval('smoke')">◉ Smoke Tests</button>
          <button class="nav-item" style="border:1px solid var(--border)" onclick="runEval('regression')">◉ Regression Suite</button>
          <button class="nav-item" style="border:1px solid var(--border)" onclick="runEval('chaos')">◉ Chaos Tests</button>
        </div>
        <div id="eval-output" style="margin-top:16px"></div>
      </div>
    </div>

    <!-- MEMORY VIEW -->
    <div id="view-memory" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">SESSION MEMORY</h2>
        <div id="memory-list"></div>
      </div>
    </div>

    <!-- HOOKS VIEW -->
    <div id="view-hooks" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">ACTIVE HOOKS</h2>
        <div id="hooks-list"></div>
      </div>
    </div>

    <!-- MARKETPLACE VIEW -->
    <div id="view-marketplace" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">MARKETPLACE</h2>
        <div id="marketplace-list"></div>
      </div>
    </div>

    <!-- SKILLS VIEW -->
    <div id="view-skills" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">SKILLS REGISTRY</h2>
        <div id="skills-list"></div>
      </div>
    </div>

    <!-- SETTINGS VIEW -->
    <div id="view-settings" class="view">
      <div style="padding:16px;flex:1;overflow-y:auto">
        <h2 style="font-size:13px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:14px">SETTINGS</h2>
        <div id="settings-content"></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /main -->

<!-- Stats Bar -->
<div id="stats-bar">
  <div class="stat-chip">MODEL: <span class="stat-val" id="stat-model">—</span></div>
  <div class="stat-chip">METHODS: <span class="stat-val ok" id="stat-methods">—</span></div>
  <div class="stat-chip">SESSION: <span class="stat-val" id="stat-session">—</span></div>
  <div class="stat-chip">MSGS: <span class="stat-val" id="stat-msgs">0</span></div>
  <div class="stat-chip">TOKENS: <span class="stat-val" id="stat-tokens">—</span></div>
</div>

<!-- Approval Modal (hidden by default) -->
<div id="approval-overlay" style="display:none">
  <div id="approval-box">
    <h2><span class="ico">⚡</span> APPROVAL REQUIRED</h2>
    <div id="approval-method"></div>
    <div id="approval-command"></div>
    <div style="font-size:11px;color:var(--text-muted);margin-bottom:14px;font-family:var(--mono)">Do you want to allow this action?</div>
    <div class="ap-row">
      <button class="ap-btn allow" onclick="respondApproval(true)">ALLOW ONCE</button>
      <button class="ap-btn deny"  onclick="respondApproval(false)">DENY</button>
    </div>
  </div>
</div>

<!-- Sessions Drawer (hidden by default) -->
<div id="sessions-panel" style="display:none">
  <div id="sessions-backdrop" onclick="hideSessions()"></div>
  <div id="sessions-drawer">
    <div class="panel-hdr">
      <span>SESSIONS</span>
      <button onclick="hideSessions()" style="font-size:18px;color:var(--text-muted)">✕</button>
    </div>
    <button class="new-session-btn" onclick="newSession()">+ NEW CONVERSATION</button>
    <div id="sessions-list"></div>
  </div>
</div>

<script>
'use strict';

// ── State ────────────────────────────────────────────────────────────────────
let ws = null;
let rpcId = 1;
let msgCount = 0;
let activeSessionId = null;
let pendingApproval = null;
let pendingApprovalResolve = null;
const sessions = [];
const messages = [];

// ── Backend connection ───────────────────────────────────────────────────────
async function init() {
  const { ws: url } = await window.purpclaw.backend();
  connect(url);

  // Listen for renderer navigation events from main process
  window.purpclaw.onNavigate(view => showView(view));
  window.purpclaw.onNewConv(() => newSession());
  window.purpclaw.onApprovalResp(({ requestId, approved }) => {
    // approval modal handled inline
  });
}

function connect(url) {
  setStatus('connecting');
  ws = new WebSocket(url);

  ws.addEventListener('open', async () => {
    setStatus('active');
    try {
      const caps = await rpc('gateway.capabilities', {});
      document.getElementById('stat-model').textContent = caps.model || caps.provider || '—';
      document.getElementById('stat-methods').textContent = Array.isArray(caps.methods) ? caps.methods.length : '—';
    } catch(e) { /* non-fatal */ }
  });

  ws.addEventListener('message', async (evt) => {
    const msg = JSON.parse(evt.data);
    await handleMessage(msg);
  });

  ws.addEventListener('close', () => {
    setStatus('disconnected');
    setTimeout(() => connect(url), 3000);
  });

  ws.addEventListener('error', () => {
    setStatus('disconnected');
  });
}

function setStatus(state, text) {
  const el = document.getElementById('gateway-status');
  const txt = document.getElementById('status-text');
  if (state === 'active') {
    el.className = 'status-badge';
    txt.textContent = text || 'ACTIVE';
  } else {
    el.className = 'status-badge disconnected';
    txt.textContent = text || 'DISCONNECTED';
  }
}

// ── JSON-RPC ─────────────────────────────────────────────────────────────────
function rpc(method, params = {}) {
  return new Promise((resolve, reject) => {
    const id = rpcId++;
    const send = () => ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
    if (ws.readyState === WebSocket.CONNECTING) {
      ws.addEventListener('open', send, { once: true });
    } else {
      send();
    }
    const cleanup = (ev) => {
      const data = JSON.parse(ev.data);
      if (data.id === id) {
        ws.removeEventListener('message', cleanup);
        if (data.error) reject(new Error(data.error.message || JSON.stringify(data.error)));
        else resolve(data.result);
      }
    };
    ws.addEventListener('message', cleanup);
    setTimeout(() => { ws.removeEventListener('message', cleanup); reject(new Error('RPC timeout')); }, 20000);
  });
}

// ── Message dispatch ─────────────────────────────────────────────────────────
async function handleMessage(msg) {
  // rpc response
  if (msg.id != null) return;

  // gateway event
  if (msg.method === 'gateway.ready') {
    // initial ready after connect
  } else if (msg.method === 'approval.required') {
    showApproval(msg.params);
  } else if (msg.method === 'tool.result') {
    appendToolResult(msg.params);
  } else if (msg.method === 'agent.thought') {
    appendThought(msg.params);
  } else if (msg.method === 'session.updated') {
    refreshSessions();
  }
}

// ── Chat ─────────────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  appendMsg('user', text);
  messages.push({ role: 'user', content: text });
  document.getElementById('stat-msgs').textContent = ++msgCount;

  input.style.height = 'auto';
  setLoading(true);

  try {
    const result = await rpc('chat.send', { message: text, sessionId: activeSessionId });
    if (result?.reply) {
      appendMsg('assistant', result.reply);
      messages.push({ role: 'assistant', content: result.reply });
    } else if (result?.text) {
      appendMsg('assistant', result.text);
      messages.push({ role: 'assistant', content: result.text });
    } else if (result?.content) {
      const text = Array.isArray(result.content) ? result.content.map(c => c.text || c).join('\n') : result.content;
      appendMsg('assistant', text);
      messages.push({ role: 'assistant', content: text });
    }
  } catch(e) {
    appendMsg('assistant', 'Error: ' + e.message);
  } finally {
    setLoading(false);
  }
}

function appendMsg(role, html) {
  const out = document.getElementById('chat-output');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = role === 'assistant' ? '◈' : '◉';
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div class="msg-bubble">
      <div class="msg-role">${role === 'assistant' ? 'PURPCLAW' : 'YOU'}</div>
      <div>${escapeHtml(html)}</div>
    </div>`;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function appendToolResult({ tool, result, error }) {
  const out = document.getElementById('chat-output');
  const div = document.createElement('div');
  div.className = 'msg assistant';
  const cls = error ? 'error' : 'success';
  div.innerHTML = `
    <div class="msg-avatar">◈</div>
    <div class="msg-bubble">
      <div class="msg-role">TOOL: ${escapeHtml(tool)}</div>
      <div class="tool-result ${cls}">${error ? escapeHtml(error) : escapeHtml(JSON.stringify(result, null, 2))}</div>
    </div>`;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function appendThought({ thought }) {
  // Lightweight inline thought indicator
  const out = document.getElementById('chat-output');
  const existing = out.querySelector('.thought-indicator');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = 'msg assistant thought-indicator';
  div.innerHTML = `<div class="msg-avatar">◈</div><div class="msg-bubble" style="font-size:11px;color:var(--text-muted);font-family:var(--mono)">◙ ${escapeHtml(thought)}</div>`;
  out.appendChild(div);
  out.scrollTop = out.scrollHeight;
}

function setLoading(on) {
  document.getElementById('send-btn').disabled = on;
}

// ── Approval ─────────────────────────────────────────────────────────────────
function showApproval({ requestId, method, params }) {
  document.getElementById('approval-method').textContent = method;
  document.getElementById('approval-command').textContent = params?.command || params?.cmd || JSON.stringify(params, null, 2);
  document.getElementById('approval-overlay').style.display = 'flex';
  pendingApproval = { requestId, method };
  pendingApprovalResolve = null;
}

function respondApproval(approved) {
  document.getElementById('approval-overlay').style.display = 'none';
  if (!pendingApproval) return;
  const { requestId, method } = pendingApproval;
  pendingApproval = null;
  rpc('approval.respond', { requestId, approved }).catch(() => {});
  // If this was a chat send that triggered approval, retry
  if (method === 'runtime.execute' && approved) {
    // re-trigger the last user message would go here — for now just close
  }
}

// ── Sessions ─────────────────────────────────────────────────────────────────
function showSessions() { document.getElementById('sessions-panel').style.display = 'flex'; }
function hideSessions() { document.getElementById('sessions-panel').style.display = 'none'; }

async function newSession() {
  hideSessions();
  try {
    const s = await rpc('session.create', {});
    activeSessionId = s.sessionId || s.id;
    document.getElementById('stat-session').textContent = String(activeSessionId).slice(0, 8);
    messages.length = 0;
    document.getElementById('chat-output').innerHTML = '';
  } catch(e) { /* non-fatal */ }
  window.purpclaw.newConversation();
}

async function refreshSessions() {
  try {
    const list = await rpc('session.list', {});
    const sessions = Array.isArray(list) ? list : list?.sessions || [];
    const el = document.getElementById('sessions-list');
    if (!sessions.length) {
      el.innerHTML = '<div style="padding:14px;font-size:12px;color:var(--text-muted);text-align:center">No sessions</div>';
      return;
    }
    el.innerHTML = sessions.map(s => `
      <div class="session-item ${s.id === activeSessionId || s.sessionId === activeSessionId ? 'selected' : ''}"
           onclick="loadSession('${s.sessionId || s.id}')">
        <span class="si-ico">◈</span>
        <span class="si-name">${escapeHtml(s.name || 'Session ' + String(s.id||'').slice(0,6))}</span>
        <span class="si-time">${s.updatedAt ? new Date(s.updatedAt).toLocaleTimeString() : ''}</span>
      </div>`).join('');
  } catch(e) { /* non-fatal */ }
}

async function loadSession(id) {
  hideSessions();
  activeSessionId = id;
  document.getElementById('stat-session').textContent = String(id).slice(0, 8);
  try {
    const history = await rpc('session.history', { sessionId: id });
    const msgs = history?.messages || [];
    document.getElementById('chat-output').innerHTML = '';
    msgs.forEach(m => appendMsg(m.role === 'user' ? 'user' : 'assistant', m.content || m.text || ''));
  } catch(e) { /* non-fatal */ }
}

// ── Navigation ───────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-item[data-view]').forEach(b => b.classList.remove('active'));
  const v = document.getElementById('view-' + name);
  if (v) v.classList.add('active');
  document.querySelectorAll(`.nav-item[data-view="${name}"]`).forEach(b => b.classList.add('active'));
  loadViewData(name);
}

async function loadViewData(name) {
  if (name === 'agents')     await loadAgents();
  if (name === 'workflows')   await loadWorkflows();
  if (name === 'memory')      await loadMemory();
  if (name === 'hooks')       await loadHooks();
  if (name === 'marketplace') await loadMarketplace();
  if (name === 'skills')      await loadSkills();
  if (name === 'settings')    await loadSettings();
}

// ── Per-view data loaders ────────────────────────────────────────────────────
async function loadAgents() {
  try {
    const r = await rpc('agent.list', {});
    const agents = Array.isArray(r) ? r : r?.agents || [];
    document.getElementById('agents-list').innerHTML = agents.length
      ? agents.map(a => `<div class="nav-item" style="border:1px solid var(--border)">
          <span class="ni-ico">⬡</span><span>${escapeHtml(a.name||a.id||'Agent')}</span>
          <span style="margin-left:auto;font-size:10px;font-family:var(--mono);color:${a.status==='running'?'var(--success)':'var(--text-muted)'}">${a.status||'idle'}</span>
         </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:12px">No active agents</div>';
  } catch(e) { document.getElementById('agents-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadWorkflows() {
  try {
    const r = await rpc('workflow.list', {});
    const wfs = Array.isArray(r) ? r : r?.workflows || [];
    document.getElementById('workflows-list').innerHTML = wfs.length
      ? wfs.map(w => `<div class="nav-item" style="border:1px solid var(--border)">
          <span class="ni-ico">⟁</span><span>${escapeHtml(w.name||w.id||'Workflow')}</span>
          <span style="margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--text-muted)">${w.status||'idle'}</span>
         </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:12px">No workflows running</div>';
  } catch(e) { document.getElementById('workflows-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadMemory() {
  try {
    const r = await rpc('memory.list', {});
    const items = Array.isArray(r) ? r : r?.memories || [];
    document.getElementById('memory-list').innerHTML = items.length
      ? items.map(m => `<div style="padding:10px 12px;border:1px solid var(--border);border-radius:9px;margin-bottom:8px">
          <div style="font-size:10px;font-family:var(--mono);color:var(--accent);margin-bottom:4px">${escapeHtml(m.key||m.tag||'memory')}</div>
          <div style="font-size:12px;color:var(--text-muted)">${escapeHtml(String(m.value||m.content||'')).slice(0,200)}</div>
         </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:12px">No session memories</div>';
  } catch(e) { document.getElementById('memory-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadHooks() {
  try {
    const r = await rpc('hooks.list', {});
    const hooks = Array.isArray(r) ? r : r?.hooks || [];
    document.getElementById('hooks-list').innerHTML = hooks.length
      ? hooks.map(h => `<div class="nav-item" style="border:1px solid var(--border);margin-bottom:8px">
          <span class="ni-ico">⚡</span>
          <div style="flex:1">
            <div style="font-size:12px">${escapeHtml(h.event||h.name||'hook')}</div>
            <div style="font-size:10px;font-family:var(--mono);color:var(--text-muted)">${escapeHtml(h.actionType||h.type||'')} — ${h.userTriggered ? 'manual' : 'auto'}</div>
          </div>
         </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:12px">No hooks loaded</div>';
  } catch(e) { document.getElementById('hooks-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadMarketplace() {
  try {
    const r = await rpc('marketplace.list', {});
    const items = Array.isArray(r) ? r : r?.packages || r?.items || [];
    document.getElementById('marketplace-list').innerHTML = items.length
      ? items.map(p => `<div class="nav-item" style="border:1px solid var(--border);margin-bottom:8px">
          <span class="ni-ico">◇</span>
          <div style="flex:1">
            <div style="font-size:12px">${escapeHtml(p.name||p.id||'package')}</div>
            <div style="font-size:10px;font-family:var(--mono);color:var(--text-muted)">${escapeHtml(p.description||'')}</div>
          </div>
         </div>`).join('')
      : `<div style="color:var(--text-muted);font-size:12px;margin-bottom:14px">No packages installed</div>
         <button class="nav-item" style="border:1px solid var(--accent);color:var(--accent)" onclick="installMarketplacePkg()">+ Install Package</button>`;
  } catch(e) { document.getElementById('marketplace-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadSkills() {
  try {
    const r = await rpc('skills.list', {});
    const skills = Array.isArray(r) ? r : r?.skills || [];
    document.getElementById('skills-list').innerHTML = skills.length
      ? skills.slice(0,50).map(s => `<div class="nav-item" style="border:1px solid var(--border);margin-bottom:6px">
          <span class="ni-ico">✦</span>
          <div style="flex:1">
            <div style="font-size:12px">${escapeHtml(s.name||s.id||'skill')}</div>
            ${s.description ? `<div style="font-size:10px;color:var(--text-muted)">${escapeHtml(s.description)}</div>` : ''}
          </div>
         </div>`).join('')
      : '<div style="color:var(--text-muted);font-size:12px">No skills registered</div>';
  } catch(e) { document.getElementById('skills-list').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function loadSettings() {
  try {
    const caps = await rpc('gateway.capabilities', {});
    document.getElementById('settings-content').innerHTML = `
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:10px">GATEWAY</div>
          <div style="font-size:12px;color:var(--text-muted)">Provider: <span style="color:var(--text)">${escapeHtml(caps.provider||'—')}</span></div>
          <div style="font-size:12px;color:var(--text-muted)">Model: <span style="color:var(--text)">${escapeHtml(caps.model||'—')}</span></div>
          <div style="font-size:12px;color:var(--text-muted)">API Mode: <span style="color:var(--text)">${escapeHtml(caps.api_mode||'—')}</span></div>
          <div style="font-size:12px;color:var(--text-muted)">Profile: <span style="color:var(--text)">${escapeHtml(caps.profile||'—')}</span></div>
        </div>
        <div style="border:1px solid var(--border);border-radius:10px;padding:14px">
          <div style="font-size:10px;font-family:var(--mono);letter-spacing:.1em;color:var(--accent);margin-bottom:10px">DESKTOP</div>
          <div style="font-size:12px;color:var(--text-muted)">App: PURPCLAW Desktop v1.0</div>
          <div style="font-size:12px;color:var(--text-muted)">UI: Mission Control (static)</div>
          <div style="font-size:12px;color:var(--text-muted)">Gateway: ws://127.0.0.1:9119</div>
        </div>
      </div>`;
  } catch(e) { document.getElementById('settings-content').innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function runEval(suite) {
  const el = document.getElementById('eval-output');
  el.innerHTML = `<div class="tool-result" style="color:var(--accent)">Running ${suite} suite…</div>`;
  try {
    const r = await rpc('eval.run', { suite, permission_profile: 'autonomous' });
    const cls = r?.ok || r?.passed ? 'success' : 'error';
    el.innerHTML = `<div class="tool-result ${cls}">${escapeHtml(JSON.stringify(r, null, 2))}</div>`;
  } catch(e) { el.innerHTML = `<div class="tool-result error">${escapeHtml(e.message)}</div>`; }
}

async function installMarketplacePkg() {
  const name = prompt('Package name:');
  if (!name) return;
  try {
    const r = await rpc('marketplace.install', { name });
    alert('Installed: ' + JSON.stringify(r));
    loadViewData('marketplace');
  } catch(e) { alert('Error: ' + e.message); }
}

// ── Utilities ───────────────────────────────────────────────────────────────
function escapeHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/\n/g,'<br>');
}

// ── Chat input helpers ───────────────────────────────────────────────────────
const chatInput = document.getElementById('chat-input');
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// ── Boot ─────────────────────────────────────────────────────────────────────
init();
</script>
