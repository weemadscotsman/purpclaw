# ════════════════════════════════════════════════════════════════════════════
#  🕳️ VOID — Postgres hardening + tuning
#  ════════════════════════════════════════════════════════════════════════════
#  Drop into /etc/postgresql/postgresql.conf inside the postgres container.
#  Defaults are conservative for a 1GB-RAM single-instance workload.
# ════════════════════════════════════════════════════════════════════════════

# ── Connection & authentication ──────────────────────────────────────────────
listen_addresses = '*'                       # docker network only — not 0.0.0.0 publicly
port = 5432
max_connections = 100                        # moderate; tune per workload
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# ── TLS ─────────────────────────────────────────────────────────────────────
ssl = on
ssl_cert_file = '/etc/ssl/certs/snakeoil.pem'
ssl_key_file = '/etc/ssl/private/snakeoil.key'
ssl_min_protocol_version = 'TLSv1.3'
ssl_ciphers = 'TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256'

# ── Logging — capture auth failures for incident response ───────────────────
logging_collector = on
log_destination = 'stderr'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on
log_min_duration_statement = 500ms           # log slow queries
log_checkpoints = on
log_connections = on
log_disconnections = on
log_line_prefix = '%m [%p] %q%u@%d/%a from %h '
log_statement = 'ddl'                       # never log 'all' — leaks data
log_temp_files = 10MB

# ── Statement behavior — prevent runaway scans ───────────────────────────────
statement_timeout = 60s
idle_in_transaction_session_timeout = 10min
lock_timeout = 30s

# ── Memory ──────────────────────────────────────────────────────────────────
shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 4MB
maintenance_work_mem = 128MB
huge_pages = try

# ── WAL & checkpoint ────────────────────────────────────────────────────────
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB
checkpoint_completion_target = 0.9
random_page_cost = 1.1                      # SSD

# ── Autovacuum (CRITICAL — don't disable) ───────────────────────────────────
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# ── Query planner ────────────────────────────────────────────────────────────
default_statistics_target = 100
effective_io_concurrency = 200

# ── Locale ──────────────────────────────────────────────────────────────────
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'UTC'
timezone = 'UTC'

# ── Replication / hot standby (if used) ─────────────────────────────────────
wal_log_hints = on
