# ════════════════════════════════════════════════════════════════════════════
#  🕳️ VOID — Hardened nginx config
#  ════════════════════════════════════════════════════════════════════════════
#  Drop into /etc/nginx/nginx.conf inside the nginx container.
#  Security focus: TLS 1.3, HSTS, security headers, rate limiting, request
#  hardening, no info disclosure.
# ════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    # ── Core ────────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;                         # hide nginx version
    more_clear_headers Server;                 # strip Server header

    # ── Logging ─────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log  /var/log/nginx/access.log  main buffer=32k flush=5s;
    error_log   /var/log/nginx/error.log warn;

    # ── Performance / DoS resistance ────────────────────────────────────────
    keepalive_timeout      65;
    keepalive_requests     1000;
    client_max_body_size   10m;              # cap upload size
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout    12s;
    client_header_timeout  12s;
    send_timeout           10s;
    reset_timedout_connection on;

    # ── Compression ─────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # ── Rate limiting zones ─────────────────────────────────────────────────
    # Global: 30 r/s per IP — sane for human users, painful for scrapers.
    limit_req_zone $binary_remote_addr zone=global:10m rate=30r/s;
    # Stricter for auth endpoints: 5 r/min per IP.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Stricter for expensive API: 10 r/s.
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    # Connections per IP — block trivial connection-flood attacks.
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstream: PURPCLAW app ─────────────────────────────────────────────
    upstream purpclaw_app {
        least_conn;
        server app:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ───────────────────────────────────────────────
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        return 301  https://$host$request_uri;
    }

    # ── Main HTTPS server ───────────────────────────────────────────────────
    server {
        listen      443 ssl http2;
        listen      [::]:443 ssl http2;
        server_name _;

        # ── TLS ─────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.3 TLSv1.2;            # TLS 1.0/1.1 are dead
        ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;                  # TLS 1.3 picks first
        ssl_ecdh_curve       X25519:secp384r1;
        ssl_session_cache    shared:SSL:50m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;                       # forward secrecy
        ssl_stapling         on;
        ssl_stapling_verify  on;
        resolver             1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout     5s;

        # ── Limits ──────────────────────────────────────────────────────────
        limit_conn conn_per_ip 50;
        limit_req  zone=global burst=60 nodelay;

        # ── Security headers (loaded from external file for clarity) ────────
        include /etc/nginx/security-headers.conf;

        # ── Proxy to app ────────────────────────────────────────────────────
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://purpclaw_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   $scheme;
            proxy_set_header   X-Forwarded-Host    $host;
            proxy_set_header   X-Forwarded-Port    $server_port;
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       on;
            proxy_buffers         16 16k;
            proxy_busy_buffers_size 32k;
            # Don't forward internal headers
            proxy_hide_header X-Powered-By;
        }

        # ── Auth endpoints — extra-strict rate limit ────────────────────────
        location ~ ^/(login|auth|token|signin|signup|password-reset) {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://purpclaw_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Health check — exposed for load balancers ───────────────────────
        location = /healthz {
            access_log off;
            proxy_pass http://purpclaw_app;
        }

        # ── Block obviously malicious paths ─────────────────────────────────
        location ~* \.(env|git/|svn/|htaccess|DS_Store)$ {
            deny all;
            return 404;
        }

        # ── Static assets — cache aggressively ──────────────────────────────
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri @proxy;
        }
        location @proxy {
            proxy_pass http://purpclaw_app;
        }
    }
}
