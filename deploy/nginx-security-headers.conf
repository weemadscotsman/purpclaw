# ════════════════════════════════════════════════════════════════════════════
#  🕳️ VOID — Security headers (included by nginx-hardened.conf)
#  ════════════════════════════════════════════════════════════════════════════
#  Scored against Mozilla Observatory "A+" baseline.
#  Add at your location / block via: include /etc/nginx/security-headers.conf;
# ════════════════════════════════════════════════════════════════════════════

# ── HSTS — force HTTPS for 2 years, include subdomains, preload-ready ───────
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# ── Clickjacking protection ─────────────────────────────────────────────────
add_header X-Frame-Options "DENY" always;

# ── MIME-type sniffing protection ───────────────────────────────────────────
add_header X-Content-Type-Options "nosniff" always;

# ── XSS auditor (legacy browsers) + Reflected XSS filter ────────────────────
add_header X-XSS-Protection "1; mode=block" always;

# ── Referrer policy — only send origin on cross-origin ─────────────────────
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ── Permissions policy — disable features we don't use ──────────────────────
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# ── Content Security Policy ─────────────────────────────────────────────────
# Tune the script-src / connect-src / img-src to match your app's needs.
# This is the conservative baseline; tighten per-route as required.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;

# ── Cross-Origin policies ───────────────────────────────────────────────────
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ── Prevent caching of sensitive responses by intermediaries ────────────────
add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;

# ── Clear-Policy-Data (for OAuth logout flows) ──────────────────────────────
add_header Clear-Site-Data "" always;
