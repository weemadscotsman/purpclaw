# ─────────────────────────────────────────────────────────────────────────────
# 7. INTERNAL CROSS-SERVICE
# ─────────────────────────────────────────────────────────────────────────────
PURPCLAW_GATEWAY_URL:
  category: "Internal cross-service"
  purpose: "OpenClaw WebSocket gateway URL"
  required: false
  default: "ws://127.0.0.1:18789"
  validation: "ws:// or wss:// URL"
  consumers:
    - purpclaw-chorus
    - ecosystem.config.js (env spread)

PURPCLAW_GATEWAY_TOKEN:
  category: "Internal cross-service"
  purpose: "Auth token for the OpenClaw gateway"
  required: false
  sensitive: true
  consumers: [purpclaw-chorus, ecosystem.config.js]

INTERNAL_API_KEY:
  category: "Internal cross-service"
  purpose: "Service-to-service auth key (rotates via ops)"
  required: false
  default: "(empty)"
  validation: "long random hex; min 32 chars"
  example: "cc0da107aecda464289830b7e96d83b4afc9d83c881fe50c8b5f6d1a97350096"
  sensitive: true
  consumers: [internal service-to-service auth]

MCP_BRIDGE_URL:
  category: "Internal cross-service"
  purpose: "MCP bridge HTTP server URL"
  required: false
  default: "http://localhost:3001"
  validation: "http(s):// URL"
  consumers: [MCP bridge]

XIAOZHI_MCP_URL:
  category: "Internal cross-service"
  purpose: "Xiaozhi MCP WebSocket URL (with embedded JWT token)"
  required: false
  default: "(empty)"
  validation: "wss:// URL containing ?token=…"
  sensitive: true
  consumers:
    - purpclaw-api
    - purpclaw-chorus
    - ecosystem.config.js

XIAOZHI_WS_URL:
  category: "Internal cross-service"
  purpose: "Xiaozhi WS alias (currently same value as XIAOZHI_MCP_URL)"
  required: false
  sensitive: true
  consumers: [purpclaw-api]

AGENT_FRAMEWORKS_DIR:
  category: "Internal cross-service"
  purpose: "kiro roles/contexts/steering directory override"
  required: false
  default: "local ./agent-frameworks/, then C:\\Users\\Admin\\Desktop\\agent-frameworks"
  validation: "absolute or relative directory path"
  consumers: [agent frameworks loader]

TMPDIR:
  category: "Internal cross-service"
  purpose: "Per-service temp dir (hardcoded in ecosystem.config.js to E:\\purp-temp)"
  required: false
  default: "E:\\purp-temp"
  consumers: [all PM2 services]

# ─────────────────────────────────────────────────────────────────────────────
# 8. RATE LIMITS
# ─────────────────────────────────────────────────────────────────────────────
PURPCLAW_RATE_LIMIT:
  category: "Rate limits"
  purpose: "Master rate-limit switch (1 = enabled, 0 = off)"
  required: false
  default: 1
  validation: "0 or 1"
  consumers: [API rate limiter]

PURPCLAW_RATE_LIMIT_WINDOW_MS:
  category: "Rate limits"
  purpose: "Window size for rate limiter"
  required: false
  default: 60000
  validation: "integer > 0 (milliseconds)"
  consumers: [API rate limiter]

PURPCLAW_RATE_LIMIT_READ:
  category: "Rate limits"
  purpose: "Read requests per window"
  required: false
  default: 240
  validation: "integer >= 0"
  consumers: [API rate limiter]

PURPCLAW_RATE_LIMIT_WRITE:
  category: "Rate limits"
  purpose: "Write requests per window"
  required: false
  default: 60
  validation: "integer >= 0"
  consumers: [API rate limiter]

PURPCLAW_RATE_LIMIT_STREAM:
  category: "Rate limits"
  purpose: "Stream requests per window"
  required: false
  default: 30
  validation: "integer >= 0"
  consumers: [API rate limiter]

# ─────────────────────────────────────────────────────────────────────────────
# 9. DEEP RESEARCH GROUP
# ─────────────────────────────────────────────────────────────────────────────
PURPCLAW_RESEARCH_CONCURRENCY:
  category: "Deep research group"
  purpose: "Max parallel model calls in the research model room"
  required: false
  default: 2
  validation: "integer 1-16"
  consumers: [deep research group]

PURPCLAW_RESEARCH_MIN_DELAY_MS:
  category: "Deep research group"
  purpose: "Gap between research-call starts (ms)"
  required: false
  default: 1500
  validation: "integer >= 0"
  consumers: [deep research group]

PURPCLAW_RESEARCH_PER_PROVIDER:
  category: "Deep research group"
  purpose: "Max active research calls per provider"
  required: false
  default: 1
  validation: "integer >= 1"
  consumers: [deep research group]

PURPCLAW_RESEARCH_CALL_TIMEOUT_MS:
  category: "Deep research group"
  purpose: "Per-model hard deadline (ms)"
  required: false
  default: 90000
  validation: "integer >= 1000"
  consumers: [deep research group]

PURPCLAW_RESEARCH_COST_CAP_USD:
  category: "Deep research group"
  purpose: "Hard USD cost cap per research batch"
  required: false
  default: 5.0
  validation: "float > 0"
  consumers: [deep research group]

# ─────────────────────────────────────────────────────────────────────────────
# 10. OPERATOR FLAGS
# ─────────────────────────────────────────────────────────────────────────────
EVOLUTION_DISABLED:
  category: "Operator flags"
  purpose: "Disable the self-evolution loop (1 = disabled)"
  required: false
  default: 0
  validation: "0 or 1"
  consumers: [self-evolution loop]

POCKET_MODE:
  category: "Operator flags"
  purpose: "Local-vs-cloud routing mode"
  required: false
  default: "hybrid"
  validation:
    enum: [off, local, hybrid, cloud]
  consumers: [pocket routing layer]

PURPCLAW_MOCHI_SEED:
  category: "Operator flags"
  purpose: "Mochi seed flag (deterministic init?)"
  required: false
  default: 1
  validation: "integer"
  consumers: [mochi init]

PURPCLAW_SHOW_THINK:
  category: "Operator flags"
  purpose: "Expose thinking blocks in chat responses (1 = show)"
  required: false
  default: 1
  validation: "0 or 1"
  consumers: [chat renderer]

PURPCLAW_PROACTIVE:
  category: "Operator flags"
  purpose: "Enable proactive reasoning loop (1 = on)"
  required: false
  default: 1
  validation: "0 or 1"
  consumers: [purpclaw-reasoning]

PURPCLAW_MISSION_SANDBOX:
  category: "Operator flags"
  purpose: "Re-enable git-worktree isolation for missions (1 = on; disabled by default since 2026-06-18)"
  required: false
  default: 0
  validation: "0 or 1"
  consumers: [purpclaw-coordinator, missions]

PURPCLAW_RESERVE_MINIMAX:
  category: "Operator flags"
  purpose: "Reserve MiniMax key for specific scopes (1 = reserve)"
  required: false
  default: 0
  validation: "0 or 1"
  consumers: [purpclaw-tower, MiniMax key guard]

PURPCLAW_MINIMAX_ALLOWED_SCOPES:
  category: "Operator flags"
  purpose: "Comma-separated allowlist of MiniMax key use scopes"
  required: false
  default: "(unset)"
  example: "main-agent,purpclaw-main,operator-explicit,chat"
  validation: "csv of {main-agent,purpclaw-main,operator-explicit,chat,…}"
  consumers: [MiniMax key guard]

PURPCLAW_ALLOW_MINIMAX_CHAT_BACKEND:
  category: "Operator flags"
  purpose: "Allow MiniMax key to power the chat backend (1 = allow)"
  required: false
  default: 0
  validation: "0 or 1"
  consumers: [chat backend router]

MINIMAX_TTS_USE_MAIN_KEY:
  category: "Operator flags"
  purpose: "TTS engine may use the main MiniMax key (1 = yes)"
  required: false
  default: 0
  validation: "0 or 1"
  consumers: [TTS subsystem]

PURPCLAW_MAX_ACTIVE_AGENTS:
  category: "Operator flags"
  purpose: "Hard cap on concurrent agents in the tower"
  required: false
  default: 100
  validation: "integer 1-1000"
  consumers: [purpclaw-tower]

PURPCLAW_MAX_ACTIVE_PER_DIVISION:
  category: "Operator flags"
  purpose: "Per-division cap on concurrent agents"
  required: false
  default: 12
  validation: "integer 1-100"
  consumers: [purpclaw-tower]

PURPCLAW_SPAWN_COOLDOWN_MS:
  category: "Operator flags"
  purpose: "Cooldown between agent spawns (ms)"
  required: false
  default: 1000
  validation: "integer >= 0"
  consumers: [purpclaw-tower]

PURPCLAW_TICK_MS:
  category: "Operator flags"
  purpose: "Reasoning-loop tick interval (ms)"
  required: false
  default: 30000
  validation: "integer >= 100"
  consumers: [purpclaw-reasoning]

WORKER_MAX_CONCURRENT:
  category: "Operator flags"
  purpose: "Max concurrent worker jobs"
  required: false
  default: 4
  validation: "integer >= 1"
  consumers: [purpclaw-workers]

WORKER_SECRET:
  category: "Operator flags"
  purpose: "HMAC secret for worker auth (empty disables auth)"
  required: false
  default: ""
  validation: "non-empty string enables auth"
  sensitive: true
  consumers: [purpclaw-workers]

PURPCLAW_MAX_QUEUE_DEPTH:
  category: "Operator flags"
  purpose: "Orchestrator queue depth cap"
  required: false
  default: 20
  validation: "integer >= 1"
  consumers: [purpclaw-orchestrator]

PURPCLAW_MAX_ACTIVE_WORKFLOWS:
  category: "Operator flags"
  purpose: "Max active workflows in orchestrator"
  required: false
  default: 3
  validation: "integer >= 1"
  consumers: [purpclaw-orchestrator]

PURPCLAW_WORKFLOW_RETRIES:
  category: "Operator flags"
  purpose: "Workflow retry count on failure"
  required: false
  default: 1
  validation: "integer >= 0"
  consumers: [purpclaw-orchestrator]

STT_MODEL:
  category: "Operator flags / STT"
  purpose: "Whisper model size (tiny|base|small|medium|large)"
  required: false
  default: "base"
  validation:
    enum: [tiny, base, small, medium, large]
  consumers: [purpclaw-stt]

STT_DEVICE:
  category: "Operator flags / STT"
  purpose: "Whisper inference device"
  required: false
  default: "cpu"
  validation:
    enum: [cpu, cuda]
  consumers: [purpclaw-stt]

STT_COMPUTE:
  category: "Operator flags / STT"
  purpose: "Whisper compute type"
  required: false
  default: "int8"
  example: "float16, int8"
  consumers: [purpclaw-stt]

STT_LANGUAGE:
  category: "Operator flags / STT"
  purpose: "Force STT language (blank = auto-detect)"
  required: false
  default: ""
  example: "en"
  consumers: [purpclaw-stt]

VOICE_WAKE_WORD:
  category: "Operator flags / Voice"
  purpose: "Wake-word phrase for voice ingress"
  required: false
  default: ""
  consumers: [purpclaw-voice-ingress]

