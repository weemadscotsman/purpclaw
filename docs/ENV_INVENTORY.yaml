# ═══════════════════════════════════════════════════════════════════════════
# PURPCLAW — Environment Variable Inventory
# ═══════════════════════════════════════════════════════════════════════════
# Generated by 🌵 CACTUS — Efficiency Auditor (Infrastructure division)
# Source of truth: .env.example, .env (live values), ecosystem.config.js,
#                  lib/llm-provider.js, agent_tower.js, orchestrator.js,
#                  voice_*.py, voice_stt.py, lib/reasoning-loop.js,
#                  lib/context-bus.js, swarm_coordinator.js,
#                  worker_service.js, lib/goop-playground/
#
# Convention:
#   - All vars are uppercase. Snake-case for prefixes. UPPER_SNAKE for body.
#   - "Provider-native" = the per-provider key vars (NVIDIA_API_KEY, etc.)
#   - "Lane key" = one of NVIDIA_API_KEY_PURP1..5 / BACKUP1..5 / HERMES
#   - "Required" = TRUE only if no value → service refuses to start
#   - "Default"  = what the code falls back to when unset (per source files)
#
# Re-render any time by inspecting .env.example + .env + ecosystem.config.js
# ═══════════════════════════════════════════════════════════════════════════

meta:
  generator: CACTUS
  generated_for: PURPCLAW
  project_root: "."
  schema_version: "1.0.0"
  total_vars: 95
  categories:
    - LLM primary
    - LLM fallback
    - Swarm
    - Per-provider API keys
    - NVIDIA NIM 5-lane key pool
    - Service ports
    - Internal cross-service
    - Rate limits
    - Deep research group
    - Operator flags
    - Optional integrations
    - Debug
    - Runtime/service-specific

# ─────────────────────────────────────────────────────────────────────────────
# 1. PRIMARY LLM PROVIDER
# ─────────────────────────────────────────────────────────────────────────────
LLM_PROVIDER:
  category: "LLM primary"
  purpose: "Active provider id used by orchestration/planning/'ask' command"
  required: false
  default: "openai"      # per lib/llm-provider.js resolveConfig()
  example: "nvidia"
  validation:
    enum:
      - openai
      - anthropic
      - gemini
      - kimi
      - glm
      - minimax
      - groq
      - deepseek
      - nvidia
      - huggingface
      - cloudflare
      - cohere
      - openrouter
      - together
      - mistral
      - ollama
      - lmstudio
      - github-models
      - codex
      - codex-oauth
      - atomic-chat
      - custom
  consumers:
    - purpclaw-api (unified_api.js)
    - purpclaw-tower (agent_tower.js)
    - purpclaw-orchestrator (orchestrator.js)
    - lib/llm-provider.js (mainConfig)
    - bin/purpclaw.js (CLI)

LLM_MODEL:
  category: "LLM primary"
  purpose: "Default model name for the active provider"
  required: false
  default: "provider-specific (qwen2.5:3b for ollama, meta/llama-3.1-70b-instruct for nvidia, etc.)"
  example: "minimaxai/minimax-m3"
  validation: "provider-specific string; no fixed regex"
  consumers:
    - purpclaw-api
    - purpclaw-tower
    - purpclaw-orchestrator
    - lib/llm-provider.js

LLM_API_KEY:
  category: "LLM primary"
  purpose: "Override key for the active provider; falls back to per-provider alias"
  required: false
  default: "(empty)"
  example: "sk-…"
  validation: "non-empty string; typically sk-/gsk_/AIza…/nvapi-… prefix"
  sensitive: true
  consumers:
    - purpclaw-api
    - purpclaw-tower
    - purpclaw-orchestrator
    - lib/llm-provider.js

LLM_BASE_URL:
  category: "LLM primary"
  purpose: "Override base URL — only honoured for 'custom' or 'atomic-chat'"
  required: false
  default: "(provider's native baseUrl)"
  example: "http://localhost:11434/v1"
  validation: "URL with scheme http(s); only consumed when LLM_PROVIDER in {custom, atomic-chat}"
  consumers:
    - lib/llm-provider.js (resolveConfig)

# ─────────────────────────────────────────────────────────────────────────────
# 2. LOCAL FALLBACK
# ─────────────────────────────────────────────────────────────────────────────
LLM_FALLBACK:
  category: "LLM fallback"
  purpose: "Local fallback provider when primary fails"
  required: false
  default: "(unset)"
  example: "ollama"
  validation:
    enum: [ollama, lmstudio, off]
  consumers:
    - lib/llm-provider.js

LLM_FALLBACK_MODEL:
  category: "LLM fallback"
  purpose: "Model used by the local fallback provider"
  required: false
  default: "qwen2.5:3b"
  example: "llama3.2:3b"
  validation: "string"
  consumers:
    - lib/llm-provider.js

LLM_FALLBACK_BASE_URL:
  category: "LLM fallback"
  purpose: "Override base URL for fallback provider"
  required: false
  default: "http://localhost:11434/v1"
  example: "http://localhost:1234/v1"
  validation: "URL"
  consumers:
    - lib/llm-provider.js

# ─────────────────────────────────────────────────────────────────────────────
# 3. SWARM PROVIDER (heavy reasoning, 100-wide agent fanout)
# ─────────────────────────────────────────────────────────────────────────────
SWARM_PROVIDER:
  category: "Swarm"
  purpose: "Optional separate provider for the parallel agent engine"
  required: false
  default: "(falls back to LLM_PROVIDER)"
  example: "kimi"
  validation: "string; same enum as LLM_PROVIDER"
  consumers:
    - purpclaw-tower (agent_tower.js)
    - lib/llm-provider.js (swarmConfig)

SWARM_MODEL:
  category: "Swarm"
  purpose: "Model for swarm engine (Kimi K2.6 = 100-wide fanout)"
  required: false
  default: "kimi-k2-6 (if SWARM_PROVIDER=kimi)"
  example: "kimi-k2-6"
  validation: "string"
  consumers:
    - purpclaw-tower
    - lib/llm-provider.js

SWARM_API_KEY:
  category: "Swarm"
  purpose: "Key for swarm provider (falls back to KIMI_API_KEY then LLM_API_KEY)"
  required: false
  default: "(empty)"
  example: "sk-…"
  validation: "string"
  sensitive: true
  consumers:
    - purpclaw-tower
    - lib/llm-provider.js

