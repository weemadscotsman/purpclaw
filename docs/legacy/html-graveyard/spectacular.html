<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAGIC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .magic-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 8rem;
            font-weight: bold;
            text-shadow: 0 0 50px #ff00ff, 0 0 100px #ff00ff;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }
        .instruction {
            position: fixed;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            opacity: 0.7;
            z-index: 10;
            pointer-events: none;
        }
        .cursor {
            position: fixed;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000;
            transition: transform 0.1s ease;
        }
        .cursor-trail {
            position: fixed;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, #ff00ff, transparent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: fadeOut 1s forwards;
        }
        @keyframes fadeOut {
            to { opacity: 0; transform: scale(0); }
        }
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
        }
        .power-meter {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 200px;
            height: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            z-index: 100;
        }
        .power-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            transition: width 0.1s ease;
        }
        .power-label {
            position: fixed;
            top: 45px;
            right: 20px;
            font-size: 0.9rem;
            opacity: 0.7;
            z-index: 100;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="magic-text">MAGIC</div>
    <div class="instruction">Move mouse to charge. Click to release. Hold for bigger explosions.</div>
    <div class="cursor" id="cursor"></div>
    <div class="glitch-overlay"></div>
    <div class="power-meter">
        <div class="power-fill" id="powerFill"></div>
    </div>
    <div class="power-label">POWER: <span id="powerText">0</span>%</div>
    <script>        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        let particles = [];
        let mouseX = canvas.width / 2;
        let mouseY = canvas.height / 2;
        let power = 0;
        let isCharging = false;
        
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.life = Math.random() * 100 + 50;
                this.decay = Math.random() * 0.02 + 0.01;
                this.size = Math.random() * 5 + 2;
            }
            
            update() {
                this.velocity.x *= 0.98;
                this.velocity.y *= 0.98;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
                this.life--;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        function createExplosion(x, y, intensity) {
            const colors = ['#ff00ff', '#00ffff', '#ffff00', '#ff0080', '#00ff80', '#8000ff'];
            const particleCount = Math.floor(intensity * 2);
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i;
                const speed = Math.random() * intensity / 5 + 2;
                const velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                const color = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, color, velocity));
            }
            
            // Add shockwave effect
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * intensity / 3 + 5;
                const velocity = {
                    x: Math.cos(angle) * speed,
                    y: Math.sin(angle) * speed
                };
                particles.push(new Particle(x, y, '#ffffff', velocity));
            }
        }
        
        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles = particles.filter(p => p.alpha > 0 && p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            
            requestAnimationFrame(animate);
        }
        
        animate();
        
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            
            power = Math.min(power + 2, 100);
            document.getElementById('powerFill').style.width = power + '%';
            document.getElementById('powerText').textContent = Math.floor(power);
            
            const cursor = document.getElementById('cursor');
            cursor.style.left = (mouseX - 10) + 'px';
            cursor.style.top = (mouseY - 10) + 'px';
            
            if (Math.random() < 0.3) {
                const trail = document.createElement('div');
                trail.className = 'cursor-trail';
                trail.style.left = (mouseX - 5) + 'px';
                trail.style.top = (mouseY - 5) + 'px';
                document.body.appendChild(trail);
                setTimeout(() => trail.remove(), 1000);
            }
        });
        
        document.addEventListener('mousedown', (e) => {
            isCharging = true;
        });
        
        document.addEventListener('mouseup', (e) => {
            if (isCharging) {
                createExplosion(mouseX, mouseY, power);
                power = 0;
                document.getElementById('powerFill').style.width = '0%';
                document.getElementById('powerText').textContent = '0';
                isCharging = false;
            }
        });
        
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                createExplosion(
                    Math.random() * canvas.width,
                    Math.random() * canvas.height,
                    100
                );
            }
        });
    </script>
</body>
</html>
