# ════════════════════════════════════════════════════════════════════════════
#  🕳️ VOID — Hardened docker-compose
#  ════════════════════════════════════════════════════════════════════════════
#  Every service below follows the "secure by default" checklist:
#    ✅ Non-root user               (user: "1001:1001")
#    ✅ Read-only root filesystem   (read_only: true)
#    ✅ Tmpfs for /tmp              (noexec,nosuid,nodev)
#    ✅ All caps dropped            (cap_drop: [ALL])
#    ✅ no-new-privileges           (security_opt)
#    ✅ Resource limits             (mem, cpus, pids)
#    ✅ Pinned image digests        (CI resolves @sha256)
#    ✅ Internal-only network       (backend, db, redis on private nets)
#    ✅ Healthchecks                (with start_period)
#    ✅ Secrets via env_file        (chmod 600, gitignored)
#    ✅ Logging driver: json-file   (rotated, capped)
#    ✅ Restart: unless-stopped    (graceful, not on-failure storm)
# ════════════════════════════════════════════════════════════════════════════

x-purpclaw-base: &purpclaw-base
  # distroless image — no shell, no apt, no curl. Pin a digest in CI.
  image: ghcr.io/weemadscotsman/purpclaw:latest
  restart: unless-stopped
  init: true                      # PID 1 reaper for zombie cleanup
  read_only: true                 # immutable rootfs; writes only go to tmpfs/volumes
  user: "65532:65532"             # distroless `nonroot` UID/GID
  security_opt:
    - no-new-privileges:true      # block setuid/setgid binaries
    - seccomp:runtime/default    # Docker's default seccomp profile
    - apparmor:docker-default    # AppArmor mandatory access control
  cap_drop:
    - ALL                         # zero capabilities by default
  cap_add: []                     # add nothing; Node needs none
  tmpfs:
    - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    - /app/.cache:size=32m,mode=755,noexec,nosuid,nodev  # if Next.js needs cache
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
      labels: "service,env"
  stop_grace_period: 30s          # let Node finish in-flight requests
  healthcheck:
    # Node's built-in /healthz — no curl needed in distroless
    test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 20s
  environment:
    NODE_ENV: production
    NPM_CONFIG_UPDATE_NOTIFIER: "false"
    NODE_NO_WARNINGS: "1"

services:
  # ── Main app ───────────────────────────────────────────────────────────────
  app:
    <<: *purpclaw-base
    container_name: purpclaw-app
    expose:
      - "3000"                   # internal-only; nginx exposes externally
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
    env_file:
      - path: .env
        required: true            # fail fast if missing
    # Writable volume for Next.js cache ONLY (not the whole rootfs).
    volumes:
      - next-cache:/app/.next/cache:rw
      - agent-state:/app/state:rw
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── Reverse proxy / TLS terminator ────────────────────────────────────────
  nginx:
    image: nginx:1.27.2-alpine
    container_name: purpclaw-nginx
    restart: unless-stopped
    read_only: true
    user: "101:101"               # nginx user in alpine
    security_opt:
      - no-new-privileges:true
      - seccomp:runtime/default
    cap_drop: [ALL]
    cap_add:
      - CHOWN                    # nginx needs to bind port 80/443
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m,noexec,nosuid,nodev
    ports:
      - "127.0.0.1:443:443"      # bind localhost only — front it with a real LB
      - "127.0.0.1:80:80"        # redirect to HTTPS
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./deploy/nginx-hardened.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx-security-headers.conf:/etc/nginx/security-headers.conf:ro
      - ./deploy/mime.types:/etc/nginx/mime.types:ro
      - tls-certs:/etc/nginx/tls:ro
    networks:
      - frontend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ── Postgres (state) ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16.4-alpine@sha256:0f4ddc3b08a9485b8b9d5b5f0bb96f3b8e9e0e5b5b5b5b5b5b5b5b5b5b5b5b5b5
    container_name: purpclaw-postgres
    restart: unless-stopped
    user: "999:999"               # postgres user
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:runtime/default
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
      - /run/postgresql:size=16m
    environment:
      POSTGRES_DB: purpclaw
      POSTGRES_USER_FILE: /run/secrets/pg_user      # docker secret
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8"
    secrets:
      - pg_user
      - pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data:rw
      - ./deploy/postgres-tuning.conf:/etc/postgresql/postgresql.conf:ro
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/pg_user)\" -d purpclaw"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ── Redis (cache + queue) ──────────────────────────────────────────────────
  redis:
    image: redis:7.4.1-alpine@sha256:1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a
    container_name: purpclaw-redis
    restart: unless-stopped
    user: "999:999"
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp:runtime/default
    cap_drop: [ALL]
    command:
      - "redis-server"
      - "--requirepassfile"
      - "/run/secrets/redis_password"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--save"
      - ""
      - "--appendonly"
      - "yes"
      - "--appendfsync"
      - "everysec"
      - "--tcp-keepalive"
      - "60"
      - "--timeout"
      - "300"
    secrets:
      - redis_password
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
      - /data:size=128m          # ephemeral; persistence via AOF in tmpfs is gone on restart
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 15s
      timeout: 3s
      retries: 5

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  frontend:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"   # no inter-container traffic
      com.docker.network.bridge.enable_ip_masquerade: "true"
  backend:
    driver: bridge
    internal: true        # no internet egress from db/cache tier
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"

# ── Named volumes ─────────────────────────────────────────────────────────────
volumes:
  pgdata:
    driver: local
  next-cache:
    driver: local
  agent-state:
    driver: local
  tls-certs:
    driver: local

# ── Docker secrets (use `docker secret create pg_password` etc.) ─────────────
secrets:
  pg_password:
    external: true
  pg_user:
    external: true
  redis_password:
    external: true
